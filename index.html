<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>记账</title>
<meta name="description" content="iPhone 快捷指令自动记账 · 说一句记账 · 统计，离线可用，数据同步到你的 GitHub 私有仓库">
<meta name="theme-color" content="#F1F0EC">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ⚠️ 必须是 default，不要改成 black-translucent。
     2026-10-14 真机实测：black-translucent 下 iOS 会让网页铺到状态栏底下，
     但把**屏幕最底那 47px** 让出去 —— 视口底比屏幕底高 47px，底栏永远悬空。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="记账">
<script>
/* 首屏就判定是否「独立 App 模式」（加到主屏后从图标启动）——必须在 CSS 生效前设置，
   否则会先按 Safari 模式渲染一帧（底部多留一段安全区）再跳到正确位置。 */
(function () {
  var sa = 0;
  try {
    if (window.navigator.standalone === true) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) sa = 1;
  } catch (e) {}
  document.documentElement.setAttribute('data-standalone', sa ? '1' : '0');
})();
</script>
<style>
  /* ============================================================
     设计语言（按参考图重做）
     浅暖灰底 + 纯白卡 + 近黑作为唯一重色（大数字、主按钮、悬浮底栏）
     大圆角（卡片 24-28px、控件胶囊）、柔和扩散阴影、深色卡片上用细波纹线
     橙色只做点缀（「全部 ›」、账户卡交叠圆点）
     字号：数字用 tabular-nums 对齐，标题字重 800
     ============================================================ */
  :root{
    --bg:#F1F0EC;
    --card:#FFFFFF;
    --ink:#15171A;
    --ink2:#767B84;
    --ink3:#AAAFB8;
    --line:#ECEAE4;
    --dark:#1A1C20;
    --dark2:#272A31;
    --accent:#FF7A45;
    --amber:#FFC24B;
    --green:#20BF8C;
    --red:#FF5C63;
    --r-xl:30px; --r-lg:24px; --r-md:18px; --r-sm:12px;
    --sh:0 8px 24px rgba(20,22,26,.07), 0 1px 3px rgba(20,22,26,.05);
    --sh2:0 18px 44px rgba(18,20,24,.14);
    --sh-dark:0 22px 46px rgba(12,14,18,.32);
    --f:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
    --tab-h:104px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 禁止双指捏合缩放：viewport 的 user-scalable=no 在 iOS 上会被忽略，touch-action 才管用。
     双击放大也用这条压掉（别用 touchend preventDefault，会吃掉 click）。 */
  html,body{touch-action:pan-x pan-y; overscroll-behavior:none;}
  /* 禁掉长按选中文字 / 长按弹出「拷贝·查询」气泡 / 长按元素被拎起来放大。
     这三样是 Safari 的行为，出现在 App 里就会「一看就是网页」。
     -webkit-touch-callout 管的正是那个气泡和"拎起来"的效果，缺它光禁 user-select 不够。
     注意：输入框必须单独开回来（见下面 input,select,textarea 那条），
     否则 Token 输入框长按弹不出「粘贴」、记账输入框没法长按改字。 */
  html,body{
    -webkit-user-select:none;user-select:none;
    -webkit-touch-callout:none;
  }
  html{-webkit-text-size-adjust:100%; overflow-anchor:none; height:100%; overflow:hidden; background:var(--bg);}
  body{
    height:100%;
    height:var(--app-h, 100%);
    margin:0; background:var(--bg); color:var(--ink);
    font-family:var(--f);
    font-size:15px; line-height:1.45; font-weight:500;
    display:flex; flex-direction:column; overflow:hidden; overflow-anchor:none;
    -webkit-font-smoothing:antialiased;
  }
  button{font-family:inherit; font-weight:700; color:inherit; cursor:pointer; border:none; background:none; padding:0;}
  input,select,textarea{font-family:inherit; font-weight:600; color:var(--ink);}
  /* 输入框例外：上面全局禁了长按选中，这里必须把输入类元素开回来，
     否则 Token 输入框长按弹不出「粘贴」、记账输入框没法长按改字。
     (-webkit-user-select 是给旧版 iOS Safari 的) */
  input,textarea,select,[contenteditable]{
    -webkit-user-select:text; user-select:text;
    -webkit-touch-callout:default;
  }
  /* 干掉数字输入框自带的上下箭头（桌面浏览器上很丑，手机没有但截图会露） */
  input[type=number]::-webkit-outer-spin-button,
  input[type=number]::-webkit-inner-spin-button{-webkit-appearance:none; margin:0;}
  input[type=number]{-moz-appearance:textfield; appearance:textfield;}
  img{display:block;}
  .num{font-variant-numeric:tabular-nums; letter-spacing:-.03em;}
  .muted{color:var(--ink2);}
  .tiny{font-size:12.5px;}
  .k{font-size:13px; font-weight:600; color:var(--ink2);}
  .card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh);}

  /* ---------- 滚动容器 ---------- */
  main{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    padding:calc(14px + env(safe-area-inset-top)) 16px calc(var(--tab-h, 104px) + 10px);
    max-width:600px; width:100%; margin:0 auto;
    position:relative;
  }
  main::-webkit-scrollbar{width:0;}
  .page{display:none;}
  .page.active{display:block; animation:fadeUp .22s ease both;}
  @keyframes fadeUp{from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:none;}}

  /* ---------- 页头 ---------- */
  .pg-head{padding:6px 4px 16px;}
  .pg-head .hk{font-size:13px; font-weight:600; color:var(--ink2);}
  .pg-head h1{margin:2px 0 0; font-size:30px; font-weight:800; letter-spacing:-.5px;}
  .pg-head .row{display:flex; align-items:flex-end; justify-content:space-between; gap:12px;}
  .mnav{display:flex; align-items:center; gap:2px; background:var(--card); border-radius:999px; padding:3px; box-shadow:var(--sh); flex:none;}
  .mnav button{width:34px; height:34px; border-radius:50%; font-size:17px; font-weight:700; color:var(--ink); display:flex; align-items:center; justify-content:center;}
  .mnav button:active{background:var(--bg);}
  .mnav .ym{font-size:13.5px; font-weight:700; min-width:52px; text-align:center; font-variant-numeric:tabular-nums;}

  /* ---------- 首页：问候 ---------- */
  /* 头像用透明底贴纸，整张显示不裁切（原来是照片方形裁切，头被切掉一半） */
  .hello{display:flex; align-items:center; gap:11px; padding:4px 2px 16px;}
  .ava{width:52px; height:52px; border-radius:50%; background:var(--card); box-shadow:var(--sh); flex:none;
       display:flex; align-items:center; justify-content:center; overflow:hidden;}
  .ava img{width:100%; height:100%; object-fit:contain;}
  .hello .who .k2{font-size:12.5px; font-weight:600; color:var(--ink2);}
  .hello .who .n2{font-size:17px; font-weight:800; margin-top:-1px;}
  .bell{margin-left:auto; width:42px; height:42px; border-radius:50%; background:var(--card); box-shadow:var(--sh); display:flex; align-items:center; justify-content:center; position:relative; flex:none;}
  .bell svg{width:21px; height:21px;}
  .bell i{position:absolute; top:9px; right:10px; width:8px; height:8px; border-radius:50%; background:var(--accent); border:2px solid var(--card); display:none;}
  .bell.alert i{display:block;}

  /* ---------- 首页：深色账户卡（叠卡） ---------- */
  .stack{position:relative; height:214px; margin:2px 2px 0; touch-action:pan-y;}
  .ccard{
    position:absolute; left:0; right:0; height:186px; border-radius:var(--r-lg);
    background:var(--dark); color:#fff; overflow:hidden;
    box-shadow:var(--sh-dark);
    /* ⚠️ 不要在这里写 transform 过渡：拖拽时每帧由 JS 写 transform，
       会和过渡打架（拖起来会拖泥带水）。吸附动画走 WAAPI。 */
    will-change:transform;
  }
  /* 拖拽中禁止选中/长按呼出，避免和手势抢事件 */
  .stack.dragging{ cursor:grabbing; }
  .stack.dragging .ccard{ transition:none; }
  .ccard .waves{position:absolute; inset:0; background-repeat:no-repeat; background-size:cover; opacity:.9; pointer-events:none;}
  .ccard .face{position:absolute; inset:0; background-size:cover; background-position:50% 22%; opacity:.30; mix-blend-mode:screen; pointer-events:none;}
  .ccard .veil{position:absolute; inset:0; background:linear-gradient(160deg, rgba(26,28,32,.62), rgba(16,18,22,.92) 62%); pointer-events:none;}
  /* 三张卡的位置不再只靠 class：拖拽时 JS 会在 pos0/pos1/pos2 之间**插值**，
     所以这里给出的只是每个槽位的「基准变换」，由 JS 读取后做连续过渡。 */
  .ccard.pos0{transform:translateY(0) scale(1); z-index:3;}
  .ccard.pos1{transform:translateY(-13px) scale(.962) rotate(-2.1deg); z-index:2; opacity:.62;}
  .ccard.pos2{transform:translateY(-26px) scale(.925) rotate(-4.2deg); z-index:1; opacity:.34;}
  /* 拖拽插值用：JS 把算出来的 transform 写到内联样式上，优先于上面的 class 规则 */
  .ccard.manual{transform:none !important;}
  .ccard .cidx{
    position:absolute; inset:0; padding:20px 22px 18px; display:flex; flex-direction:column; z-index:2;
  }
  .ccard.pos0 .cidx{cursor:default;}
  .ccard .clbl{font-size:12.5px; font-weight:600; color:rgba(255,255,255,.66);}
  .ccard .ctag{margin-left:auto; font-size:11.5px; font-weight:700; color:rgba(255,255,255,.72); background:rgba(255,255,255,.13); padding:3px 10px; border-radius:999px;}
  .ccard .cnum{font-size:38px; font-weight:800; letter-spacing:-1.4px; margin-top:auto; line-height:1.05; font-variant-numeric:tabular-nums;}
  .ccard .cnum small{font-size:20px; font-weight:700; letter-spacing:0;}
  .ccard .cbot{display:flex; align-items:flex-end; gap:12px; margin-top:12px;}
  .ccard .cacc{font-size:14.5px; font-weight:700;}
  .ccard .csub{font-size:11.5px; font-weight:600; color:rgba(255,255,255,.55); margin-top:2px; letter-spacing:.4px; font-variant-numeric:tabular-nums;}
  .ccard .cdot{margin-left:auto; display:flex; align-items:center; flex:none;}
  .ccard .cdot i{width:19px; height:19px; border-radius:50%; display:block;}
  .ccard .cdot i:first-child{background:var(--accent); opacity:.95;}
  .ccard .cdot i:last-child{background:var(--amber); opacity:.9; margin-left:-7px;}
  .dots-nav{display:flex; align-items:center; justify-content:center; gap:6px; margin-top:12px;}
  .dots-nav i{width:6px; height:6px; border-radius:50%; background:#CFCDC7; transition:all .2s;}
  .dots-nav i.on{width:18px; border-radius:3px; background:var(--ink);}

  /* 分类图标圆形底座：任何地方用 .ric 都自带尺寸，
     否则在没有额外约束的容器里（首页最近记录）图片会撑到原始大小。 */
  .ric{width:44px; height:44px; border-radius:50%; display:flex; align-items:center;
       justify-content:center; font-size:19px; flex:none; overflow:hidden;}
  .ric img{width:100%; height:100%; object-fit:cover; display:block;}

  /* ---------- 首页：本月小结（带贴纸的卡） ---------- */
  .mcard{position:relative; margin-top:16px; background:var(--card); border-radius:var(--r-lg);
         box-shadow:var(--sh); padding:16px 18px; overflow:hidden; min-height:96px;}
  .mcard .dec{position:absolute; right:-8px; bottom:-14px; width:104px; height:104px; object-fit:cover;
              border-radius:22px; opacity:.9; pointer-events:none;}
  .mcard .k{font-size:12.5px; font-weight:600; color:var(--ink2); position:relative; z-index:2;}
  .mcard .v{font-size:17px; font-weight:800; margin-top:5px; position:relative; z-index:2;}
  .mcard .sub{font-size:12.5px; font-weight:600; color:var(--ink2); margin-top:5px;
              position:relative; z-index:2; max-width:60%; line-height:1.6;}

  /* ---------- 记一笔：顶部速记行 ---------- */
  .sayq{display:flex; align-items:center; gap:9px; background:var(--card); border-radius:999px;
        padding:6px 6px 6px 18px; box-shadow:var(--sh); margin-bottom:14px;}
  .sayq input{flex:1; min-width:0; border:none; outline:none; background:none; font-size:14.5px; padding:9px 0;}
  .sayq input::placeholder{color:var(--ink3); font-weight:600;}
  .sayq .go{width:38px; height:38px; border-radius:50%; background:var(--dark); display:flex;
            align-items:center; justify-content:center; flex:none; transition:transform .16s;}
  .sayq .go svg{width:18px; height:18px; stroke:#fff;}
  .sayq .go:active{transform:scale(.92);}

  /* ---------- 小节标题 ---------- */
  .sec{display:flex; align-items:center; justify-content:space-between; gap:10px; margin:24px 4px 11px;}
  .sec .t{font-size:18px; font-weight:800; letter-spacing:-.2px;}
  .sec .more{font-size:13.5px; font-weight:700; color:var(--accent); display:flex; align-items:center; gap:3px;}

  /* ---------- 记录行 ---------- */
  .tx{display:flex; align-items:center; gap:12px; padding:11px 14px; cursor:pointer;}
  .tx + .tx{border-top:1px solid var(--line);}
  .tx:active{background:#FAF9F7;}
  .tx .mid{flex:1; min-width:0;}
  .tx .n{font-size:15.5px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .s{font-size:12.5px; font-weight:600; color:var(--ink2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tx .amt{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.3px; flex:none;}
  .tx .amt.in{color:var(--green);}
  .tx .st{display:inline-block; width:6px; height:6px; border-radius:50%; margin:0 5px 2px 0;}
  .list-card{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); overflow:hidden;}

  /* ---------- 空状态 ---------- */
  .empty{padding:34px 20px 30px; text-align:center;}
  .empty img{width:132px; margin:0 auto 10px; filter:drop-shadow(0 10px 18px rgba(20,22,26,.16));}
  .empty .t{font-size:15px; font-weight:700;}
  .empty .s{font-size:13px; font-weight:600; color:var(--ink2); margin-top:4px;}

  /* ---------- 明细：日期条 ---------- */
  .daystrip{display:flex; gap:7px; overflow-x:auto; padding:2px 2px 6px; margin:0 -16px 12px; padding-left:16px; padding-right:16px;}
  .daystrip::-webkit-scrollbar{display:none;}
  .dchip{
    flex:none; width:52px; padding:8px 0 9px; border-radius:16px; background:var(--card);
    box-shadow:var(--sh); display:flex; flex-direction:column; align-items:center; gap:2px;
    /* ⚠️ 这里不能有 transform 过渡：让位期间每个 chip 的 transform 由 JS 每帧写，
       再叠一层 transition 会互相打架（FLIP 的「瞬时回位」会被拖成慢动作）。 */
  }
  .dchip .d1{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
  .dchip .d2{font-size:10.5px; font-weight:600; color:var(--ink2);}
  .dchip .d3{width:5px; height:5px; border-radius:50%; background:var(--accent); opacity:0; margin-top:1px;}
  .dchip.has .d3{opacity:1;}
  .dchip.on{background:var(--dark); box-shadow:var(--sh2);}
  .dchip.on .d1,.dchip.on .d2{color:#fff;}
  .dchip.on .d3{background:var(--amber);}
  .dchip.wide{width:auto; padding-left:14px; padding-right:14px; justify-content:center;}
  /* 标签让位（Expanding Tag Selection）：选中的标签真实变宽，邻居靠 FLIP 平滑让位。
     ⚠️ 宽度必须用具体像素（min-width）而不是 width:auto —— 短标签（"1"）在 auto 下
     不会比默认宽，选中态就看不出来，邻居也就无从让位。
     让位期间每个 chip 的 transform 由 JS 每帧写，所以这里不能有 transform 过渡。 */
  .dchip.sel{width:auto; min-width:74px; padding-left:14px; padding-right:14px;}
  .dchip.sel .d1{font-size:17px;}
  .dchip.sel .d2{color:rgba(255,255,255,.78);}

  /* ---------- 明细：日历（点月份按钮形变展开） ---------- */
  #cal{
    position:absolute; z-index:70; background:var(--card); border-radius:26px;
    box-shadow:var(--sh2); overflow:hidden; display:none;
  }
  #cal.show{display:block;}
  #cal.morphing{pointer-events:none;}
  #calInner{padding:16px 16px 14px;}
  .cal-top{display:flex; align-items:center; gap:8px; margin-bottom:12px;}
  .cal-top .cm{font-size:16px; font-weight:800; font-variant-numeric:tabular-nums;}
  .cal-top .cy{font-size:12.5px; font-weight:600; color:var(--ink2); margin-left:2px;}
  .cal-top .nav{margin-left:auto; display:flex; gap:6px;}
  .cal-top .nav button{width:32px; height:32px; border-radius:50%; background:var(--bg); display:flex; align-items:center; justify-content:center; font-size:16px; font-weight:700;}
  .cal-top .nav button:active{background:#E7E5E0;}
  .cal-wk{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px; margin-bottom:4px;}
  .cal-wk span{text-align:center; font-size:11px; font-weight:700; color:var(--ink3); padding:4px 0;}
  /* ⚠️ 必须 minmax(0,1fr)：纯 1fr 等于 minmax(auto,1fr)，某一格内容偏宽时会把
     整条轨道撑大 → 7 列装不进容器，日期错位、卡片右缘溢出被裁。 */
  .cal-grid{display:grid; grid-template-columns:repeat(7,minmax(0,1fr)); gap:2px;}
  .cal-grid button{
    aspect-ratio:1; min-width:0; border-radius:12px; display:flex; flex-direction:column;
    align-items:center; justify-content:center; gap:2px; font-size:14px; font-weight:700;
    font-variant-numeric:tabular-nums; color:var(--ink); transition:background .15s;
    overflow:hidden;
  }
  .cal-grid button.empty{visibility:hidden;}
  .cal-grid button.today{box-shadow:inset 0 0 0 2px var(--ink);}
  .cal-grid button.has{background:#F2F0EB;}
  .cal-grid button.on{background:var(--dark); color:#fff;}
  .cal-grid button .cd{width:4px; height:4px; border-radius:50%; background:var(--accent);}
  .cal-grid button.on .cd{background:var(--amber);}
  .cal-foot{display:flex; gap:8px; margin-top:12px;}
  .cal-foot button{flex:1; padding:11px 0; border-radius:999px; font-size:13.5px; font-weight:700; background:var(--bg);}
  .cal-foot button.primary{background:var(--dark); color:#fff;}

  /* ---------- 明细：时间轴 ---------- */
  .tl{position:relative; padding-left:26px;}
  .tl::before{content:''; position:absolute; left:7px; top:14px; bottom:14px; width:2px; background:var(--line); border-radius:2px;}
  .tl-day{position:relative; display:flex; align-items:center; gap:8px; margin:16px 0 9px;}
  .tl-day:first-child{margin-top:2px;}
  .tl-day .dd{position:absolute; left:-26px; width:16px; height:16px; border-radius:50%; background:var(--card); box-shadow:0 0 0 2.5px var(--ink) inset;}
  .tl-day.on .dd{background:var(--ink); box-shadow:none;}
  .tl-day .t1{font-size:14px; font-weight:800;}
  .tl-day .t2{font-size:12px; font-weight:600; color:var(--ink2);}
  .tl-day .sum{margin-left:auto; font-size:12.5px; font-weight:700; color:var(--ink2); font-variant-numeric:tabular-nums;}
  .tl-item{position:relative; margin-bottom:9px;}
  .tl-item .dot{position:absolute; left:-25.5px; top:26px; width:13px; height:13px; border-radius:50%; background:var(--card); border:2.5px solid #D8D6D0;}
  /* 左滑删除：.row 是可滑动的那一层，下面垫一块删除底（红底 + 垃圾桶）。
     ⚠️ 滑动中 transform 由 JS 每帧写，所以这里不能有 transform 过渡。 */
  .tl-item{overflow:hidden; border-radius:var(--r-md);}
  .tl-item .row{
    position:relative; z-index:2;
    display:flex; align-items:center; gap:11px; background:var(--card); border-radius:var(--r-md);
    padding:12px 14px; box-shadow:var(--sh); cursor:pointer;
  }
  /* 垫在 .row 下面的删除区（默认被 row 完全盖住） */
  .tl-item .delbg{
    position:absolute; inset:0; z-index:1; border-radius:var(--r-md);
    background:linear-gradient(90deg, rgba(255,92,99,0), var(--red) 34%);
    display:flex; align-items:center; justify-content:flex-end;
    padding-right:20px; gap:8px; color:#fff; font-size:14px; font-weight:800;
    pointer-events:none;
  }
  .tl-item .delbg svg{width:20px; height:20px;}
  .tl-item.armed .delbg{color:#fff;}
  .tl-item.armed .delbg span{transform:scale(1.06);}
  .tl-item .delbg span{transition:transform .16s ease;}
  /* 飞出去之后先藏住，等动画结束再真正删 DOM */
  .tl-item.gone{visibility:hidden;}
  .tl-item.dragging, .tl-item.dragging .row{cursor:grabbing;}
  .tl-item.dark .row{background:var(--dark); color:#fff; box-shadow:var(--sh2);}
  .tl-item.dark .dot{border-color:var(--ink); background:var(--ink);}
  .tl-item.dark .r2{color:rgba(255,255,255,.6);}
  .tl-item .ric{width:40px; height:40px;}
  .tl-item .rmid{flex:1; min-width:0;}
  .tl-item .r1{font-size:15px; font-weight:700; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-item .r2{font-size:12px; font-weight:600; color:var(--ink2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .tl-item .ramt{font-size:15.5px; font-weight:800; font-variant-numeric:tabular-nums; flex:none;}
  .tl-item .ramt.in{color:var(--green);}
  .tl-total{display:flex; align-items:center; justify-content:space-between; margin:18px 0 0; padding:14px 18px; border-radius:var(--r-md); background:var(--card); box-shadow:var(--sh);}
  .tl-total .l{font-size:13px; font-weight:600; color:var(--ink2);}
  .tl-total .v{font-size:19px; font-weight:800; font-variant-numeric:tabular-nums;}

  /* ---------- 统计：分段控件 ---------- */
  .seg{position:relative; display:flex; background:#E7E5E0; border-radius:999px; padding:4px; margin:0 0 20px;}
  /* 液态 Tab：指示器不再靠 translateX 整块平移，而由 JS 用两根弹簧分别驱动
     左右边缘（见 liquidTab()）。这里只给出外观，位置/宽度一律内联。 */
  .seg .pill{position:absolute; top:4px; bottom:4px; left:0; width:0; background:var(--dark); border-radius:999px; box-shadow:0 6px 16px rgba(12,14,18,.28); will-change:transform,width;}
  /* 位置由 JS 弹簧驱动，这里不能再写 transform（会覆盖内联值） */
  .seg button{position:relative; z-index:2; flex:1; padding:11px 0; font-size:14.5px; font-weight:700; color:var(--ink2); display:flex; align-items:center; justify-content:center; gap:7px; transition:color .25s;}
  .seg button svg{width:17px; height:17px;}
  .seg button.on{color:#fff;}

  /* ---------- 统计：刻度表盘 ---------- */
  .dial{position:relative; width:214px; height:214px; margin:26px auto 0;}  .dial-disc{
    position:absolute; inset:0; border-radius:50%; background:var(--card);
    box-shadow:0 14px 34px rgba(20,22,26,.10), 0 2px 6px rgba(20,22,26,.05);
    display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:0 22px;
  }
  .dial-svg{position:absolute; left:50%; top:50%; width:330px; height:330px; margin:-165px 0 0 -165px; overflow:visible; pointer-events:none;}
  .dial-state{font-size:13px; font-weight:700; color:var(--ink2);}
  .dial-state.warn{color:var(--accent);}
  .dial-num{font-size:30px; font-weight:800; letter-spacing:-1px; margin-top:3px; font-variant-numeric:tabular-nums;}
  .dial-sub{font-size:12px; font-weight:700; color:var(--ink2); margin-top:3px;}
  .dial-min,.dial-max{position:absolute; top:186px; font-size:11.5px; font-weight:700; color:var(--ink3); font-variant-numeric:tabular-nums;}
  .dial-min{left:-2px;} .dial-max{right:-2px;}
  /* 贴纸当吉祥物站在表盘左手边的空白里（表盘居中，左侧留出的空档正好站一只）：
     竖着放，完全不压中间的数字；只与最左边那段浅灰刻度轻微重叠，视觉上像贴在卡片前 */
  .dial-sticker{position:absolute; left:-70px; bottom:12px; width:58px; filter:drop-shadow(0 10px 18px rgba(20,22,26,.18)); pointer-events:none; z-index:2;}
  .dial-sticker img{width:100%; height:auto;}
  @media (max-width:375px){ .dial-sticker{left:-50px; bottom:16px; width:50px;} }
  @media (max-width:345px){ .dial-sticker{left:-42px; width:42px;} }

  /* ---------- 统计：指标格 ---------- */
  .grid2{display:grid; grid-template-columns:1fr 1fr; gap:11px; margin-top:18px;}
  .cell{background:var(--card); border-radius:var(--r-md); box-shadow:var(--sh); padding:14px 16px;}
  .cell .k{font-size:12px; font-weight:600;}
  .cell .v{font-size:21px; font-weight:800; margin-top:3px; font-variant-numeric:tabular-nums; letter-spacing:-.5px;}
  .cell .v.in{color:var(--green);}

  /* ---------- 统计：柱状 ---------- */
  .bars{display:flex; align-items:flex-end; gap:7px; height:132px; padding-top:20px;}
  .bar{flex:1; display:flex; flex-direction:column; align-items:center; justify-content:flex-end; height:100%; position:relative; cursor:pointer;}
  .bar .bv{position:absolute; top:-15px; font-size:9.5px; font-weight:700; color:var(--ink2); white-space:nowrap; font-variant-numeric:tabular-nums;}
  .bar .bb{width:100%; border-radius:8px 8px 4px 4px; background:#E3E1DB; min-height:5px; transition:background .2s;}
  .bar.on .bb{background:var(--dark);}
  .bar .bl{font-size:11px; font-weight:700; color:var(--ink2); margin-top:6px; font-variant-numeric:tabular-nums;}
  .bar.on .bl{color:var(--ink);}
  .thinbar{display:flex; align-items:flex-end; gap:2.5px; height:76px;}
  .thinbar i{flex:1; min-width:2px; background:#DEDCD6; border-radius:2px 2px 0 0; min-height:3px;}
  .thinbar i.hi{background:var(--accent);}
  .thinbar i.zero{background:#EDEBE6;}
  /* 统计页底部的贴纸横条：左边一张方形漫画图，右边一只透明贴纸 */
  .stat-strip{display:flex; align-items:center; gap:12px; margin-top:16px; background:var(--card);
              border-radius:var(--r-lg); box-shadow:var(--sh); padding:14px 16px; overflow:hidden;}
  .stat-strip img.sq{width:52px; height:52px; border-radius:16px; object-fit:cover; flex:none;}
  .stat-strip img.pn{width:46px; height:46px; object-fit:contain; flex:none; margin-left:auto;}
  .stat-strip .tx{flex:1; min-width:0;}
  .stat-strip .tx b{display:block; font-size:14.5px; font-weight:800;}
  .stat-strip .tx span{display:block; font-size:12px; font-weight:600; color:var(--ink2); margin-top:3px; line-height:1.6;}

  /* ---------- 分类占比 ---------- */
  .catline{margin-bottom:15px;}
  .catline:last-child{margin-bottom:0;}
  .catline .top{display:flex; align-items:center; gap:9px;}
  .catline .em{width:34px; height:34px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:16px; flex:none; overflow:hidden;}
  .catline .nm{font-size:14.5px; font-weight:700;}
  .catline .am{margin-left:auto; font-size:14.5px; font-weight:800; font-variant-numeric:tabular-nums;}
  .catline .pc{font-size:12px; font-weight:700; color:var(--ink2); width:38px; text-align:right; font-variant-numeric:tabular-nums;}
  .catline .track{height:8px; border-radius:999px; background:#EFEDE8; margin-top:8px; overflow:hidden;}
  .catline .track i{display:block; height:100%; border-radius:999px;}

  /* ---------- 我的 ---------- */
  .me-hero{display:flex; align-items:center; gap:14px; padding:18px;}
  /* 我的页头图：用透明底贴纸 + contain，整只显示不被裁 */
  .me-hero .pic{width:74px; height:74px; border-radius:22px; background:#EFEDE8; overflow:hidden; flex:none;
                display:flex; align-items:center; justify-content:center;}
  .me-hero .pic img{width:100%; height:100%; object-fit:contain;}
  .me-hero .t{font-size:19px; font-weight:800; letter-spacing:-.2px;}
  .me-hero .s{font-size:12.5px; font-weight:600; color:var(--ink2); margin-top:3px;}
  .me-hero .mnum{font-size:26px; font-weight:800; font-variant-numeric:tabular-nums; letter-spacing:-.6px; margin-top:6px;}
  .rows{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); overflow:hidden;}
  .row-i{display:flex; align-items:center; gap:13px; padding:14px 16px; cursor:pointer;}
  .row-i + .row-i{border-top:1px solid var(--line);}
  .row-i:active{background:#FAF9F7;}
  .row-i .ri{width:38px; height:38px; border-radius:50%; display:flex; align-items:center; justify-content:center; flex:none;}
  .row-i .ri svg{width:19px; height:19px;}
  .row-i .rn{font-size:15px; font-weight:700;}
  .row-i .rs{font-size:12px; font-weight:600; color:var(--ink2); margin-top:1px;}
  .row-i .rv{margin-left:auto; font-size:13px; font-weight:700; color:var(--ink3); font-variant-numeric:tabular-nums;}
  .row-i .ar{margin-left:auto; color:var(--ink3); display:flex;}
  .row-i .rv + .ar{margin-left:8px;}
  .me-dark{margin-top:14px; border-radius:var(--r-lg); background:var(--dark); color:#fff; padding:18px; position:relative; overflow:hidden; box-shadow:var(--sh-dark);}
  .me-dark .t{font-size:15px; font-weight:800;}
  .me-dark .s{font-size:12.5px; font-weight:600; color:rgba(255,255,255,.6); margin-top:5px; line-height:1.6; position:relative; z-index:2;}
  .me-dark img{position:absolute; right:-6px; bottom:-10px; width:112px; opacity:.9; pointer-events:none;}
  .me-banner{position:relative; margin-top:14px; border-radius:var(--r-lg); overflow:hidden; box-shadow:var(--sh);}
  .me-banner img{width:100%; height:132px; object-fit:cover; object-position:50% 42%; display:block;}
  .me-banner .cap{position:absolute; left:0; right:0; bottom:0; padding:26px 16px 12px; color:#fff;
                  font-size:15px; font-weight:800; letter-spacing:.4px;
                  background:linear-gradient(transparent, rgba(10,12,16,.78));}
  .foot{text-align:center; font-size:11.5px; font-weight:600; color:var(--ink3); padding:22px 0 6px;}

  /* ---------- 悬浮底栏 ---------- */
  /* fixed + bottom:0 贴屏幕最底。独立模式下可视区已含 Home Indicator 那段，
     不再叠加 env(safe-area-inset-bottom)（叠加就是留两遍，底栏悬空）。 */
  .tabwrap{position:fixed; left:0; right:0; bottom:0; z-index:40; padding:6px 16px calc(12px + env(safe-area-inset-bottom)); pointer-events:none;}
  html[data-standalone="1"] .tabwrap{padding-bottom:12px;}
  .tabbar{
    pointer-events:auto; display:flex; align-items:center; justify-content:space-around;
    background:var(--dark); border-radius:26px; padding:8px 8px;
    box-shadow:var(--sh-dark); max-width:520px; margin:0 auto;
  }
  .tab{flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; padding:6px 0 4px; color:rgba(255,255,255,.46); transition:color .2s;}
  .tab svg{width:22px; height:22px;}
  .tab .tl2{font-size:10.5px; font-weight:700; letter-spacing:.2px;}
  .tab.on{color:#fff;}
  .tab .tdot{width:4px; height:4px; border-radius:50%; background:var(--amber); opacity:0; margin-top:1px;}
  .tab.on .tdot{opacity:1;}
  .tab-add{flex:none; width:56px; display:flex; align-items:center; justify-content:center;}
  .tab-add .plus{
    width:50px; height:50px; border-radius:50%; background:#fff; color:var(--ink);
    display:flex; align-items:center; justify-content:center; box-shadow:0 8px 20px rgba(0,0,0,.34);
    transition:transform .18s cubic-bezier(.34,1.3,.5,1);
  }
  .tab-add .plus svg{width:24px; height:24px;}
  .tab-add:active .plus{transform:scale(.9);}

  /* ---------- 弹层 ---------- */
  #mask{position:fixed; inset:0; background:rgba(16,18,22,.42); backdrop-filter:blur(3px); -webkit-backdrop-filter:blur(3px); z-index:60; display:none; align-items:flex-end; justify-content:center;}
  #mask.show{display:flex;}
  #sheet{
    width:100%; max-width:560px; max-height:90vh; overflow-y:auto;
    background:var(--bg); border-radius:var(--r-xl) var(--r-xl) 0 0;
    animation:sheetUp .26s cubic-bezier(.22,.9,.24,1);
    padding-bottom:calc(14px + env(safe-area-inset-bottom));
  }
  html[data-standalone="1"] #sheet{padding-bottom:14px;}
  @keyframes sheetUp{from{transform:translateY(40px);} to{transform:none;}}
  /* Trigger Morph 期间：外壳由 WAAPI 控制几何，内容整体延迟淡入。
     形变中必须裁掉溢出的内容，否则文字会跟着尺寸被拉伸。 */
  #sheet.morphing{animation:none; overflow:hidden; pointer-events:none;}
  #sheet.morphing > *{pointer-events:none;}
  .sheet-head{
    position:sticky; top:0; z-index:3; background:var(--bg);
    padding:16px 20px 10px; display:flex; align-items:center; gap:10px;
  }
  .sheet-head h2{margin:0; font-size:20px; font-weight:800; letter-spacing:-.3px; flex:1;}
  .sheet-head .x{width:34px; height:34px; border-radius:50%; background:var(--card); box-shadow:var(--sh); display:flex; align-items:center; justify-content:center; flex:none;}
  .sheet-head .x svg{width:16px; height:16px;}
  .sheet-body{padding:4px 16px 8px;}

  /* ---------- 记一笔 ---------- */
  .type-seg{position:relative; display:flex; background:#E7E5E0; border-radius:999px; padding:4px; margin-bottom:16px;}
  .type-seg .pill{position:absolute; top:4px; bottom:4px; left:0; width:0; background:var(--dark); border-radius:999px; will-change:transform,width;}
  /* 收入态只换颜色，位置/宽度由 JS 弹簧决定 */
  .type-seg.in .pill{background:#12805F;}
  .type-seg button{position:relative; z-index:2; flex:1; padding:11px 0; font-size:14.5px; font-weight:700; color:var(--ink2); transition:color .25s;}
  .type-seg button.on{color:#fff;}
  .amt-box{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); padding:18px; margin-bottom:14px; text-align:center;}
  .amt-box .lb{font-size:12px; font-weight:600; color:var(--ink2);}
  .amt-in{display:flex; align-items:center; justify-content:center; gap:4px; margin-top:6px;}
  .amt-in .cny{font-size:26px; font-weight:800; color:var(--ink3);}
  .amt-in input{
    border:none; outline:none; background:none; width:100%; max-width:230px; text-align:center;
    font-size:40px; font-weight:800; letter-spacing:-1.5px; font-variant-numeric:tabular-nums; padding:0;
  }
  .amt-in input::placeholder{color:#D3D1CB;}
  .fld{background:var(--card); border-radius:var(--r-lg); box-shadow:var(--sh); padding:16px; margin-bottom:14px;}
  .fld > .lb{display:block; font-size:12.5px; font-weight:700; color:var(--ink2); margin-bottom:11px;}
  .fld input[type=text],.fld input[type=number],.fld input[type=password],.fld input[type=datetime-local]{
    width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    border:none; outline:none; background:#F6F5F2; border-radius:14px; padding:13px 14px;
    /* ⚠️ 必须 ≥16px：iOS 上 focus 一个字号 <16px 的输入框会自动放大整个页面，
       放大后输入框看起来"突出来"了（经典 iOS 坑）。 */
    font-size:16px;
  }
  /* ⚠️ 原生日期时间控件（iOS 版）有自己的内在宽度和内边距，会顶破圆角底。
     去掉原生外观 + 显式锁死宽度，让它老老实实待在框里。 */
  .fld input[type=datetime-local]{
    -webkit-appearance:none; appearance:none;
    display:block; text-align:left; height:auto;
  }
  .fld input[type=datetime-local]::-webkit-date-and-time-value{text-align:left; margin:0;}
  .fld input[type=datetime-local]::-webkit-calendar-picker-indicator{margin:0; padding:0; opacity:.55;}
  .fld textarea{
    width:100%; min-width:0; max-width:100%; box-sizing:border-box;
    border:none; outline:none; background:#F6F5F2; border-radius:14px; padding:13px 14px;
    /* 16px 同样是为了不触发 iOS 的聚焦放大 */
    font-size:16px; line-height:1.5; resize:vertical;
  }
  .fld input[type=file]{font-size:14px; padding:11px 12px;}
  .fld input::placeholder{color:var(--ink3); font-weight:600;}
  .hint{font-size:12px; font-weight:600; color:var(--ink2); margin-top:9px; line-height:1.6;}
  .hint b{font-weight:800; color:var(--ink);}
  .cg{display:grid; grid-template-columns:repeat(4,1fr); gap:10px 2px;}
  .cg button{display:flex; flex-direction:column; align-items:center; gap:7px; padding:6px 0; transition:transform .16s;}
  .cg .cc2{width:54px; height:54px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:21px; background:#F4F3EF; position:relative; transition:box-shadow .2s; overflow:hidden;}
  .cg .cc2 img{width:100%; height:100%; object-fit:cover;}
  .cg .cn2{font-size:11.5px; font-weight:600; color:var(--ink2);}
  .cg button.on .cn2{color:var(--ink); font-weight:800;}
  .cg button.on .cc2{box-shadow:0 0 0 2.5px var(--ink);}
  .cg button:active{transform:scale(.93);}
  .cg .ck{position:absolute; right:-2px; bottom:-2px; width:18px; height:18px; border-radius:50%; background:var(--ink); color:#fff; font-size:11px; display:none; align-items:center; justify-content:center; font-weight:800; z-index:2;}
  .cg button.on .ck{display:flex;}
  .chips{display:flex; flex-wrap:wrap; gap:8px;}
  .chips button{padding:9px 15px; border-radius:999px; background:#F4F3EF; font-size:13.5px; font-weight:700; color:var(--ink2); transition:all .18s;}
  .chips button.on{background:var(--dark); color:#fff;}
  .btn{border-radius:999px; padding:15px 20px; font-size:16px; font-weight:800; background:var(--card); box-shadow:var(--sh); transition:transform .16s;}
  .btn:active{transform:scale(.98);}
  .btn-dark{background:var(--dark); color:#fff; box-shadow:var(--sh2);}
  .btn-full{width:100%; display:block;}
  .btn-row{display:flex; gap:10px;}
  .btn-row .btn{flex:1;}
  .btn-danger{color:var(--red);}

  /* ---------- 弹层里的列表 ---------- */
  .srow{display:flex; align-items:center; gap:12px; background:var(--card); border-radius:var(--r-md); padding:12px 14px; margin-bottom:9px; box-shadow:var(--sh); cursor:pointer;}
  .srow .ic{width:44px; height:44px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:19px; flex:none; overflow:hidden;}
  .srow .mid{flex:1; min-width:0;}
  .srow .n{font-size:15px; font-weight:700;}
  .srow .d{font-size:12px; font-weight:600; color:var(--ink2); margin-top:1px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .srow .tag{font-size:11.5px; font-weight:700; color:var(--ink2); background:#F4F3EF; padding:4px 10px; border-radius:999px; flex:none;}
  .srow .ar{color:var(--ink3); display:flex; flex:none;}
  .badge{display:inline-block; font-size:11.5px; font-weight:700; padding:3px 9px; border-radius:999px; background:#EDEBE6; color:var(--ink2);}
  .badge.y{background:rgba(255,194,75,.28); color:#8A6100;}
  .badge.g{background:rgba(32,191,140,.18); color:#0E7A58;}
  .badge.r{background:rgba(255,92,99,.16); color:#C0303A;}
  .kw-wrap{display:flex; flex-wrap:wrap; gap:8px; margin-top:10px;}
  .kw{background:#F4F3EF; border-radius:999px; padding:7px 12px; font-size:12.5px; font-weight:700; color:var(--ink2);}
  .emo-pick,.col-pick{display:flex; flex-wrap:wrap; gap:9px;}
  .emo-pick button{width:46px; height:46px; border-radius:50%; background:#F4F3EF; font-size:22px; display:flex; align-items:center; justify-content:center;}
  .emo-pick button.on{box-shadow:0 0 0 2.5px var(--ink);}
  .col-pick button{width:40px; height:40px; border-radius:50%;}
  .col-pick button.on{box-shadow:0 0 0 2.5px var(--ink);}
  .snote{text-align:center; font-size:12px; font-weight:600; color:var(--ink3); padding:6px 0 12px;}
  /* 弹层底部的贴纸落款：小圆图 + 一句说明 */
  .sheet-dec{display:flex; align-items:center; gap:11px; padding:10px 4px 6px;}
  .sheet-dec img{width:52px; height:52px; border-radius:16px; object-fit:cover; flex:none;
                 box-shadow:0 6px 14px rgba(20,22,26,.16);}
  .sheet-dec span{font-size:12px; font-weight:600; color:var(--ink3); line-height:1.6;}
  .sync-hero{position:relative; border-radius:var(--r-lg); overflow:hidden; margin-bottom:14px; box-shadow:var(--sh);}
  .sync-hero img{width:100%; height:118px; object-fit:cover; object-position:50% 38%; display:block;}
  .sync-hero .cap{position:absolute; left:0; right:0; bottom:0; padding:24px 16px 12px; color:#fff;
                  font-size:14.5px; font-weight:800; background:linear-gradient(transparent, rgba(10,12,16,.8));}

   跨项切换时宽度先被拉开、再收拢 —— 这个节奏差就是「液态」的拉伸感。
   弹簧保留当前 x/v，所以快速跨项点击会从当前形态自然接续，不会跳。 */
function liquidTab(track, pillSel, btnSel, activeIdx){
  if(!track) return null;
  var pill = track.querySelector(pillSel);
  var btns = track.querySelectorAll(btnSel);
  if(!pill || !btns.length) return null;

  var L = makeSpring(0, 170, 15);   /* 左边缘 */
  var R = makeSpring(0, 230, 16);   /* 右边缘更快 → 拉伸感 */
  var first = true, alive = true;

  function measure(){
    var b = btns[clamp(activeIdx,0,btns.length-1)];
    if(!b) return null;
    var tl = b.offsetLeft;
    var tr = tl + b.offsetWidth;
    return { l:tl, r:tr };
  }
  function apply(){
    /* translateX(min) + width = |R-L|：两根弹簧各自跑，宽度就是它们的差 */
    var l = Math.min(L.x, R.x), r = Math.max(L.x, R.x);
    pill.style.transform = 'translate3d(' + l.toFixed(2) + 'px,0,0)';
    pill.style.width = Math.max(0, r - l).toFixed(2) + 'px';
  }
  function sync(){
    var m = measure();
    if(!m) return;
    L.x = L.t = m.l; L.v = 0;
    R.x = R.t = m.r; R.v = 0;
    apply();
  }
  function set(i){
    activeIdx = i;
    var m = measure();
    if(!m) return;
    L.t = m.l;
    R.t = m.r;
    if(first){ L.x = L.t; R.x = R.t; first = false; }
    if(reduceMotion){ L.x = L.t; L.v = 0; R.x = R.t; R.v = 0; }
    apply();
  }
  /* 初始必须同步写一次，否则首帧前指示器叠在左上角 */
  sync();
  var u = addUpdater(track, function(dt){
    if(!alive) return;
    var moving = Math.abs(L.v) > 0.02 || Math.abs(R.v) > 0.02 ||
                 Math.abs(L.t-L.x) > 0.02 || Math.abs(R.t-R.x) > 0.02;
    if(!moving) return;
    stepSpring(L, dt);
    stepSpring(R, dt);
    apply();
  });
  return {
    set: set,
    sync: sync,
    /* 容器尺寸/字体变化后必须重新量：tab 宽度会变 */
    remeasure: function(){ sync(); },
    dispose: function(){ alive = false; if(u) u.active = false; }
  };
}

/* ================= 统一的「开弹层」入口 =================
   所有弹层都从这里开：显示遮罩 + 从被点的按钮/行形变展开。
   集中一处，避免每个 open*() 各写一遍（也保证漏掉的那个不会退化成底部滑入）。
   ⚠️ 必须先把遮罩显示出来、量到面板的真实几何，再播放形变 ——
   面板在 display:none 的容器里量出来是 0×0，morphOpen 会直接放弃（退化成无动画）。 */
function openSheetMorph(srcEl){
  var mask = $('mask');
  var sheet = $('sheet');
  sheet.classList.remove('morphing');
  mask.classList.add('show');
  /* 读一次布局，确保 show 之后的尺寸已经算出来 */
  void sheet.offsetHeight;
  morphOpen(sheet, srcEl || window.__morphSrc);
}

var S = {

  lastSync:0,

};

function migrate(raw){
  var o = raw && typeof raw === 'object' ? raw : {};
  return {
    records:(o.records && typeof o.records==='object') ? o.records : {},
    known:(o.known && typeof o.known==='object') ? o.known : {},
    pending:(o.pending && typeof o.pending==='object') ? o.pending : {},
    delQ:Array.isArray(o.delQ) ? o.delQ : [],
    cfg:{
      owner:String((o.cfg&&o.cfg.owner)||''),
      repo:String((o.cfg&&o.cfg.repo)||'lazy-ledger-data'),
      token:String((o.cfg&&o.cfg.token)||''),
      auto:(o.cfg&&o.cfg.auto===false)?false:true,
      branch:String((o.cfg&&o.cfg.branch)||'main')
    },
    lastSync:Number(o.lastSync)||0,
    budget:Number(o.budget)||0,
    cats:Array.isArray(o.cats)?o.cats:null,

function load(){
  try{
    var raw = localStorage.getItem(KEY);
    if(raw) S = migrate(JSON.parse(raw));
    for(var id in S.records){
      var r = S.records[id];
      if(!r.ts) r.ts = parseTs(r.time);
      if(r.src==='shortcut' && !r.raw) r.raw='';
      if(r.manual) r.auto=false;
      if(!r.manual && isBadCat(r.category)){
        r.category = r.type==='income' ? '其他收入' : '其他';
        var fix = autoCat(r.raw, r.type) || autoCat(r.note, r.type);
        if(fix){ r.category=fix; r.auto=true; }
      }
    }
  }catch(e){}
}
function persist(){
  try{ localStorage.setItem(KEY, JSON.stringify(S)); }
  catch(e){ toast('本地保存失败：'+e.message); }
}

function pad(n){ return n<10?'0'+n:''+n; }

/* 圆角软底：把分类色稀释成可用作图标底的浅色（白底卡上不刺眼） */

/* ================= 分类词典 ================= */
function cats(){ return S.cats || DEFAULT_CATS; }
function expenseCats(){ return cats().filter(function(c){ return c.type!=='income'; }); }
function incomeCats(){ return cats().filter(function(c){ return c.type==='income'; }); }
function catOf(name){
  var all = cats();
  for(var i=0;i<all.length;i++) if(all[i].name===name) return all[i];
  return null;
}
function catEmoji(name){
  var c = catOf(name);
  return c ? c.emoji : '📦';
}
function catColor(name){
  var c = catOf(name);
  return c ? c.color : '#C9C2B0';
}
function autoCat(text, type){
  var s = String(text||'').toLowerCase();
  if(!s.trim()) return null;
  var list = (type==='income') ? incomeCats() : expenseCats();
  var best=null, bestLen=0;
  list.forEach(function(c){
    (c.kw||[]).forEach(function(k){
      if(k && s.indexOf(String(k).toLowerCase())>=0 && k.length>bestLen){
        best=c.name; bestLen=k.length;
      }
    });
  });
  return best;
}
var CAT_NAMES = {};
DEFAULT_CATS.forEach(function(c){ CAT_NAMES[c.name]=true; });
function isBadCat(c){
  c = String(c==null?'':c).trim();
  if(!c) return true;
  if(CAT_NAMES[c]) return false;
  if(catOf(c)) return false;
  if(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(c)) return true;
  if(/^\d{1,2}[-:.]\d{2}([-:.]\d{2})?$/.test(c)) return true;
  if(c.length>12) return true;
  if(c.indexOf('\n')>=0) return true;
  return false;
}
function guessCat(rec){
  var cur = String(rec.category||'').trim();
  if(cur && !isBadCat(cur) && cur!=='其他' && cur!=='其他收入') return null;
  return autoCat(rec.raw, rec.type) || autoCat(rec.note, rec.type) || null;
}
/* 从 raw 全文里猜支付方式。快捷指令那边把 account 写死成「支付宝」，
   但微信账单的原文里会明说「财付通/零钱/微信」，据此纠正。
   主 App 和熊记共用同一套判断（两边的快捷指令是同一个）。 */
function guessAccount(raw){
  var s = String(raw||'');
  if(/财付通|零钱|微信|收款方备注|转账单号/.test(s)) return '微信支付';
  if(/支付宝|余额宝|花呗|余利宝/.test(s)) return '支付宝';
  if(/银行卡|储蓄卡|信用卡/.test(s)) return '银行卡';
  return '';
}
/* 从 OCR 全文里补出金额（云端记录 amount 为空时的兜底）。
   按优先级依次尝试，第一个命中的就是结果。**顺序很重要，别随便调。**
     ① 带符号的两位小数    -28.80 / +150.00   （最可靠）
     ② 数字 + 「元」        28.8元 / 30元
     ③ 独占一行的数字       28.80 或 30        （支付宝账单页金额常单独一行）
     ④ 带符号的整数         -30 / +150         （最后的兜底）
   两个实测踩过的坑：
     · ①④ 必须加「前面不是数字」守卫 (?<![0-9])，
       否则日期 "2026-10-13" 里的 "-10" 会抢在真实金额前面被匹配。
     · ③ 必须排在 ④ 之前，否则同样会被日期碎片抢走。 */
function parseRawAmount(text){
  var s = String(text||'');
  var m = s.match(/(?<![0-9])([+\-])\s*([0-9][0-9,]*\.[0-9]{1,2})/);
  if(m) return { sign:m[1], value:Math.abs(parseFloat(m[2].replace(/,/g,'')) )||0 };
  m = s.match(/([0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*元/);
  if(m) return { sign:'', value:Math.abs(parseFloat(m[1].replace(/,/g,'')) )||0 };
  m = s.match(/^[ \t]*([+\-]?)([0-9][0-9,]*(?:\.[0-9]{1,2})?)[ \t]*$/m);
  if(m) return { sign:m[1], value:Math.abs(parseFloat(m[2].replace(/,/g,'')) )||0 };
  m = s.match(/(?<![0-9])([+\-])\s*([0-9][0-9,]*)(?![0-9.])/);
  if(m) return { sign:m[1], value:Math.abs(parseFloat(m[2].replace(/,/g,'')) )||0 };
  return null;
}

/* ================= 宽松 JSON（云端坏记录自愈） ================= */
function escapeCtl(s){
  var out='', inStr=false, esc2=false;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i), code=s.charCodeAt(i);
    if(esc2){ out+=ch; esc2=false; continue; }
    if(ch==='\\'){ out+=ch; esc2=true; continue; }
    if(ch==='"'){ inStr=!inStr; out+=ch; continue; }
    if(inStr && code<0x20){
      if(ch==='\n') out+='\\n'; else if(ch==='\r') out+='\\r'; else if(ch==='\t') out+='\\t';
      else out+='\\u'+('000'+code.toString(16)).slice(-4);
      continue;
    }
    out+=ch;
  }
  return out;
}
function escapeCtlSmart(s){
  var out='', inStr=false, esc2=false;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i), code=s.charCodeAt(i);
    if(esc2){ out+=ch; esc2=false; continue; }
    if(ch==='\\'){ out+=ch; esc2=true; continue; }
    if(ch==='"'){
      if(!inStr){ inStr=true; out+=ch; continue; }
      var j=i+1, nx='';
      while(j<s.length && /\s/.test(s.charAt(j))) j++;
      nx=s.charAt(j);
      if(nx===','||nx===':'||nx==='}'||nx===']'||nx===''){ inStr=false; out+=ch; }
      else out+='\\"';
      continue;
    }
    if(inStr && code<0x20){
      if(ch==='\n') out+='\\n'; else if(ch==='\r') out+='\\r'; else if(ch==='\t') out+='\\t';
      else out+='\\u'+('000'+code.toString(16)).slice(-4);
      continue;
    }
    out+=ch;
  }
  return out;
}
function looseJson(text){
  var s = String(text==null?'':text);
  try{ return { ok:true, obj:JSON.parse(s), repaired:false }; }catch(e){}
  var cands = [
    s.replace(/:\s*,/g,':0,').replace(/:\s*([}\]])/g,':0$1').replace(/,\s*([}\]])/g,'$1'),
    escapeCtl(s),
    escapeCtl(s.replace(/:\s*,/g,':0,').replace(/:\s*([}\]])/g,':0$1').replace(/,\s*([}\]])/g,'$1')),
    s.replace(/[\r\n\t]/g, function(c){ return c==='\n'?'\\n':c==='\r'?'\\r':'\\t'; }),
    escapeCtlSmart(s),
    /* 云端坏记录实测是「三个毛病同时犯」：amount 后面直接跟逗号、后面多一个
       游离引号（"src":"shortcut""）、raw 里是真正的换行。前五条各自只能治
       一两种，凑齐才解析得出来 —— 别删这条。 */
    escapeCtlSmart(s.replace(/:\s*,/g,':0,').replace(/:\s*([}\]])/g,':0$1').replace(/,\s*([}\]])/g,'$1'))
  ];
  for(var i=0;i<cands.length;i++){
    try{ return { ok:true, obj:JSON.parse(cands[i]), repaired:true }; }catch(e){}
  }
  return { ok:false, obj:null, repaired:false };
}
function normalizeRec(r, idFromPath){
  var rawCat = String(r.category||'').trim();
  function clean(v){ return String(v==null?'':v).replace(/["']+$/,'').trim(); }
  var src = clean(r.src);
  if(src!=='shortcut' && src!=='web') src='shortcut';
  var rawAmt = Math.abs(Number(r.amount))||0;
  var rec = {
    id: sanitizeId(clean(r.id)||idFromPath),
    type: r.type==='income'?'income':'expense',
    amount: rawAmt,
    category: rawCat,
    note: String(r.note||''),
    account: clean(r.account),
    time: clean(r.time),
    src: src
  };
  rec.raw = String(r.raw||r.ocr||'').slice(0,2000);
  if(rec.src==='shortcut' && rec.raw && (!rec.amount || rec.amount===0)){
    var pa = parseRawAmount(rec.raw);
    /* 只要捞到正数就补上。以前这里写死了 pa.sign==='-'，
       结果不带符号的账单页金额（28.80 独占一行）永远补不进来。 */
    if(pa && pa.value>0) rec.amount = pa.value;
  }
  if(isBadCat(rec.category)) rec.category = rec.type==='income'?'其他收入':'其他';
  rec.ts = parseTs(rec.time);
  if(rec.ts && String(r.time||'').indexOf('_')>=0) rec.time = ymdStr(rec.ts)+' '+hmStr(rec.ts);
  rec.auto = false;
  var rawAcc = rec.account;
  if(rec.src==='shortcut'){
    var hit = guessCat(rec);
    if(hit){ rec.category=hit; rec.auto=true; }
    /* 快捷指令把 account 写死成支付宝，但微信账单原文里有「财付通/零钱」，
       据此纠正。只在明显是微信时才改，其余保持用户填的。 */
    var acc = guessAccount(rec.raw);
    if(acc) rec.account = acc;
  }
  /* fixed = 这条记录被 App 改过（分类或金额或支付方式），要回推云端。
     ⚠️ account 也要算进去 —— 只在块里写 rec.fixed=true 的话，
     下一行会把它整个覆盖掉，纠正过的支付方式就永远推不回去。 */
  rec.fixed = (rec.category!==rawCat) || (rec.amount!==rawAmt) || (rec.account!==rawAcc);
  return rec;
}
function cloudRec(rec){
  var o = { id:rec.id, type:rec.type, amount:rec.amount, category:rec.category,
    note:rec.note, account:rec.account, time:rec.time, src:rec.src };
  if(rec.raw) o.raw = rec.raw;
  return o;
}

/* ================= 同步（GitHub 私有仓库当数据库） ================= */
var syncing=false;
function ghHeaders(extra){
  var h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(S.cfg.token) h['Authorization']='Bearer '+S.cfg.token;
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function ghApi(path, opt){
  opt = opt||{};
  opt.headers = ghHeaders(opt.headers);
  return fetch('https://api.github.com'+path, opt).then(function(res){
    return res.text().then(function(txt){
      var body=null;
      try{ body = txt?JSON.parse(txt):null; }catch(e){}
      if(!res.ok){
        var msg = (body&&body.message)?body.message:('HTTP '+res.status);
        var err = new Error(msg); err.status=res.status; throw err;
      }
      return body;
    });
  });
}
function isCfgOk(){ return !!(S.cfg.owner && S.cfg.repo && S.cfg.token); }
function pushPending(){
  var ids = Object.keys(S.pending);
  var chain = Promise.resolve();
  ids.forEach(function(id){
    chain = chain.then(function(){
      var rec = S.records[id];
      if(!rec){ delete S.pending[id]; return Promise.resolve(); }
      var path = 'data/'+id+'.json';
      var body = { message:'ledger: '+(rec.time||ymdStr(Date.now())), content:b64(JSON.stringify(cloudRec(rec))) };
      if(S.known[path]) body.sha = S.known[path].sha;
      return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      }).then(function(r){
        if(r&&r.content&&r.content.sha) S.known[path]={sha:r.content.sha};
        delete S.pending[id]; persist();
      }).catch(function(e){
        if(e.status===422 && !S.known[path]){
          return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path).then(function(f){
            if(f&&f.sha){
              body.sha=f.sha;
              return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path, {
                method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
              }).then(function(r2){
                if(r2&&r2.content&&r2.content.sha) S.known[path]={sha:r2.content.sha};
                delete S.pending[id]; persist();
              });
            }
          });
        }
        throw e;
      });
    });
  });
  chain = chain.then(function(){
    return S.delQ.slice().reduce(function(c,d){
      return c.then(function(){
        return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+d.path, {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ message:'ledger: delete '+d.path, sha:d.sha })
        }).then(function(){
          delete S.known[d.path];
          S.delQ = S.delQ.filter(function(x){ return x.path!==d.path; });
          persist();
        }).catch(function(e){
          if(e.status===404){
            delete S.known[d.path];
            S.delQ = S.delQ.filter(function(x){ return x.path!==d.path; });
            persist();
          }
        });
      });
    }, Promise.resolve());
  });
  return chain;
}
function pull(){
  return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo).then(function(repo){
    var br = (repo&&repo.default_branch)||'main';
    if(br!==S.cfg.branch){ S.cfg.branch=br; persist(); }
    return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/git/trees/'+encodeURIComponent(br)+'?recursive=1');
  }).then(function(tree){
    var files = ((tree&&tree.tree)||[]).filter(function(t){
      return t.type==='blob' && /^data\/rec-.*\.json$/.test(t.path);
    });
    var fresh = files.filter(function(f){ return !S.known[f.path]; }).slice(0,300);
    return fresh.reduce(function(c,f){
      return c.then(function(){
        var m = f.path.match(/^data\/(rec-.*)\.json$/);
        var idFromPath = m?m[1]:null;
        return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+f.path).then(function(j){
          var txt=null;
          if(j && typeof j.content==='string' && j.content){
            try{ txt = decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))); }
            catch(e){ try{ txt = atob(j.content.replace(/\s/g,'')); }catch(e2){ txt=null; } }
          } else if(j && typeof j==='object' && (j.id||j.type||j.amount!=null)){
            var rec0 = normalizeRec(j, idFromPath);
            S.records[rec0.id]=rec0;
            S.known[f.path]={sha:j.sha||f.sha};
            if(rec0.fixed) S.pending[rec0.id]=true;
            persist();
            return;
          } else if(typeof j==='string'){ txt=j; }
          if(txt==null) throw new Error('empty');
          var p = looseJson(txt);
          if(!p.ok) throw new Error('bad json');
          var rec = normalizeRec(p.obj, idFromPath);
          S.records[rec.id]=rec;
          S.known[f.path]={sha:(j&&j.sha)||f.sha};
          if(rec.fixed || p.repaired) S.pending[rec.id]=true;
          persist();
        }).catch(function(){});
      });
    }, Promise.resolve());
  });
}
function sync(manual){
  if(syncing) return;
  if(!S.cfg.owner || !S.cfg.repo){ if(manual) toast('请先配置 GitHub 同步'); return; }
  if(!navigator.onLine){ if(manual) toast('当前离线'); return; }
  syncing = true;
  if(manual) toast('同步中…');
  var hadErr=null;
  var pre = isCfgOk()?pushPending():Promise.resolve();
  pre.then(function(){ return pull(); })
    .then(function(){ return isCfgOk()?pushPending():Promise.resolve(); })
    .then(function(){ S.lastSync=Date.now(); persist(); })
    .catch(function(e){ hadErr=e; if(e&&e.status===401) S.lastSync=0; })
    .then(function(){
      syncing=false;
      renderAll();
      if(manual){
        if(hadErr) toast('同步失败：'+syncErrText(hadErr));
        else toast('同步完成 ✔');
      }
    });
}
function syncErrText(e){
  if(!e) return '未知错误';
  if(e.status===401) return 'Token 无效或已过期（去 GitHub 重新生成）';
  if(e.status===403) return '权限不足（检查 Token 的 Contents 读写权限）';
  if(e.status===404) return '仓库不存在，或 Token 没有授权这个仓库';
  if(e.status===422) return '数据格式问题（Base64 或 JSON 不合法）';
  return e.message || '网络问题，稍后重试';
}

var cardIdx = 0;
function monthMetrics(ym){
  var ex=0, inc=0, cnt=0;
  for(var id in S.records){
    var r = S.records[id];
    if(!r.ts) continue;
    if(ymdStr(r.ts).slice(0,7)!==ym) continue;
    cnt++;
    if(r.type==='income') inc+=r.amount; else ex+=r.amount;
  }
  return { ex:ex, inc:inc, cnt:cnt, bal:inc-ex };
}
function recentRecs(n){
  var arr=[];
  for(var id in S.records){ if(S.records[id].ts) arr.push(S.records[id]); }
  arr.sort(newestFirst);
  return arr.slice(0,n);
}
/* 新的在前。同一分钟内记的两笔 ts 完全相同，只按 ts 排顺序是随机的，
   所以再用 id 兜底比较（id 形如 rec-20261015-093012-4821，本身带时间）。
   注意 id 可能是快捷指令造的任意串，所以只做「相等时才比」的兜底。 */
function newestFirst(a, b){
  var d = (b.ts||0) - (a.ts||0);
  if(d) return d;
  var ai = String(a.id||''), bi = String(b.id||'');
  if(ai === bi) return 0;
  return ai < bi ? 1 : -1;
}

/* ================= 动效：卡片堆叠手势（跟手翻滚 + 吸附） =================
   手指横向拖动时三张卡按拖动进度**连续插值**（拖多少翻多少），松手再吸附到最近的整档；
   堆叠形态不变 —— 始终是同一个 pos0/pos1/pos2 三层结构，只是进度 t 在 0..1 之间跑。
   判定同时看距离与速度：只看距离会漏掉「快速轻扫」（位移小但速度大），
   只看速度又会被慢速抖动误触。纵向意图交还给页面滚动，不然首页上下滑会被卡片抢走。 */
var _cardDrag = null;
function bindCardStack(st){
  var startX = 0, startY = 0, dragging = false, decided = false, dx = 0, lastX = 0, vx = 0, t0 = 0;
  var CARDS = 3;
  var SNAP = 340;   /* 吸附动画时长 */

  function cards(){ return Array.prototype.slice.call(st.querySelectorAll('.ccard')); }
  /* 只有一个槽位的基准几何（从 CSS 里读出来，避免把数字抄第二遍） */
  function slots(){
    return [
      { y:0,   s:1,    r:0,    o:1   },   /* pos0 */
      { y:-13, s:0.962,r:-2.1, o:0.62 },  /* pos1 */
      { y:-26, s:0.925,r:-4.2, o:0.34 }   /* pos2 */
    ];
  }
  /* 把进度 t 映射成每张卡的 transform：t 从 0 走到 1 表示「翻一张」 */
  function paint(t){
    var S = slots();
    var list = cards();
    list.forEach(function(el, i){
      var pos = (i - cardIdx + CARDS) % CARDS;      /* 当前槽位 0/1/2 */
      var p = pos - t;                              /* 连续位置：pos0 拖到 -1 表示退了一档 */
      /* 把 p 折算回 0..2 的一圈之内，取最近的那一段 */
      if(p > 1.5) p -= CARDS;
      if(p < -1.5) p += CARDS;
      var a, b, f;
      if(p >= 0){ a = S[Math.min(2, Math.floor(p))]; b = S[Math.min(2, Math.ceil(p))]; f = p - Math.floor(p); }
      else { a = S[0]; b = S[0]; f = 0; }
      var y = a.y + (b.y - a.y) * f;
      var s = a.s + (b.s - a.s) * f;
      var r = a.r + (b.r - a.r) * f;
      var o = a.o + (b.o - a.o) * f;
      el.classList.add('manual');
      el.style.transform = 'translate3d(' + (p * -8).toFixed(2) + 'px,' + y.toFixed(2) + 'px,0)'
                         + ' scale(' + s.toFixed(4) + ') rotate(' + r.toFixed(3) + 'deg)';
      el.style.opacity = o.toFixed(3);
    });
  }
  function releaseManual(){
    cards().forEach(function(el){ el.classList.remove('manual'); el.style.transform = ''; el.style.opacity = ''; });
  }
  /* 用 WAAPI 做吸附：fill:'none' → 结束后自然落回 class 定义的槽位，不留内联样式 */
  function snapTo(step){
    var list = cards();
    if(reduceMotion || !list.length){
      cardIdx = (cardIdx + step + CARDS) % CARDS;
      renderHome();
      return;
    }
    /* 先把当前插值状态冻结下来，再动画到目标槽位 */
    var from = list.map(function(el){
      var m = el.style.transform || '';
      return { el:el, tf:m, op:el.style.opacity || '' };
    });
    cardIdx = (cardIdx + step + CARDS) % CARDS;
    /* 目标几何：让 CSS class 生效后再量（临时去掉 manual） */
    from.forEach(function(f){ f.el.classList.remove('manual'); f.el.style.transform = ''; f.el.style.opacity = ''; });
    list.forEach(function(el, i){
      var pos = (i - cardIdx + CARDS) % CARDS;
      el.className = 'ccard pos' + pos;
      void el.offsetWidth;
    });
    var to = list.map(function(el){
      var cs = getComputedStyle(el);
      return { tf:cs.transform, op:cs.opacity };
    });
    list.forEach(function(el, i){
      var startTf = from[i].tf || 'none';
      el.animate([
        { transform:startTf, opacity:(from[i].op || 1) },
        { transform:(to[i].tf === 'none' ? 'none' : to[i].tf), opacity:to[i].op }
      ], { duration:SNAP, easing:'cubic-bezier(.22,.9,.24,1)', fill:'none' });
    });
    /* 指示点 */
    var dots = document.querySelectorAll('#stackDots i');
    Array.prototype.forEach.call(dots, function(d, i){ d.classList.toggle('on', i === cardIdx); });
  }
  function openOverview(){
    /* 点最前面那张 = 看本月概览（沿用形变展开） */
    openMonth();
  }

  st.addEventListener('pointerdown', function(e){
    if(e.button !== undefined && e.button > 0) return;
    /* 事件可能落在卡片上，也可能落在 stack 空白区：两者都受理，
       但只有从卡片上开始的拖动才算（否则会跟页面滚动抢） */
    var card = (e.target.closest ? e.target.closest('.ccard') : null) || st.querySelector('.ccard.pos0');
    if(!card) return;
    startX = lastX = e.clientX;
    startY = e.clientY;
    dragging = true; decided = false; dx = 0; vx = 0; t0 = Date.now();
    window.__cardTapTarget = card;
    /* ⚠️ move/up 一律挂在 document 上：拖动中一旦 setPointerCapture 到卡片，
       或者手指滑出 stack 范围，element 上的监听就收不到 up 了（手势会卡住）。 */
    document.addEventListener('pointermove', onMove, { passive:false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
  function onMove(e){
    if(!dragging) return;
    var mx = e.clientX - startX, my = e.clientY - startY;
    if(!decided){
      /* 位移超过 7px 才判定意图，避免点按被误判成滑动 */
      if(Math.abs(mx) < 7 && Math.abs(my) < 7) return;
      /* 纵向意图 → 交还页面滚动，不拦截 */
      if(Math.abs(my) > Math.abs(mx)){ detach(); dragging = false; window.__cardTapTarget = null; return; }
      decided = true;
      st.classList.add('dragging');
    }
    var now = Date.now();
    var dt = Math.max(1, now - t0);
    vx = (e.clientX - lastX) / dt;      /* px/ms，用于轻扫判定 */
    lastX = e.clientX; t0 = now;
    dx = mx;
    /* 跟手：拖一张卡宽的距离 = 翻一格 */
    var w = st.getBoundingClientRect().width || 1;
    var t = clamp(dx / w, -1, 1);
    paint(t);
  }
  function detach(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  function onUp(e){
    detach();
    if(!dragging) return;
    var wasDecided = decided;
    dragging = false; decided = false;
    st.classList.remove('dragging');
    if(!wasDecided) return;                    /* 只是点按，交给 click 处理 */
    var w = st.getBoundingClientRect().width || 1;
    var t = dx / w;
    var fling = Math.abs(vx) > 0.45;           /* 快速轻扫：位移小也算翻 */
    var step = 0;
    if(t <= -0.28 || (fling && vx < 0)) step = 1;      /* 向左 → 下一张 */
    else if(t >= 0.28 || (fling && vx > 0)) step = -1; /* 向右 → 上一张 */
    snapTo(step);
    /* 拖过就不算点按，别顺手弹出概览 */
    window.__cardTapTarget = null;
  }

  st.addEventListener('click', function(e){
    if(window.__cardTapTarget !== e.target.closest('.ccard')) return;
    var card = e.target.closest ? e.target.closest('.ccard') : null;
    if(!card) return;
    var pos = card.className.indexOf('pos0') >= 0 ? 0 : (card.className.indexOf('pos1') >= 0 ? 1 : 2);
    if(pos !== 0){ snapTo(pos); return; }      /* 点侧卡 = 翻到那张 */
    openOverview();
  });
}

}

/* ================= 动效：明细卡片左滑删除（弧线飞出 + 可撤销） =================
   跟手横滑：左滑超过卡宽 35% 或快速轻扫 → 沿**二次贝塞尔弧线**飞向左下角，
   同时收缩旋转；其余行在动画进行中就重排填补（不要等动画结束才跳）。
   数据在**动画开始时**就移除，失败/撤销时按反向路径飞回。
   注意：动画完成 ≠ 服务器成功 —— 这里明确区分「本地已删」与「云端已同步」。 */
function bindSwipeDelete(el){
  var row = el.querySelector('.row');
  if(!row) return;
  var id = el.getAttribute('data-id');
  var startX = 0, startY = 0, dx = 0, lastX = 0, vx = 0, t0 = 0;
  var dragging = false, decided = false, armed = false;

  /* 垫一块删除底（红底 + 垃圾桶），由 row 盖住 */
  if(!el.querySelector('.delbg')){
    var bg = document.createElement('div');
    bg.className = 'delbg';
    bg.innerHTML = '<span>删除</span>' + ICO.trash;
    el.insertBefore(bg, el.firstChild);
  }
  var delbg = el.querySelector('.delbg');

  function reset(animate){
    if(animate && row.getAnimations && row.getAnimations().length === 0){
      /* 未达阈值 → 弹回原位 */
      var a = row.animate([{ transform:row.style.transform || 'none' }, { transform:'translate3d(0,0,0)' }],
        { duration:260, easing:'cubic-bezier(.22,1,.36,1)', fill:'none' });
      a.finished.then(function(){ row.style.transform = ''; });
    } else if(!animate){
      row.style.transform = '';
    }
    el.classList.remove('armed');
    armed = false;
  }

  el.addEventListener('pointerdown', function(e){
    if(e.button !== undefined && e.button > 0) return;
    startX = lastX = e.clientX;
    startY = e.clientY;
    dx = 0; vx = 0; t0 = Date.now();
    dragging = true; decided = false; armed = false;
    /* 同卡片堆叠：move/up 挂 document，避免手指滑出元素后手势卡死 */
    document.addEventListener('pointermove', onMove, { passive:false });
    document.addEventListener('pointerup', onUp);
    document.addEventListener('pointercancel', onUp);
  });
  function detach(){
    document.removeEventListener('pointermove', onMove);
    document.removeEventListener('pointerup', onUp);
    document.removeEventListener('pointercancel', onUp);
  }
  function onMove(e){
    if(!dragging) return;
    var mx = e.clientX - startX, my = e.clientY - startY;
    if(!decided){
      if(Math.abs(mx) < 7 && Math.abs(my) < 7) return;
      /* 纵向意图 → 交还页面滚动 */
      if(Math.abs(my) > Math.abs(mx)){ detach(); dragging = false; return; }
      decided = true;
      el.classList.add('dragging');
    }
    var now = Date.now();
    var dt = Math.max(1, now - t0);
    vx = (e.clientX - lastX) / dt;
    lastX = e.clientX; t0 = now;

    /* 只允许左滑：右滑给阻尼 */
    var raw = mx;
    var x = raw > 0 ? raw * 0.18 : raw;
    var w = el.getBoundingClientRect().width || 1;
    /* 超过卡宽 72% 后加阻尼，手感「拉到头」 */
    var maxX = -w * 0.72;
    if(x < maxX) x = maxX + (x - maxX) * 0.18;
    dx = x;
    row.style.transform = 'translate3d(' + x.toFixed(2) + 'px,0,0)';
    var nowArmed = (Math.abs(x) >= w * 0.35);
    if(nowArmed !== armed){
      armed = nowArmed;
      el.classList.toggle('armed', armed);
    }
  }
  function onUp(e){
    detach();
    if(!dragging) return;
    var wasDecided = decided;
    dragging = false; decided = false;
    el.classList.remove('dragging');
    if(!wasDecided) return;
    var w = el.getBoundingClientRect().width || 1;
    var THR = w * 0.35;
    var fling = vx < -0.45;                       /* 快速轻扫：位移小也算删 */
    el.setAttribute('data-swiped', '1');          /* 标记：别当点按 */
    if(Math.abs(dx) >= THR || fling) flyOut();
    else { row.style.transform = ''; el.classList.remove('armed'); armed = false; }
  }

  /* 弧线飞出：起点=卡片当前位置，终点=左下角，控制点在起点左下 → 路径是弧线而不是直线 */
  function flyOut(){
    var r = row.getBoundingClientRect();
    /* ⚠️ 这些点务必不要叫 S！全局状态对象就叫 S（records/pending/known 都在里面），
       一旦在这里写 var S = {...} 就会**遮蔽**全局 S，于是 S.records[id] 删的只是
       一个临时对象上的属性 —— 界面看着滑走了、数据其实一条没删（这个坑排了好几轮）。 */
    var start = { x:r.left, y:r.top };
    var end   = { x:-r.width * 0.4, y:window.innerHeight * 0.86 };
    var ctrl  = { x: Math.min(start.x - 150, end.x + 30), y: start.y + (end.y - start.y) * 0.35 };
    var p0 = { x:0, y:0 };
    var p2 = { x:end.x - start.x, y:end.y - start.y };
    var p1 = { x:ctrl.x - start.x, y:ctrl.y - start.y };
    /* 数据在动画**开始时**就移除，其余行同时重排填补 */
    var snapshot = S.records[id];
    var wasPending = !!S.pending[id];
    var knownPath = 'data/'+id+'.json';
    var knownSha = S.known[knownPath] ? S.known[knownPath].sha : null;
    delete S.records[id]; delete S.pending[id];
    persist();
    el.classList.add('gone');
    if(reduceMotion){
      finalize();
      return;
    }
    var start = 0;
    var finished = false;
    function tick(ts){
      if(finished) return;
      if(!start) start = ts;
      var t = clamp((ts - start)/550, 0, 1);
      var mt = 1 - t;
      var x = mt*mt*p0.x + 2*mt*t*p1.x + t*t*p2.x;
      var y = mt*mt*p0.y + 2*mt*t*p1.y + t*t*p2.y;
      row.style.transform = 'translate3d(' + x.toFixed(2) + 'px,' + y.toFixed(2) + 'px,0)'
                          + ' rotate(' + (t * -18).toFixed(2) + 'deg)'
                          + ' scale(' + (1 - t*0.7).toFixed(4) + ')';
      el.style.opacity = (1 - t*0.9).toFixed(3);
      if(t < 1) requestAnimationFrame(tick);
      else { finished = true; finalize(); }
    }
    requestAnimationFrame(tick);
    /* 兜底：rAF 在某些环境（后台标签、被遮挡的窗口、部分 WebView）不会推进，
       那样动画永远不结束、撤销也永远不弹 —— 用定时器保底，保证收尾一定发生。 */
    setTimeout(function(){ if(!finished){ finished = true; finalize(); } }, 900);

    var didFinalize = false;
    function finalize(){
      if(didFinalize) return;      /* rAF 与兜底定时器都可能调到这里，只认第一次 */
      didFinalize = true;
      /* 走完动画再把时间轴整块重排（其余行自然落位），并弹撤销 */
      renderListBodyOnly();
      var undoRec = snapshot, undoPending = wasPending, undoKnownSha = knownSha;
      toastUndo('已删除「'+(undoRec?undoRec.category:'')+' ¥'+(undoRec?num(undoRec.amount):'')+'」', function(){
        /* 撤销：数据放回原位（按原路径写回，云端不会重复建文件） */
        if(undoRec){
          S.records[undoRec.id] = undoRec;
          if(undoPending) S.pending[undoRec.id] = true;
          if(undoKnownSha) S.known['data/'+undoRec.id+'.json'] = { sha:undoKnownSha };
          /* 撤销时把这条从待删队列里撤掉 */
          S.delQ = S.delQ.filter(function(x){ return x.path !== 'data/'+undoRec.id+'.json'; });
          persist(); renderListBodyOnly();
          toast('已恢复');
        }
      }, function(){
        /* 撤销窗口过了 → 真正排队删云端 */
        if(knownSha) S.delQ.push({ path:knownPath, sha:knownSha });
        persist();
        if(isCfgOk() && navigator.onLine) sync(false);
      });
    }
  }
}
/* 底部 toast 带一个「撤销」按钮（过期后关闭窗口） */
var _undoTimer = null;
function toastUndo(msg, onUndo, onExpire){
  var t = $('toast');
  if(!t){ if(onExpire) setTimeout(onExpire, 5000); return; }
  t.innerHTML = esc(msg) + ' <b id="undoBtn" style="margin-left:10px;text-decoration:underline;cursor:pointer;">撤销</b>';
  t.classList.add('show');
  clearTimeout(t._t);
  var done = false;
  function close(){
    if(done) return; done = true;
    clearTimeout(_undoTimer);
    t.classList.remove('show');
    t.innerHTML = '';
    t._t = setTimeout(function(){ t.textContent=''; }, 220);
  }
  var btn = $('undoBtn');
  if(btn) btn.onclick = function(){ close(); if(onUndo) onUndo(); };
  /* 撤销按钮点完要把 toast 收掉，否则它会挂着直到 2.2s 的默认隐藏 */
  _undoTimer = setTimeout(function(){ close(); if(onExpire) onExpire(); }, 5200);
}
/* 时间轴主体：按当前 listYm / listPick 生成 */
function listBodyHtml(){
  var now = new Date();
  var isCurMonth = listYm === (now.getFullYear()+'-'+pad(now.getMonth()+1));
  var all = monthRecs(listYm);
  var byDay = {};
  all.forEach(function(r){ var d=ymdStr(r.ts); (byDay[d]=byDay[d]||[]).push(r); });

  if(!all.length){
    return '<div class="card empty"><img src="./stickers/px-trunks.png" style="width:120px;" alt="">'
      + '<div class="t">'+(isCurMonth?'这个月还没有记录':'这天没有记录')+'</div>'
      + '<div class="s">点底部中间的 ＋ 记一笔</div></div>';
  }
  var shown = listPick ? (byDay[listPick]||[]) : all;
  if(!shown.length){
    return '<div class="card empty"><img src="./stickers/px-smile.png" style="width:132px;" alt="">'
      + '<div class="t">'+esc(dayLabel(listPick, parseTs(listPick)))+' 没有记录</div>'
      + '<div class="s">点「整月」看全月</div></div>';
  }
  // 本月最大单笔支出：用深色卡高亮（对应参考图里那张黑卡）
  var maxRec = null;
  shown.forEach(function(r){ if(r.type!=='income' && (!maxRec || r.amount>maxRec.amount)) maxRec=r; });

  var groups=[], gmap={};
  shown.forEach(function(r){
    var d = ymdStr(r.ts);
    if(!gmap[d]){ gmap[d]=[]; groups.push(d); }
    gmap[d].push(r);
  });
  var html = '<div class="tl">';
  groups.forEach(function(d){
    var g = gmap[d];
    var dEx=0, dIn=0;
    g.forEach(function(r){ if(r.type==='income') dIn+=r.amount; else dEx+=r.amount; });
    var ts = parseTs(d);
    html += '<div class="tl-day'+((isCurMonth&&d===ymdStr(Date.now()))?' on':'')+'">'
      + '<span class="dd"></span>'
      + '<span class="t1">'+esc(dayLabel(d, ts))+'</span>'
      + '<span class="t2">'+esc(weekCn(ts))+'</span>'
      + '<span class="sum">'+(dIn-dEx<0?'−':'')+'¥'+num(Math.abs(dIn-dEx))+'</span>'
      + '</div>';
    g.forEach(function(r){
      var isIn = r.type==='income';
      var dark = (maxRec && r.id===maxRec.id);
      html += '<div class="tl-item'+(dark?' dark':'')+'" data-id="'+esc(r.id)+'">'
        + '<span class="dot"></span>'
        + '<div class="row">'
        +   catCircle(r.category)
        +   '<div class="rmid"><div class="r1">'+esc(r.category)+'</div>'
        +     '<div class="r2">'+esc(hmStr(r.ts))+' · '+esc(r.note||r.account||'—')+(r.auto?' · 自动分类':'')+'</div></div>'
        +   '<span class="ramt'+(isIn?' in':'')+'">'+(isIn?'+':'−')+num(r.amount)+'</span>'
        + '</div>'
        + '</div>';
    });
  });
  html += '</div>';
  var exSum = shown.reduce(function(a,r){ return a+(r.type==='income'?0:r.amount); },0);
  var inSum = shown.reduce(function(a,r){ return a+(r.type==='income'?r.amount:0); },0);
  html += '<div class="tl-total"><span class="l">'+(listPick?(dayLabel(listPick,parseTs(listPick))+' 合计'):'本月合计')+'</span>'
    + '<span class="v">'
    +   '<span style="font-size:12.5px;font-weight:600;color:var(--ink2);">支出 </span>¥'+num(exSum)
    +   (inSum ? '<span style="font-size:12.5px;font-weight:600;color:var(--ink2);margin-left:10px;">收入 </span><span style="color:var(--green);">¥'+num(inSum)+'</span>' : '')
    + '</span></div>';
  return html;
}

/* ================= 日历（点月份按钮形变展开，可挑任意日期） ================= */
var calYm = '';
function openCalendar(srcEl){
  var cal = $('cal');
  if(!cal) return;
  if(cal.classList.contains('show')){ closeCalendar(); return; }
  calYm = listYm;
  /* 先把日历放到触发按钮正下方（fixed 定位由 JS 算，避免被滚动容器裁切） */
  var r = srcEl.getBoundingClientRect();
  var width = Math.min(320, window.innerWidth - 32);
  var left = Math.min(Math.max(12, r.left), window.innerWidth - width - 12);
  cal.style.width = width + 'px';
  cal.style.left = left + 'px';
  cal.style.top = (r.bottom + 8) + 'px';
  paintCalendar();
  cal.classList.add('show');
  morphOpen(cal, srcEl);
  document.addEventListener('pointerdown', calOutside, true);
}
function calOutside(e){
  var cal = $('cal');
  if(!cal || !cal.classList.contains('show')) return;
  if(cal.contains(e.target)) return;
  var trig = $('calTrigger');
  if(trig && trig.contains(e.target)) return;
  closeCalendar();
}
function closeCalendar(){
  var cal = $('cal');
  if(!cal) return;
  document.removeEventListener('pointerdown', calOutside, true);
  morphClose(cal, window.__morphSrc);
}
function paintCalendar(){
  var cal = $('cal');
  var inner = $('calInner');
  if(!cal || !inner) return;
  var y = Number(calYm.slice(0,4)), mo = Number(calYm.slice(5,7));
  var first = new Date(y, mo-1, 1);
  var startWk = first.getDay();                 // 0=周日
  var dayCount = new Date(y, mo, 0).getDate();
  var byDay = {};
  monthRecs(calYm).forEach(function(r){ byDay[ymdStr(r.ts)] = true; });
  var today = ymdStr(Date.now());

  var wk = ['日','一','二','三','四','五','六'].map(function(w){ return '<span>'+w+'</span>'; }).join('');
  var cells = '';
  for(var i=0;i<startWk;i++) cells += '<button class="empty" disabled></button>';
  for(var d=1; d<=dayCount; d++){
    var ds = calYm+'-'+pad(d);
    var cls = 'cal-grid-cell';
    if(ds === today) cls += ' today';
    if(byDay[ds]) cls += ' has';
    if(ds === listPick) cls += ' on';
    cells += '<button class="'+cls+'" data-cal-day="'+ds+'"><span>'+d+'</span>'
      + (byDay[ds] ? '<span class="cd"></span>' : '')
      + '</button>';
  }
  inner.innerHTML = ''
    + '<div class="cal-top">'
    +   '<span class="cm">'+mo+' 月</span><span class="cy">'+y+'</span>'
    +   '<span class="nav">'
    +     '<button data-cal-mv="-1" aria-label="上个月">‹</button>'
    +     '<button data-cal-mv="1" aria-label="下个月">›</button>'
    +   '</span>'
    + '</div>'
    + '<div class="cal-wk">'+wk+'</div>'
    + '<div class="cal-grid">'+cells+'</div>'
    + '<div class="cal-foot">'

/* 刻度表盘：顶部弧形刻度，已用部分深色，比例处一个三角指针 */
function dialSvg(ratio){
  ratio = Math.max(0, Math.min(1, ratio||0));
  var R = 116, cx = 165, cy = 165, N = 44, a0 = 196, a1 = 344;
  var out = '', i, ang, rad, r1, r2, on;
  for(i=0;i<=N;i++){
    ang = a0 + (a1-a0)*i/N;
    rad = ang*Math.PI/180;
    on = (i/N) <= ratio + 1e-9;
    r2 = R + (i%5===0 ? 2 : 0);
    r1 = r2 - (i%5===0 ? 10 : 6);
    out += '<line x1="'+(cx+Math.cos(rad)*r1).toFixed(1)+'" y1="'+(cy+Math.sin(rad)*r1).toFixed(1)+'"'
        +  ' x2="'+(cx+Math.cos(rad)*r2).toFixed(1)+'" y2="'+(cy+Math.sin(rad)*r2).toFixed(1)+'"'
        +  ' stroke="'+(on?'#15171A':'#D8D6D0')+'" stroke-width="'+(i%5===0?2.4:2)+'" stroke-linecap="round"/>';
  }
  var ma = (a0 + (a1-a0)*ratio)*Math.PI/180;
  var mx = cx + Math.cos(ma)*(R+17), my = cy + Math.sin(ma)*(R+17);
  var deg = (a0 + (a1-a0)*ratio) + 90;
  out += '<path d="M0,-7 L5.4,2 L-5.4,2 Z" fill="#15171A" transform="translate('+mx.toFixed(1)+','+my.toFixed(1)+') rotate('+deg.toFixed(1)+')"/>';
  return '<svg class="dial-svg" viewBox="0 0 330 330">'+out+'</svg>';
}

/* ================= 自然语言记账 ================= */
function parseSay(text){
  var s = String(text||'').trim();
  if(!s) return null;
  var amt = 0;
  var m = s.match(/([0-9]+(?:\.[0-9]{1,2})?)\s*(?:块|元|钱|rmb|￥|¥)?/i);
  if(m) amt = parseFloat(m[1])||0;
  if(!amt){
    var m2 = s.match(/[¥￥]\s*([0-9]+(?:\.[0-9]{1,2})?)/);
    if(m2) amt = parseFloat(m2[1])||0;
  }
  if(!amt) return null;
  var isIncome = /(收入|收到|赚|发了|报销|退款|退了|进账|工资|奖金)/.test(s);
  var hit = autoCat(s, isIncome?'income':'expense');
  if(!hit) hit = isIncome?'其他收入':'其他';
  var note = s.replace(/[¥￥]?\s*[0-9]+(?:\.[0-9]{1,2})?\s*(?:块|元|钱|rmb)?/i,'')
              .replace(/^(今天|昨天|刚刚|刚才|我|了)/,'')
              .replace(/(花了|花|用了|用|付了|付|消费|买|记一笔|记账)/g,'')
              .trim();
  return { amount:amt, type:isIncome?'income':'expense', category:hit, note:note };
}
/* 自然语言速记：在「记一笔」弹层顶部输入「午饭 15」，自动填好金额/分类/备注。
   原来是首页常驻输入条，但它和底部的 ＋ 功能重复，所以收进弹层里当加速器。 */
function fillFromText(){
  var inp = $('sayQuick');
  if(!inp) return;
  var txt = String(inp.value||'').trim();
  if(!txt){ toast('说点什么… 比如「午饭 15」'); return; }
  var p = parseSay(txt);
  if(!p){ toast('没识别出金额，试试「午饭 15」'); return; }
  curType = p.type;
  curCat = p.category;
  var list = (curType==='income')?incomeCats():expenseCats();
  if(!list.some(function(c){ return c.name===curCat; })){
    curCat = autoCat(txt, curType) || (curType==='income' ? '其他收入' : '其他');
  }
  var a = $('fAmt'); if(a) a.value = p.amount;
  var n = $('fNote'); if(n && !n.value) n.value = p.note;
  paintSheetSel();
  inp.value = '';

/* ================= 记一笔 / 编辑 ================= */
var editingId=null, curType='expense', curCat='其他', curAcc='微信支付';
var sheetLiquid = null;   // 「记一笔」里支出/收入的液态 Tab 句柄
function openSheet(id, presetType){
  editingId = id||null;
  var body = $('sheetBody');
  var d = new Date();
  var local = d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+'T'+pad(d.getHours())+':'+pad(d.getMinutes());
  if(id){
    var r = S.records[id];
    if(!r) return;
    $('sheetTitle').textContent = '编辑记录';
    curType = r.type;
    curCat = r.category||(r.type==='income'?'其他收入':'其他');
    curAcc = r.account||'微信支付';
    body.innerHTML = sheetHtml(r.amount, r.note||'', r.time?String(r.time).replace(' ','T'):local, true);
  } else {
    curType = presetType==='income' ? 'income' : 'expense';
    curCat = curType==='income' ? '其他收入' : '其他';
    curAcc = '微信支付';
    $('sheetTitle').textContent = '记一笔';
    body.innerHTML = sheetHtml('', '', local, false);

  $('mask').classList.add('show');
  bindSheet();
  paintSheetSel();

function sheetHtml(amt, note, time, isEdit){
