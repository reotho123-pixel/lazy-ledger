function paintSheetSel(){
  var list = (curType==='income')?incomeCats():expenseCats();
  var html='';
  if(curCat && !list.some(function(c){ return c.name===curCat; })){
    html += catChipHtml(curCat);
  }
  list.forEach(function(c){ html += catChipHtml(c.name); });
  var cc = $('catChips');
  cc.innerHTML = html;
  Array.prototype.forEach.call(cc.querySelectorAll('button'), function(el){
    el.addEventListener('click', function(){ curCat = el.getAttribute('data-v'); paintSheetSel(); });
  });
  var ac = $('accChips');
  ac.innerHTML = ACCOUNT_NAMES.map(function(a){
    return '<button class="'+(a===curAcc?'on':'')+'" data-v="'+esc(a)+'">'+esc(a)+'</button>';
  }).join('');
  Array.prototype.forEach.call(ac.querySelectorAll('button'), function(el){
    el.addEventListener('click', function(){ curAcc = el.getAttribute('data-v'); paintSheetSel(); });
  });
  var t1 = $('tEx'), t2 = $('tIn'), seg = $('typeSeg');
  if(t1 && t2 && seg){
    t1.className = curType==='expense'?'on':'';
    t2.className = curType==='income'?'on':'';
    seg.className = 'type-seg' + (curType==='income'?' in':'');
    /* 支出/收入 也用液态 Tab：两根弹簧驱动左右边缘。
       弹层每次打开都是新的 DOM，所以句柄要跟着重建。 */
    if(sheetLiquid) sheetLiquid.dispose();
    sheetLiquid = liquidTab(seg, '.pill', 'button', curType==='income'?1:0);
  }
}
/* 分类选择格里的一格：优先用漫画图标，没有就用 emoji */
function catChipHtml(name){
  var ic = catIcon(name);
  var inner = ic
    ? '<img src="'+ic+'" alt="">'
    : catEmoji(name);
  var bg = ic ? '#E9E7E1' : tint(catColor(name), .20);
  return '<button class="'+(name===curCat?'on':'')+'" data-v="'+esc(name)+'">'
    + '<span class="cc2" style="background:'+bg+';">'+inner+'<span class="ck">✓</span></span>'
    + '<span class="cn2">'+esc(name)+'</span></button>';
}
function bindSheet(){
  $('sheetX').onclick = closeSheet;
  var s = $('btnSave'); if(s) s.onclick = saveSheet;
  var dl = $('btnDel'); if(dl) dl.onclick = delRecord;
  var sf = $('sayFill');
  if(sf) sf.onclick = fillFromText;
  var sq = $('sayQuick');
  if(sq) sq.addEventListener('keydown', function(e){ if(e.key==='Enter'){ e.preventDefault(); fillFromText(); } });
  $('tEx').onclick = function(){
    curType='expense';
    if(!expenseCats().some(function(x){ return x.name===curCat; })) curCat='其他';
    paintSheetSel();
  };
  $('tIn').onclick = function(){
    curType='income';
    if(!incomeCats().some(function(x){ return x.name===curCat; })) curCat='其他收入';
    paintSheetSel();
  };
}
function closeSheet(){
  editingId=null;
  /* 原路收回按钮，而不是滑出屏幕 */
  morphClose($('sheet'), window.__morphSrc, function(){
    $('mask').classList.remove('show');
  });
}
function saveSheet(){
  var amt = Math.abs(Number($('fAmt').value));
  if(!amt){ toast('请输入金额'); return; }
  var tv = $('fTime').value||'';
  var timeStr = tv ? tv.replace('T',' ') : (ymdStr(Date.now())+' '+hmStr(Date.now()));
  var rec = {
    type:curType, amount:amt, category:curCat,
    note:String($('fNote').value||'').trim(),
    account:curAcc, time:timeStr, src:'web'
  };
  if(editingId){
    rec.id = editingId;
    rec.src = (S.records[editingId]&&S.records[editingId].src==='shortcut')?'shortcut':'web';
    rec.ts = parseTs(rec.time);
    rec.raw = rec.src==='shortcut' ? (S.records[editingId].raw||'') : '';
    rec.auto = false;
    rec.manual = true;
    S.records[editingId] = rec;
    S.pending[editingId] = true;
    toast('已更新 ✔');
  } else {
    rec.id = newId();
    rec.ts = parseTs(rec.time);
    S.records[rec.id] = rec;
    S.pending[rec.id] = true;
    toast('已记账 ✔');
  }
  persist(); closeSheet(); renderAll();
  if(isCfgOk() && navigator.onLine) sync(false);
}
function delRecord(){
  if(!editingId) return;
  delRecordById(editingId, true);
}
function delRecordById(id, fromSheet){
  if(!id) return;
  var r = S.records[id];
  if(!r){ return; }
  var cloud = S.known['data/'+id+'.json'] ? '（云端也会删除）' : '';
  askConfirm('确定删除这笔「'+r.category+' ¥'+num(r.amount)+'」吗？'+cloud, function(){
    var path = 'data/'+id+'.json';
    if(S.known[path]) S.delQ.push({ path:path, sha:S.known[path].sha });
    delete S.records[id]; delete S.pending[id];
    persist();
    if(fromSheet) closeSheet();
    renderAll();
    toast('已删除');
    if(isCfgOk() && navigator.onLine) sync(false);
  }, { okLabel:'删除' });
}

/* ================= 分类管理 ================= */
function openCats(){
  $('sheetTitle').textContent = '分类管理';
  var body=$('sheetBody');
  var ex = expenseCats(), inc = incomeCats();
  body.innerHTML = ''
    + '<div class="btn-row" style="margin-bottom:14px;">'
    +   '<button class="btn" id="catExport" style="font-size:14px;">导出 JSON</button>'
    +   '<button class="btn" id="catImport" style="font-size:14px;">导入 JSON</button>'
    + '</div>'
    + '<div class="hint" style="margin:-4px 2px 14px;">分类决定「说一句」怎么自动识别。导出的是同格式 JSON（分类 / 表情 / 颜色 / 关键词），可备份、可发给别人。</div>'
    + '<div class="sec" style="margin-left:2px;margin-right:2px;"><span class="t" style="font-size:15px;">支出分类</span><span class="badge">'+ex.length+' 个</span></div>'
    + ex.map(catItemHtml).join('')
    + '<div class="sec" style="margin-left:2px;margin-right:2px;"><span class="t" style="font-size:15px;">收入分类</span><span class="badge">'+inc.length+' 个</span></div>'
    + inc.map(catItemHtml).join('')
    + '<button class="btn btn-dark btn-full" id="catNew" style="margin-top:14px;">+ 新增分类</button>'
    + '<button class="btn btn-full" id="catReset" style="margin-top:10px;font-size:14px;color:var(--ink2);">恢复内置词典</button>';
  openSheetMorph();
  $('sheetX').onclick = closeSheet;
  $('catNew').onclick = function(){ openCatEdit(null); };
  $('catReset').onclick = function(){
    askConfirm('恢复成内置词典？你自定义的分类会丢失。', function(){
      S.cats = null; persist(); openCats(); renderAll();
      toast('已恢复内置词典');
    }, { okLabel:'恢复' });
  };
  $('catExport').onclick = function(){
    var data = JSON.stringify(cats(), null, 2);
    var blob = new Blob([data], { type:'application/json' });
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'lazy-ledger-cats-'+ymdStr(Date.now())+'.json';
    a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
    toast('已导出 '+cats().length+' 个分类');
  };
  $('catImport').onclick = function(){
    var inp = document.createElement('input');
    inp.type='file'; inp.accept='.json,application/json';
    inp.onchange = function(){
      var f = inp.files&&inp.files[0]; if(!f) return;
      var fr = new FileReader();
      fr.onload = function(){
        try{
          var j = JSON.parse(fr.result);
          if(!Array.isArray(j)) throw new Error('文件里不是分类数组');
          var base = (S.cats||JSON.parse(JSON.stringify(DEFAULT_CATS)));
          var byId = {};
          base.forEach(function(c){ byId[c.id]=c; });
          var added=0, merged=0;
          j.forEach(function(c){
            if(!c||!c.name) return;
            var id = c.id||('c'+Math.random().toString(36).slice(2,8));
            if(byId[id]){
              var t = byId[id];
              (c.kw||[]).forEach(function(k){ if(t.kw.indexOf(k)<0){ t.kw.push(k); merged++; } });
              if(c.emoji) t.emoji=c.emoji;
              if(c.color) t.color=c.color;
            } else {
              base.push({ id:id, name:c.name, emoji:c.emoji||'📦', color:c.color||'#C9C2B0',
                type:c.type==='income'?'income':'expense', kw:Array.isArray(c.kw)?c.kw:[] });
              added++;
            }
          });
          S.cats = base; persist(); openCats(); renderAll();
          toast('导入完成：新增 '+added+' 个，合并 '+merged+' 个词');
        }catch(e){ toast('导入失败：'+e.message); }
      };
      fr.readAsText(f);
    };
    inp.click();
  };
  Array.prototype.forEach.call(body.querySelectorAll('.srow'), function(el){
    el.addEventListener('click', function(){ openCatEdit(el.getAttribute('data-cid')); });
  });
}
function catItemHtml(c){

  var prev = kw.slice(0,5).join('、') + (kw.length>5?'…':'');
  var ic = catIcon(c.name);
  return '<div class="srow" data-cid="'+esc(c.id)+'">'
    + (ic
        ? '<div class="ic" style="background:#E9E7E1;padding:0;overflow:hidden;"><img src="'+ic+'" alt="" style="width:100%;height:100%;object-fit:cover;"></div>'
        : '<div class="ic" style="background:'+tint(c.color,.20)+';">'+c.emoji+'</div>')
    + '<div class="mid"><div class="n">'+esc(c.name)+'</div>'
    +   '<div class="d">'+esc(prev||'（没有关键词）')+'</div></div>'
    + '<span class="tag">'+kw.length+' 词</span>'
    + '<span class="ar">'+ICO.arw+'</span>'

    +     '<button id="ecEx">支出</button><button id="ecIn">收入</button></div>'
    + '</div>'
    + '<button class="btn btn-dark btn-full" id="ecSave">'+(c?'保存':'新增')+'</button>'

  function paint(){

      return '<button data-c="'+col+'" class="'+(col===editColor?'on':'')+'" style="background:'+col+';"></button>';

      b.addEventListener('click', function(){ editColor=b.getAttribute('data-c'); paint(); });

    paint();

  $('ecEx').onclick = function(){ editType='expense'; paint(); };
  $('ecIn').onclick = function(){ editType='income'; paint(); };
  $('ecSave').onclick = function(){
    var name = String($('ecName').value||'').trim();
    if(!name){ toast('请填分类名称'); return; }

/* 导入 JSON 备份。
   两种来源都认：
     · 本 App 导出的   { app:'lazy-ledger', records:[…] }
     · 熊记导出的      { app:'xiongji',     records:[…] }
     · 以及裸数组      [ {…}, {…} ]        （手写的、别的工具导的都行）
   合并规则：按 id 走，**已有的跳过、不覆盖**，所以重复导入不会翻倍，
   也不会把你手机上改过的记录冲掉。导入的记录标 manual=true，
   这样 App 不会拿自动分类规则去覆盖备份里的分类。 */
function importSheet(){
  $('sheetTitle').textContent = '导入数据';
  $('sheetBody').innerHTML = ''
    + '<div class="hint" style="margin:0 2px 14px;">'
    +   '选一个之前导出的 JSON 备份文件，或者把内容直接粘到下面。'
    +   '<br>和本机已有的记录<b>按 id 合并，已有的不会被覆盖</b>。'
    + '</div>'
    + '<div class="fld"><span class="lb">方式一 · 选文件</span>'
    +   '<input type="file" id="impFile" accept=".json,application/json"></div>'
    + '<div class="fld"><span class="lb">方式二 · 粘贴内容</span>'
    +   '<textarea id="impText" rows="6" placeholder=\'{"app":"lazy-ledger","records":[…]} 或 […]\'></textarea>'
    +   '<div class="hint">整个文件内容全选复制粘进来就行。</div></div>'
    + '<button class="btn btn-dark btn-full" id="impGo">导入</button>';
  openSheetMorph();
  $('sheetX').onclick = closeSheet;

  /* 选文件后直接填进文本框 —— 只用一种确认方式，省得两处都要点。
     内置浏览器对 file 选择器支持不稳，所以粘贴那条路永远留着。 */
  var fi = $('impFile');
  if(fi){
    fi.onchange = function(){
      var f = fi.files && fi.files[0];
      if(!f) return;
      var fr = new FileReader();
      fr.onload = function(){ $('impText').value = String(fr.result||''); toast('已读取，点「导入」'); };
      fr.onerror = function(){ toast('文件读取失败，改用粘贴吧'); };
      fr.readAsText(f);
    };
  }
  $('impGo').onclick = function(){ doImport($('impText').value); };
}
function doImport(text){
  var txt = String(text||'').trim();
  if(!txt){ toast('还没选文件或粘内容'); return; }

  /* 用 App 自带的宽松解析兜一层：备份文件本身是合法的，
     但用户从聊天记录里复制粘贴时可能带上多余引号/换行。 */
  var parsed = null;
  try{ parsed = JSON.parse(txt); }catch(e){ parsed = null; }
  if(!parsed){
    var p = looseJson(txt);
    if(p.ok) parsed = p.obj;
  }
  if(!parsed){ toast('这段内容不是有效的 JSON'); return; }

  var list = parsed.records ? parsed.records : parsed;
  if(!Array.isArray(list)){ toast('没找到记录列表（应有 records 字段）'); return; }
  if(!list.length){ toast('备份里没有记录'); return; }

  var added=0, skipped=0, bad=0;
  var cats_ = cats();
  function catExists(name){
    for(var i=0;i<cats_.length;i++) if(cats_[i].name===name) return true;
    return false;
  }
  list.forEach(function(o){
    if(!o || typeof o!=='object'){ bad++; return; }
    var amt = Math.abs(Number(o.amount))||0;
    if(!amt){ bad++; return; }
    var id = sanitizeId(o.id||newId());
    if(S.records[id]){ skipped++; return; }          /* 已有 → 跳过，不覆盖 */
    var type = o.type==='income' ? 'income' : 'expense';
    var cat = String(o.category||'').trim();
    if(!cat || !catExists(cat)) cat = type==='income' ? '其他收入' : '其他';
    var time = String(o.time||'').trim();
    if(!/^\d{4}-\d{2}-\d{2}[ _]\d{2}:\d{2}/.test(time)){
      time = ymdStr(Date.now())+' '+hmStr(Date.now());
    }
    var rec = {
      id: id, type: type, amount: amt, category: cat,
      note: String(o.note||''), account: String(o.account||'')||'微信支付',
      time: time.replace('_',' '), src: 'web', manual: true, auto: false
    };
    rec.ts = parseTs(rec.time);
    var rawIn = String(o.raw||'');
    if(rawIn) rec.raw = rawIn.slice(0,2000);
    S.records[id] = rec;
    S.pending[id] = true;                            /* 配了同步就会推上云 */
    added++;
  });

  persist(); closeSheet(); renderAll();
  var msg = '导入 '+added+' 笔';
  if(skipped) msg += '，跳过 '+skipped+' 笔（已存在）';
  if(bad)     msg += '，'+bad+' 笔无效';
  toast(msg);
  if(added && isCfgOk() && navigator.onLine) sync(false);
}

/* 静默检查线上版本；有新版本就提示一下，不强制刷新 */
var updateNotified = false;
function autoCheckUpdate(){
  if(updateNotified || !navigator.onLine) return;
  fetch('./index.html?ver=' + Date.now(), { cache:'no-store' })
    .then(function(r){ return r.ok ? r.text() : ''; })
    .then(function(txt){
      var m = txt.match(/var VER = '([^']+)'/);
      if(!m) return;
      var remote = m[1].trim();
      if(remote && remote !== VER){
        updateNotified = true;
        toast('发现新版本 '+remote+'，去「我的 → 检查更新」');
      }
    })
    .catch(function(){});
}
/* 检查更新：清掉 SW 与缓存后重载，确保拿到线上最新版 */
function checkUpdate(){
  toast('检查更新中…');
  var reloaded = false;
  function reload(){ if(reloaded) return; reloaded = true; location.reload(); }
  setTimeout(reload, 2500);
  function clearCaches(){
    if(typeof caches === 'undefined' || !caches.keys) return Promise.resolve();
    return caches.keys().then(function(keys){
      return Promise.all(keys.map(function(k){ return caches.delete(k); }));
    }).catch(function(){});
  }
  function updateSW(){
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return Promise.resolve();
    return navigator.serviceWorker.getRegistrations().then(function(rs){
      return Promise.all(rs.map(function(r){
        try{ if(r.waiting && r.waiting.postMessage) r.waiting.postMessage('skipWaiting'); }catch(e){}
        return r.update ? r.update().catch(function(){}) : null;
      }));
    }).catch(function(){});
  }
  Promise.all([clearCaches(), updateSW()]).then(reload).catch(reload);
}

/* ================= 事件绑定 ================= */
function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('.tabbar .tab'), function(t){
    t.addEventListener('click', function(){ showPage(t.getAttribute('data-page')); });
  });
  $('tabAdd').addEventListener('click', function(){ openSheet(null); });
  // 页面内的 data-act 快捷钮（首页圆钮 / 我的页列表 / 统计页「去设置」）——
  // 统一在 document 上代理一次，避免各页自己绑造成重复触发
  document.addEventListener('click', function(e){
    var el = e.target.closest ? e.target.closest('[data-act]') : null;
    if(!el) return;
    var a = el.getAttribute('data-act');
    if(a==='add-ex') openSheet(null, 'expense');
    else if(a==='add-in') openSheet(null, 'income');
    else if(a==='budget') openBudget();
    else if(a==='cats') openCats();
    else if(a==='go-list') showPage('list');
    else if(a==='recurring') openRecurring();
    else if(a==='sync') openSync();
    else if(a==='about') openAbout();
    else if(a==='share') shareApp();
    else if(a==='export') exportJson();
    else if(a==='import') importSheet();
    else if(a==='update') checkUpdate();
  });
  $('mask').addEventListener('click', function(e){ if(e.target===$('mask')) closeSheet(); });
  window.addEventListener('online', function(){ sync(false); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){
      if(S.cfg.auto) sync(false);
      autoCheckUpdate();
    }
  });
}

/* ================= 启动 ================= */
function isStandalone(){
  try{
    if(window.navigator.standalone === true) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
  }catch(e){}
  return false;
}
/* 精确设置布局尺寸：--app-h 给 body，--tab-h 给内容区留出底栏高度 */
function setAppHeight(){
  var h = window.innerHeight;
  if(!h) return;
  if(window.visualViewport && window.visualViewport.height){
    h = Math.max(h, Math.round(window.visualViewport.height));
  }
  var root = document.documentElement;
  root.style.setProperty('--app-h', h + 'px');
  root.setAttribute('data-standalone', isStandalone() ? '1' : '0');
  var tb = document.querySelector('.tabwrap');
  if(tb){
    var th = Math.round(tb.getBoundingClientRect().height);
    if(th > 0) root.style.setProperty('--tab-h', th + 'px');
  }
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', function(){
  setTimeout(setAppHeight, 120);
  setTimeout(setAppHeight, 400);
});
if(window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

load();
bind();
showPage('home');
setInterval(function(){
  if(S.cfg.auto && isCfgOk() && navigator.onLine && !document.hidden) sync(false);
}, 180000);
setTimeout(function(){ if(S.cfg.auto && isCfgOk()) sync(false); }, 900);

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
    navigator.serviceWorker.ready.then(function(reg){
      if(reg && reg.update) reg.update().catch(function(){});
    }).catch(function(){});
  });
  /* 页面被新 SW 接管时自动刷新一次（只在版本真的变了时发生）。
     首次访问时 controller 本来是 null，安装完成也会触发 controllerchange ——
     不挡掉的话新用户一进来就被白刷一次。所以先记下"本来就有 controller"。 */
  var hadController = !!navigator.serviceWorker.controller;
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(refreshing || !hadController) return;
    refreshing = true;
    location.reload();
  });
}
})();
