<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>熊记</title>
<meta name="description" content="iPhone 快捷指令自动记账 · 手动记账 · 统计，离线可用，数据同步到自己的 GitHub 私有仓库">
<meta name="theme-color" content="#B5DEE6">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="熊记">
<style>
  :root{
    --paper:#B5DEE6;      /* 薄荷蓝页面底 */
    --paper2:#FFFFFF;     /* 白色卡片 */
    --ink:#4C6570;        /* 深灰蓝文字 */
    --mint:#5DC2AE;       /* 收入绿 */
    --pink:#F58BA8;       /* 主色粉 */
    --pink-l:#FFE3EA;
    --muted:#8FA8B0;      /* 次要文字 */
    --av-bg:#E8F6F8;      /* 图标底板 */
    --nav-idle:#9FB6BD;
    --bd:none;
    --sh:0 6px 18px rgba(70,120,132,.13);
    --sh-sm:0 3px 10px rgba(70,120,132,.13);
    --r-lg:24px;
    --r-md:20px;
    --r-sm:14px;
    --tabbar-h:64px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  /* 禁止双指捏合缩放（加进主屏后捏小会露出白边，看着像网页）。
     viewport 的 user-scalable=no 在 iOS 上会被忽略，touch-action 才管用；
     双击放大也用这条压掉（别用 touchend preventDefault，会吃掉 click）。 */
  html,body{touch-action:pan-x pan-y; overscroll-behavior:none;}
  /* ⚠️底部那条约 47pt 的纯色带——**三条证据证明是 iOS 系统画的，网页画不进去**
     （2026-10-13 第 4 轮，做完实验才定论，别再走弯路）
     证据：
       ① 那条带【整行 0 个白像素】；而页面中凡网页绘制的区域都有波点。
       ② 那条带的颜色**严格跟随 manifest 的 background_color**，不跟页面走：
          v1.0.2 时 manifest=白 → 那条是白(255,255,255)；
          v1.1.4 时 manifest=薄荷 → 那条是薄荷(181,222,230)；
          而页面本身两个版本都是薄荷 → 它不是网页画的。
       ③ 实验：把 `html` 高度强行压到 600px（= 视口底往上 244px），
          **底部那 244px 里波点依旧完整**（每 40px 就测到 dots=2~4）
          → 证明「波点画在 html 上」本身没问题、能铺满整个画布；
          既然画布内没问题，剩下那条就只能是**画布之外**（视口之外）。
     成因：独立 App 下网页视口比屏幕矮约 47pt（实测：胶囊 CSS `bottom:10px`，
     截图量得胶囊下缘距屏幕底 57pt ⇒ 视口底边距屏幕底约 47pt），
     那 47pt 是 iOS 的窗口背景区，网页渲染不到，只能由系统按 manifest 背景色填充。
     ✅ 交付做法：画不进去就让它**无缝**。让波点在视口底部平滑淡出，
     使页面最底一段与那条系统色带完全同色、看不出接缝 —— 视觉上就是整屏一块背景。
     淡出 64px：绝大部分被浮动胶囊遮住，只在两侧留白露一点很柔的过渡。 */
  html{
    -webkit-text-size-adjust:100%; overflow-anchor:none; height:100%; overflow:hidden;
    /* 画布底色 = 页面纸色（系统画那条带时取的就是这个值） */
    background-color:var(--paper);
  }
  /* 三段式布局：标题 / 内容区（独立滚动）/ 输入栏 / 任务栏
     高度策略（按可靠性排序，JS 会覆盖成精确像素值）：
       1) JS 读 window.innerHeight 写进 --app-h（最准，iOS 独立 App 也准）
       2) 退回 height:100%（html 的高度 = 视口高度）
     —— 不用 100vh/100dvh：iOS 独立 App 下会偏小导致底部留空、任务栏悬空 */
  body{
    height:100%;
    height:var(--app-h, 100%);
    margin:0; color:var(--ink);
    /* 保持透明：底色在 html，波点在下面的 ::before 层 */
    background:transparent;
    font-family:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
    line-height:1.45;
    font-weight:600;
    display:flex; flex-direction:column;
    overflow:hidden;
    overflow-anchor:none;
  }
  /* 波点层：固定铺满视口；最底部 80px 渐隐。
     为什么要渐隐：屏幕最底约 47pt 是 iOS 的窗口背景区（网页画不进去，见上面注释），
     它按 manifest 背景色填成纯薄荷。若波点在视口底部硬切，那条「有波点 → 没波点」
     的横线会很扎眼；渐隐让波点柔和收掉，与那条纯色无缝相接。
     80px ≈ 27pt，大部分被浮动胶囊挡着，只在两侧留白露一点过渡。
     ⚠️ 不要加大这个值：v1.1.3 用过 170px，结果制造了一大片没波点的区域。 */
  body::before{
    content:''; position:fixed; left:0; right:0; top:0; bottom:0;
    z-index:-1; pointer-events:none;
    background-image:radial-gradient(#FFFFFF 2.2px, transparent 2.5px);
    background-size:14px 14px;
    background-repeat:repeat;
    -webkit-mask-image:linear-gradient(to bottom, #000 calc(100% - 80px), transparent 100%);
    mask-image:linear-gradient(to bottom, #000 calc(100% - 80px), transparent 100%);
  }
  /* 金额 / 统计数字：等宽对齐 + 紧字距 */
  .big-amt,.cc-amt,.rec-amt,.sum-card .amt,.st-hero .big,.cell .v,
  .hero-split .it .v,.sum-main .sum-v,.mcol .v,.le-amt,.cat-top .amt,.bud-foot{
    font-variant-numeric:tabular-nums;
    letter-spacing:-1px;
  }
  button{font-family:inherit; font-weight:800; color:var(--ink); cursor:pointer; border:none; background:none;}
  input,select,textarea{font-family:inherit; font-weight:700; color:var(--ink);}

  /* ---------- 通用盒子 ---------- */
  .box{background:var(--paper2); border-radius:var(--r-lg); box-shadow:var(--sh);}
  .pad{padding:14px;}

  /* ---------- 顶栏（三段布局的第一段）----------
     只保留一个居中的日期按钮（上面贴一张熊贴纸），点了从按钮形变展开月份面板。 */
  header{
    flex:none; z-index:35;
    background:transparent;
    padding:calc(10px + env(safe-area-inset-top)) 12px 6px;
    display:flex; align-items:center; justify-content:center;
  }
  /* 日期按钮 = 月选择面板的形变源（起点矩形由 getBoundingClientRect 实时量） */
  .date-chip{
    position:relative;
    background:var(--paper2); border-radius:999px; box-shadow:var(--sh-sm);
    padding:9px 20px 9px 15px; display:flex; align-items:center; gap:8px;
    font-size:15px; font-weight:800; color:var(--ink); letter-spacing:.5px;
  }
  .date-chip .date-text{white-space:nowrap;}
  /* 日期上的熊贴纸（轻微倾斜，像贴纸贴上去） */
  .date-chip .date-sticker{
    width:26px; height:26px; flex:none; margin-left:-4px;
    display:flex; align-items:center; justify-content:center;
    transform:rotate(-10deg);
  }
  .date-chip .date-sticker img{width:100%; height:100%; object-fit:contain;}
  /* 小三角提示「可点」 */
  .date-chip .date-caret{
    width:0; height:0; flex:none;
    border-left:5px solid transparent; border-right:5px solid transparent;
    border-top:6px solid var(--muted); margin-left:1px;
  }

  /* ---------- 月份选择面板（Trigger Morph：从日期按钮长出来） ---------- */
  .dp-mask{
    position:fixed; inset:0; z-index:70;
    background:rgba(76,101,112,.42);
    opacity:0; pointer-events:none; transition:opacity .28s ease;
  }
  .dp-mask.show{opacity:1; pointer-events:auto;}
  .dp-panel{
    position:fixed; z-index:71; overflow:hidden;
    background:var(--paper2); box-shadow:var(--sh);
    display:none;   /* 展开时由 JS 打开 */
  }
  .dp-panel.show{display:block;}
  .dp-inner{padding:16px; opacity:0;}   /* 内容延迟淡入，避免被拉伸变形 */
  .dp-year{display:flex; align-items:center; justify-content:center; gap:14px; margin-bottom:14px;}
  .dp-year .dp-y{font-size:17px; font-weight:800; letter-spacing:1px; min-width:84px; text-align:center;}
  .dp-year .dp-yb{
    width:34px; height:34px; border-radius:50%; background:var(--av-bg);
    box-shadow:var(--sh-sm); font-size:17px; font-weight:800;
    display:flex; align-items:center; justify-content:center; padding:0;
  }
  .dp-grid{display:grid; grid-template-columns:repeat(3,1fr); gap:9px;}
  .dp-cell{
    padding:11px 4px; border-radius:var(--r-sm); background:var(--av-bg);
    font-size:14px; font-weight:800; text-align:center; color:var(--ink);
  }
  .dp-cell.on{background:var(--pink-l); color:var(--pink);}
  .dp-cell.future{opacity:.35;}
  .dp-today{margin-top:14px;}

  /* 内容区：三段布局的第二段，独立滚动 */
  main{
    flex:1 1 auto; min-height:0;
    overflow-y:auto; -webkit-overflow-scrolling:touch;
    max-width:660px; width:100%; margin:0 auto;
    padding:12px;
    position:relative;
  }
  /* 对话页：绝对定位铺满内容区 —— 高度由 inset 决定，
     不依赖 100% / 100vh / 100dvh（这些在 iOS 独立 App 下都不可靠）。
     底栏是浮动胶囊（离屏幕底 10px），所以留白要加上那段间距。 */
  #page-chat.active{
    position:absolute;
    top:8px; left:12px; right:12px;
    bottom:calc(var(--tab-h, 92px) + 24px);
    display:flex; flex-direction:column;
    overflow:hidden;
  }
  #page-chat .chat-hero{flex:none;}
  #page-chat .composer{flex:none;}
  #page-chat #chatFeed{flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;}
  .page{display:none;}
  .page.active{display:block;}
  /* 非对话页：底部留出浮动胶囊的高度 + 它离屏幕底的那段间距 */
  #page-list.active, #page-stats.active, #page-me.active{
    padding-bottom:calc(var(--tab-h, 92px) + 24px);
  }

  /* ---------- 对话页 ---------- */
  .chat-hero{
    position:relative;
    background:var(--paper2); border-radius:var(--r-lg); box-shadow:var(--sh);
    padding:14px 16px 12px; margin:52px 0 14px;
  }
  /* 主卡右上角：三只一起的大图（重度标志性元素） */
  .chat-hero::after{
    content:''; position:absolute; right:6px; top:-50px; width:158px; height:112px;
    background:url('./bears/b2_info.png') no-repeat center/contain; pointer-events:none;
  }
  /* 笔数标签紧跟标题左对齐：右上角留给三只熊，避免遮挡 */
  .chat-hero .hh{display:flex; align-items:center; justify-content:flex-start; gap:8px;}
  .chat-hero .hh .lb{font-size:12.5px; font-weight:700; color:var(--muted);}
  .tag-y{background:var(--av-bg); border-radius:999px; padding:3px 11px; font-size:11.5px; font-weight:800; color:var(--ink);}
  .big-amt{font-size:42px; font-weight:800; letter-spacing:-1px; line-height:1.1; margin:2px 0 10px; color:var(--pink);}
  .big-amt small{font-size:24px; font-weight:800;}
  .hero-rule{height:1px; background:rgba(143,168,176,.28); margin:10px 0;}
  .hero-split{display:grid; grid-template-columns:repeat(3,1fr); gap:8px;}
  .hero-split .it .k{font-size:10.5px; font-weight:600; color:var(--muted);}
  .hero-split .it .v{font-size:14px; font-weight:800; margin-top:2px; color:var(--ink);}
  .hero-dots{
    margin-top:12px; height:8px; border-top:2px dotted rgba(143,168,176,.4);
    display:flex; align-items:flex-end; gap:5px; padding-top:3px; overflow:hidden;
  }
  .hero-dots i{display:block; width:5px; height:5px; border-radius:50%; background:var(--muted); opacity:.35;}

  .bubble-wrap{display:flex; justify-content:flex-end; margin-bottom:12px;}
  .bubble{
    background:var(--pink-l); border-radius:var(--r-md); box-shadow:var(--sh-sm);
    padding:10px 14px; font-size:14px; font-weight:700; max-width:80%;
  }
  .bubble.left{background:var(--paper2); margin-right:auto;}

  .chat-card{
    position:relative;
    border-radius:var(--r-lg); box-shadow:var(--sh); background:var(--paper2);
    margin-bottom:12px; padding:12px 14px; cursor:pointer;
  }
  /* 卡片右下角的淡熊（重度装饰，不盖文字） */
  .chat-card::after{
    content:''; position:absolute; right:10px; bottom:44px; width:56px; height:52px;
    background:url('./bears/b1_faq.png') no-repeat center/contain;
    opacity:.2; pointer-events:none; z-index:0;
  }
  /* ---------- 记录卡片堆叠滚动（Stacked Card Scroll）----------
     规格见 ~/.agents/skills/app-interaction-design/references/interaction-patterns.md 第 9 条。
     做法要点（照搬参考里实测通过的版本）：
       · 每张卡 position:sticky + 内联 top 阶梯 → 自然吸顶
       · 吸顶后的 scale / 上移 / opacity / zIndex 全部由真实 scrollTop 算出，天然可逆
       · 缩放下限 0.9、透明度下限 0.6，保证文字可读
     卡片尺寸由 JS 统一写死高度，节距才可预测。 */
  #chatFeed{position:relative;}
  .stack-card{
    position:sticky;
    margin-bottom:12px;
    transform-origin:50% 0%;
    will-change:transform, opacity;
    backface-visibility:hidden;
  }
  /* 最后一张卡后面的留白，否则它滚不到吸顶位 */
  .stack-tail{height:44vh; pointer-events:none;}
  .cc-top{display:flex; align-items:center; gap:11px; position:relative; z-index:1;}
  .cc-emoji{
    width:54px; height:54px; border-radius:var(--r-sm); flex:none;
    background:var(--av-bg); display:flex; align-items:center; justify-content:center;
    font-size:26px; overflow:hidden;
  }
  .cc-emoji img{max-width:78%; max-height:80%; object-fit:contain;}
  .cc-mid{flex:1; min-width:0;}
  .cc-cat{font-size:16px; font-weight:800;}
  .cc-sub{font-size:11.5px; font-weight:600; color:var(--muted); margin-top:1px;}
  .cc-amt{font-size:28px; font-weight:800; letter-spacing:-.5px; margin-top:6px; color:var(--pink); position:relative; z-index:1;}
  .cc-amt.in{color:var(--mint);}
  .chip-tag{
    border-radius:999px; box-shadow:var(--sh-sm); padding:4px 12px; font-size:11.5px; font-weight:800;
    background:var(--pink-l); color:var(--pink); flex:none;
  }
  .chip-tag.in{background:#DFF4EE; color:var(--mint);}
  .cc-rule{height:1px; background:rgba(143,168,176,.28); margin:10px 0;}
  .cc-foot{display:flex; align-items:center; justify-content:space-between; gap:10px;
    font-size:12px; font-weight:700; color:var(--muted); position:relative; z-index:1;}
  .cc-edit,.cc-del{
    border-radius:999px; box-shadow:var(--sh-sm); background:var(--av-bg);
    padding:5px 13px; font-size:12px; font-weight:800; color:var(--ink);
  }
  .cc-del{background:var(--pink-l); color:var(--pink);}

  .quick-row{display:flex; flex-wrap:wrap; gap:9px; margin-bottom:12px;}
  .quick{
    background:var(--paper2); border-radius:999px; box-shadow:var(--sh-sm);
    padding:9px 15px; font-size:13px; font-weight:700;
  }

  /* 记账输入区：贴在主卡下方，固定不动（不参与滚动） */
  .composer{
    flex:none;
    background:var(--paper2); border-radius:var(--r-lg); box-shadow:var(--sh);
    padding:12px;
    margin-bottom:14px;
  }
  .composer-btns{display:flex; gap:9px; margin-bottom:10px;}
  .cbtn{
    flex:1; border-radius:999px; box-shadow:var(--sh-sm); background:var(--av-bg);
    padding:10px; font-size:14px; font-weight:800; color:var(--muted);
  }
  .cbtn.on-ex{background:var(--pink-l); color:var(--pink);}
  .cbtn.on-in{background:#DFF4EE; color:var(--mint);}

  .input-row{display:flex; gap:9px; align-items:stretch;}
  .input-row input{
    flex:1; min-width:0; border:none; border-radius:999px; box-shadow:var(--sh-sm); background:var(--av-bg);
    padding:13px 16px; font-size:15px; font-weight:600;
  }
  .input-row input::placeholder{color:var(--nav-idle); font-weight:600;}
  .send-btn{
    width:52px; flex:none; background:var(--pink); border-radius:50%; box-shadow:var(--sh-sm);
    font-size:22px; font-weight:800; color:#fff;
    display:flex; align-items:center; justify-content:center; padding:0;
  }


  /* ---------- 账本页 ---------- */
  .sum-card{border-radius:var(--r-lg); box-shadow:var(--sh); background:var(--paper2); padding:14px 16px; margin-bottom:12px;}
  .sum-card .top{display:flex; align-items:flex-start; justify-content:space-between; gap:10px;}
  .sum-card .lb{font-size:12.5px; font-weight:700; color:var(--muted);}
  .sum-card .amt{font-size:38px; font-weight:800; letter-spacing:-1px; line-height:1.15; color:var(--pink);}
  .sum-card .bal{font-size:12.5px; font-weight:700; color:var(--muted); text-align:right;}
  .cnt-tag{background:var(--av-bg); border-radius:999px; padding:4px 11px; font-size:11.5px; font-weight:800; color:var(--ink);}

  .day-block{border-radius:var(--r-lg); box-shadow:var(--sh); background:var(--paper2); margin-bottom:12px; overflow:hidden;}
  .day-head{
    display:flex; align-items:center; justify-content:space-between; gap:10px;
    padding:11px 15px; background:var(--av-bg);
  }
  .day-head .d1{font-size:15px; font-weight:800;}
  .day-head .d2{font-size:11px; font-weight:600; color:var(--muted);}
  .day-head .dsum{font-size:14px; font-weight:800; color:var(--pink);}
  .rec-row{
    position:relative; display:flex; align-items:center; gap:11px; padding:11px 15px;
    border-bottom:1px solid rgba(143,168,176,.16); cursor:pointer;
  }
  .rec-row:last-child{border-bottom:none;}
  .rec-row:active{background:var(--av-bg);}
  /* 记录行右端的淡熊（重度装饰） */
  .rec-row::after{
    content:''; position:absolute; right:14px; top:50%; transform:translateY(-50%);
    width:38px; height:36px;
    background:url('./bears/b3_wave.png') no-repeat center/contain;
    opacity:.22; pointer-events:none; z-index:0;
  }
  .rec-time{font-size:11.5px; font-weight:700; width:40px; flex:none; color:var(--muted);}
  .rec-icon{width:38px; height:38px; border-radius:11px; background:var(--av-bg); flex:none;
    display:flex; align-items:center; justify-content:center; font-size:19px; overflow:hidden;}
  .rec-icon img{max-width:76%; max-height:78%; object-fit:contain;}
  .rec-mid{flex:1; min-width:0; position:relative; z-index:1;}
  .rec-cat{font-size:14.5px; font-weight:800; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rec-note{font-size:11px; font-weight:600; color:var(--muted); white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
  .rec-amt{font-size:15px; font-weight:800; flex:none; letter-spacing:-.3px; color:var(--pink); position:relative; z-index:1;}
  .rec-amt.in{color:var(--mint);}
  .auto-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--mint); margin-right:5px; vertical-align:1px;}
  .pend-dot{display:inline-block; width:7px; height:7px; border-radius:50%; background:var(--pink); margin-right:5px; vertical-align:1px;}

  .empty{padding:26px 16px 34px; text-align:center; display:flex; flex-direction:column; align-items:center; gap:8px;}
  .empty .big{font-size:44px; line-height:1;}
  .empty .big img{width:96px; height:auto; object-fit:contain;}
  .empty .t{font-size:13px; font-weight:700; color:var(--muted);}

  /* ---------- 统计页 ---------- */
  .st-hero{

  /* ---------- 底栏：浮动胶囊 ---------- */
  /* 整条是一个独立胶囊，四周露出页面背景（薄荷 + 圆点），不再贴着屏幕边。
     ⚠️ 屏幕最底约 62pt 是 iOS 系统预留区（网页画不到），系统取 body 的
     background-color 填色；因此 body 底色必须是页面纸色（薄荷），那条就与页面同色。
     详见 body 规则处的注释。 */
  nav.tabbar{
    position:fixed; left:14px; right:14px; bottom:10px; z-index:40;
    background:var(--paper2);
    border-radius:26px;                    /* 四角都圆 → 完整胶囊 */
    box-shadow:0 6px 20px rgba(70,120,132,.20);
    padding:9px 10px;
    display:flex; gap:4px;
  }
  /* Safari 标签页模式：底部有工具栏 + Home Indicator，胶囊整体上抬 */
  html[data-standalone="0"] nav.tabbar{
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  }
  /* 独立 App 模式（添加到主屏幕）：可视区已含 Home Indicator 区，不需要再抬 */
  html[data-standalone="1"] nav.tabbar{
    bottom:10px;
  }
  /* JS 尚未跑起来时的兜底（按 Safari 模式处理） */
  html:not([data-standalone]) nav.tabbar{
    bottom:calc(10px + env(safe-area-inset-bottom, 0px));
  }
  nav.tabbar .tab{
    position:relative; z-index:1;
    flex:1; background:none; border-radius:999px; padding:8px 0 7px;
    display:flex; flex-direction:column; align-items:center; gap:4px;
    font-size:11.5px; font-weight:800; color:var(--nav-idle);
    transition:color .22s ease;
    /* ⚠️ 不要在这里写 will-change:transform —— 4 个 tab 各提升一个图层，
       叠加胶囊自己共 5 个合成层，iOS 上会拖慢并留下残影。
       图层提升只在按压期间由 .spring 内部临时加（见 attachSpring）。 */
  }
  /* 图标放大（用户要求） */
  nav.tabbar .tab .ti{height:27px; line-height:1; display:flex; align-items:center; justify-content:center;}
  nav.tabbar .tab .ti img{height:27px; width:auto; object-fit:contain;}
  nav.tabbar .tab .ti.emo{font-size:27px;}
  /* 选中态：颜色由 .nav-pill 那块滑动背景负责，这里只把文字/图标提亮 */
  nav.tabbar .tab.on{background:none; color:var(--pink);}

  /* 滑动胶囊。
     ⚠️ 残影/卡顿的根因（v1.1.2 修）：原来对 transform + width + height 三个属性
     做过渡，其中 width/height 属于布局属性，每帧触发重排（layout），
     在 iOS 上表现为掉帧 + 上一次的位置留下残影。
     正解：**尺寸不进过渡，只用 transform 做位移**——
       ① 胶囊尺寸在点击瞬间直接写死（不参与动画）；
       ② 位移用 translate3d（走合成层，不重排）；
       ③ 宽度变化改为 `scaleX` 会拉伸圆角，所以这里改用「固定最大宽度 + translate」，
          胶囊尺寸按最宽的 tab 一次性定好，视觉上仍是圆角胶囊。 */
  nav.tabbar .nav-pill{
    position:absolute; left:0; top:0;
    background:var(--paper); border-radius:999px;
    pointer-events:none; z-index:0;
    transform:translate3d(0,0,0);
    transition:transform .32s cubic-bezier(.22,.9,.24,1);
    will-change:transform;
  }
  /* 减弱动效偏好：直接跳，不做滑动 */
  @media(prefers-reduced-motion:reduce){
    nav.tabbar .nav-pill{transition:none}
  }

       · 按下 1 → 0.93，过阻尼（k=470/d=27，几乎不过冲）—— 必须快速到位

  .spring{position:relative;}

<script>
/* 首屏就判定是否「独立 App 模式」——必须在渲染前设置，
   否则任务栏会先按 Safari 模式渲染再跳一下 */
(function(){
  var sa = 0;
  try{
    if(window.navigator.standalone === true) sa = 1;
    else if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) sa = 1;
    else if(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) sa = 1;
  }catch(e){}
  document.documentElement.setAttribute('data-standalone', sa ? '1' : '0');
})();
</script>

   viewport 的 user-scalable=no 在 iOS 上基本被忽略，真正管用的是这两条：
     - gesturestart/change/end 是 iOS Safari 专有事件，拦掉即可
     - touchmove 里判断多指兜底（部分 WebView 不发 gesture 事件）

   千万别在 touchend 里 preventDefault —— 那会把后续 click 一起吃掉，按钮全点不动。

(function lockZoom(){

function parseTs(s){
  if(!s) return 0;
  var t = new Date(String(s).replace(' ','T'));
  if(!isNaN(t.getTime())) return t.getTime();
  var m = String(s).match(/(\d{4})-(\d{2})-(\d{2})[ T_.](\d{2})[-.:](\d{2})/);
  if(m) return new Date(+m[1],+m[2]-1,+m[3],+m[4],+m[5]).getTime();
  return 0;
}

/* 二次确认（替代原生 confirm）。
   内置浏览器/微信里 confirm 会被静默拦掉：不显示、直接返回 false，
   于是「删除」这种操作点了完全没反应。所以改成自己画一层。
   用法：askConfirm('确定删除？', function(){ ...真正要干的事... }, {okLabel:'删 除'}); */
function askConfirm(msg, onOk, opts){
  opts = opts || {};
  var box = $('cfm'), okBtn = $('cfmOk'), noBtn = $('cfmNo');
  if(!box || !okBtn || !noBtn) return;
  $('cfmMsg').textContent = msg;
  okBtn.textContent = opts.okLabel || '确 定';
  okBtn.className = 'btn ' + (opts.danger === false ? 'btn-g' : 'btn-r');
  noBtn.textContent = opts.cancelLabel || '取 消';

  function close(){ box.classList.remove('show'); okBtn.onclick = null; noBtn.onclick = null; box.onclick = null; }
  okBtn.onclick = function(e){ e.stopPropagation(); close(); if(onOk) onOk(); };
  noBtn.onclick = function(e){ e.stopPropagation(); close(); };
  // 点空白处 = 取消（破坏性操作不该被误触确认）
  box.onclick = function(e){ if(e.target === box) close(); };
  box.classList.add('show');
}

function toast(msg){
  var t=$('toast');

}
function copyText(txt, ok){

    try{ document.execCommand('copy'); toast(ok||'已复制'); }catch(e){ toast('复制失败'); }
    document.body.removeChild(ta);
  }
  if(navigator.clipboard && navigator.clipboard.writeText && (location.protocol==='https:'||location.hostname==='localhost'||location.hostname==='127.0.0.1')){
    navigator.clipboard.writeText(txt).then(function(){ toast(ok||'已复制'); }, fb);
  } else fb();
}

  if(/\d{4}[-/]\d{1,2}[-/]\d{1,2}/.test(c)) return true;
  if(/^\d{1,2}[-:.]\d{2}([-:.]\d{2})?$/.test(c)) return true;

function parseRawAmount(text){
  var s = String(text||'');

  if(m) return { sign:m[1], value:Math.abs(parseFloat(m[2].replace(/,/g,'')) )||0 };
  m = s.match(/([0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*元/);
  if(m) return { sign:'', value:Math.abs(parseFloat(m[1].replace(/,/g,'')) )||0 };
  return null;
}

function escapeCtl(s){
  var out='', inStr=false, esc2=false;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i), code=s.charCodeAt(i);
    if(esc2){ out+=ch; esc2=false; continue; }
    if(ch==='\\'){ out+=ch; esc2=true; continue; }
    if(ch==='"'){ inStr=!inStr; out+=ch; continue; }
    if(inStr && code<0x20){
      if(ch==='\n') out+='\\n'; else if(ch==='\r') out+='\\r'; else if(ch==='\t') out+='\\t';
      else out+='\\u'+('000'+code.toString(16)).slice(-4);
      continue;
    }
    out+=ch;
  }
  return out;
}
function escapeCtlSmart(s){
  var out='', inStr=false, esc2=false;
  for(var i=0;i<s.length;i++){
    var ch=s.charAt(i), code=s.charCodeAt(i);
    if(esc2){ out+=ch; esc2=false; continue; }
    if(ch==='\\'){ out+=ch; esc2=true; continue; }
    if(ch==='"'){
      if(!inStr){ inStr=true; out+=ch; continue; }
      var j=i+1, nx='';
      while(j<s.length && /\s/.test(s.charAt(j))) j++;
      nx=s.charAt(j);
      if(nx===','||nx===':'||nx==='}'||nx===']'||nx===''){ inStr=false; out+=ch; }
      else out+='\\"';
      continue;
    }
    if(inStr && code<0x20){
      if(ch==='\n') out+='\\n'; else if(ch==='\r') out+='\\r'; else if(ch==='\t') out+='\\t';
      else out+='\\u'+('000'+code.toString(16)).slice(-4);
      continue;
    }
    out+=ch;
  }
  return out;
}
function looseJson(text){
  var s = String(text==null?'':text);
  try{ return { ok:true, obj:JSON.parse(s), repaired:false }; }catch(e){}
  var cands = [
    s.replace(/:\s*,/g,':0,').replace(/:\s*([}\]])/g,':0$1').replace(/,\s*([}\]])/g,'$1'),
    escapeCtl(s),
    escapeCtl(s.replace(/:\s*,/g,':0,').replace(/:\s*([}\]])/g,':0$1').replace(/,\s*([}\]])/g,'$1')),
    s.replace(/[\r\n\t]/g, function(c){ return c==='\n'?'\\n':c==='\r'?'\\r':'\\t'; }),
    escapeCtlSmart(s)
  ];
  for(var i=0;i<cands.length;i++){
    try{ return { ok:true, obj:JSON.parse(cands[i]), repaired:true }; }catch(e){}
  }
  return { ok:false, obj:null, repaired:false };
}
function normalizeRec(r, idFromPath){
  var rawCat = String(r.category||'').trim();
  function clean(v){ return String(v==null?'':v).replace(/["']+$/,'').trim(); }
  var src = clean(r.src);
  if(src!=='shortcut' && src!=='web') src='shortcut';
  var rawAmt = Math.abs(Number(r.amount))||0;
  var rec = {
    id: sanitizeId(clean(r.id)||idFromPath),
    type: r.type==='income'?'income':'expense',
    amount: rawAmt,
    category: rawCat,
    note: String(r.note||''),
    account: clean(r.account),
    time: clean(r.time),
    src: src
  };
  rec.raw = String(r.raw||r.ocr||'').slice(0,2000);
  if(rec.src==='shortcut' && rec.raw && (!rec.amount || rec.amount===0)){
    var pa = parseRawAmount(rec.raw);
    if(pa && pa.sign==='-') rec.amount = pa.value;
  }
  if(isBadCat(rec.category)) rec.category = rec.type==='income'?'其他收入':'其他';
  rec.ts = parseTs(rec.time);
  if(rec.ts && String(r.time||'').indexOf('_')>=0) rec.time = ymdStr(rec.ts)+' '+hmStr(rec.ts);
  rec.auto = false;
  if(rec.src==='shortcut'){
    var hit = guessCat(rec);
    if(hit){ rec.category=hit; rec.auto=true; }
  }
  rec.fixed = (rec.category!==rawCat) || (rec.amount!==rawAmt);
  return rec;
}
function cloudRec(rec){
  var o = { id:rec.id, type:rec.type, amount:rec.amount, category:rec.category,
    note:rec.note, account:rec.account, time:rec.time, src:rec.src };
  if(rec.raw) o.raw = rec.raw;
  return o;
}

var syncing=false;
function ghHeaders(extra){
  var h = { 'Accept':'application/vnd.github+json', 'X-GitHub-Api-Version':'2022-11-28' };
  if(S.cfg.token) h['Authorization']='Bearer '+S.cfg.token;
  if(extra) for(var k in extra) h[k]=extra[k];
  return h;
}
function ghApi(path, opt){
  opt = opt||{};
  opt.headers = ghHeaders(opt.headers);
  return fetch('https://api.github.com'+path, opt).then(function(res){
    return res.text().then(function(txt){
      var body=null;
      try{ body = txt?JSON.parse(txt):null; }catch(e){}
      if(!res.ok){
        var msg = (body&&body.message)?body.message:('HTTP '+res.status);
        var err = new Error(msg); err.status=res.status; throw err;
      }
      return body;
    });
  });
}
function isCfgOk(){ return !!(S.cfg.owner && S.cfg.repo && S.cfg.token); }

function pushPending(){
  var ids = Object.keys(S.pending);
  var chain = Promise.resolve();
  ids.forEach(function(id){
    chain = chain.then(function(){
      var rec = S.records[id];
      if(!rec){ delete S.pending[id]; return Promise.resolve(); }
      var path = 'data/'+id+'.json';
      var body = { message:'ledger: '+(rec.time||ymdStr(Date.now())), content:b64(JSON.stringify(cloudRec(rec))) };
      if(S.known[path]) body.sha = S.known[path].sha;
      return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path, {
        method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
      }).then(function(r){
        if(r&&r.content&&r.content.sha) S.known[path]={sha:r.content.sha};
        delete S.pending[id]; persist();
      }).catch(function(e){
        if(e.status===422 && !S.known[path]){
          return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path).then(function(f){
            if(f&&f.sha){
              body.sha=f.sha;
              return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+path, {
                method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)
              }).then(function(r2){
                if(r2&&r2.content&&r2.content.sha) S.known[path]={sha:r2.content.sha};
                delete S.pending[id]; persist();
              });
            }
          });
        }
        throw e;
      });
    });
  });
  chain = chain.then(function(){
    return S.delQ.slice().reduce(function(c,d){
      return c.then(function(){
        return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+d.path, {
          method:'DELETE', headers:{'Content-Type':'application/json'},
          body:JSON.stringify({ message:'ledger: delete '+d.path, sha:d.sha })
        }).then(function(){
          delete S.known[d.path];
          S.delQ = S.delQ.filter(function(x){ return x.path!==d.path; });
          persist();
        }).catch(function(e){
          if(e.status===404){
            delete S.known[d.path];
            S.delQ = S.delQ.filter(function(x){ return x.path!==d.path; });
            persist();
          }
        });
      });
    }, Promise.resolve());
  });
  return chain;
}

function pull(){
  return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo).then(function(repo){
    var br = (repo&&repo.default_branch)||'main';
    if(br!==S.cfg.branch){ S.cfg.branch=br; persist(); }
    return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/git/trees/'+encodeURIComponent(br)+'?recursive=1');
  }).then(function(tree){
    var files = ((tree&&tree.tree)||[]).filter(function(t){
      return t.type==='blob' && /^data\/rec-.*\.json$/.test(t.path);
    });
    var fresh = files.filter(function(f){ return !S.known[f.path]; }).slice(0,300);
    return fresh.reduce(function(c,f){
      return c.then(function(){
        var m = f.path.match(/^data\/(rec-.*)\.json$/);
        var idFromPath = m?m[1]:null;
        return ghApi('/repos/'+S.cfg.owner+'/'+S.cfg.repo+'/contents/'+f.path).then(function(j){
          var txt=null;
          if(j && typeof j.content==='string' && j.content){
            try{ txt = decodeURIComponent(escape(atob(j.content.replace(/\s/g,'')))); }
            catch(e){ try{ txt = atob(j.content.replace(/\s/g,'')); }catch(e2){ txt=null; } }
          } else if(j && typeof j==='object' && (j.id||j.type||j.amount!=null)){
            var rec0 = normalizeRec(j, idFromPath);
            S.records[rec0.id]=rec0;
            S.known[f.path]={sha:j.sha||f.sha};
            if(rec0.fixed) S.pending[rec0.id]=true;
            persist();
            return;
          } else if(typeof j==='string'){ txt=j; }
          if(txt==null) throw new Error('empty');
          var p = looseJson(txt);
          if(!p.ok) throw new Error('bad json');
          var rec = normalizeRec(p.obj, idFromPath);
          S.records[rec.id]=rec;
          S.known[f.path]={sha:(j&&j.sha)||f.sha};
          if(rec.fixed || p.repaired) S.pending[rec.id]=true;
          persist();
        }).catch(function(){});
      });
    }, Promise.resolve());
  });
}

function sync(manual){
  if(syncing) return;
  if(!S.cfg.owner || !S.cfg.repo){ if(manual) toast('请先配置 GitHub 同步'); return; }
  if(!navigator.onLine){ if(manual) toast('当前离线'); return; }
  syncing = true;
  renderSyncBadge('同步中…');
  var hadErr=null;
  var pre = isCfgOk()?pushPending():Promise.resolve();
  pre.then(function(){ return pull(); })
    .then(function(){ return isCfgOk()?pushPending():Promise.resolve(); })
    .then(function(){ S.lastSync=Date.now(); persist(); })
    .catch(function(e){ hadErr=e; if(e&&e.status===401) S.lastSync=0; })
    .then(function(){
      syncing=false;
      renderAll();
      if(manual){
        if(hadErr) toast('同步失败：'+syncErrText(hadErr));
        else toast('同步完成 ✔');
      }
    });
}
/* 把 GitHub 的错误翻成人话 */
function syncErrText(e){
  if(!e) return '未知错误';
  if(e.status===401) return 'Token 无效或已过期（去 GitHub 重新生成）';
  if(e.status===403) return '权限不足（检查 Token 的 Contents 读写权限）';
  if(e.status===404) return '仓库不存在，或 Token 没有授权这个仓库';
  if(e.status===422) return '数据格式问题（Base64 或 JSON 不合法）';
  return e.message || '网络问题，稍后重试';
}

/* 把滑动胶囊对齐到当前选中的 Tab。
   ⚠️ 性能要点（v1.1.2 修残影/卡顿）：
     只对 transform 做过渡 —— width/height 是布局属性，每帧触发重排，
     iOS 上会掉帧并留下残影。所以：
       · 胶囊的宽高**只量一次**（首屏 + resize），之后取四个 tab 的并集尺寸，
         尺寸不再参与动画；
       · 每次切换只用 translate3d 移动，纯合成层操作。
   animate=false 时直接落位（首次 / 布局变化），不动画。 */
function syncNavPill(animate){
  var outer = document.querySelector('nav.tabbar');
  if(!outer) return;
  var pill = outer.querySelector('.nav-pill');
  var on = outer.querySelector('.tab.on');
  if(!pill || !on) return;

  var tabs = outer.querySelectorAll('.tab');

  // ① 尺寸：取所有 tab 的并集（一次量准，之后不再改）
  var maxW = 0, maxH = 0;
  Array.prototype.forEach.call(tabs, function(t){
    if(t.offsetWidth > maxW) maxW = t.offsetWidth;
    if(t.offsetHeight > maxH) maxH = t.offsetHeight;
  });
  if(maxW > 0 && pill._w !== maxW){
    pill._w = maxW;
    pill.style.width = maxW + 'px';
  }
  if(maxH > 0 && pill._h !== maxH){
    pill._h = maxH;
    pill.style.height = maxH + 'px';
  }

  // ② 位置：只用 transform 位移，宽度比 tab 宽的那部分居中抵消
  var or = outer.getBoundingClientRect();
  var nr = on.getBoundingClientRect();
  var x = nr.left - or.left - outer.clientLeft + (nr.width - maxW) / 2;
  var y = nr.top - or.top - outer.clientTop + (nr.height - maxH) / 2;

  var first = pill.dataset.placed !== '1';
  if(first || !animate){
    pill.style.transition = 'none';
    pill.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
    void pill.offsetWidth;   // 强制回流后再恢复过渡，否则这次的 none 会被下一次覆盖
    pill.style.transition = '';
    pill.dataset.placed = '1';
    return;
  }
  pill.style.transform = 'translate3d(' + x + 'px,' + y + 'px,0)';
}

  $('catTopTag').textContent = arr.length>4 ? ('前 4 / 共 '+arr.length) : ('共 '+arr.length+' 类');
  var cl = $('catLines');
  if(!top.length){
    cl.innerHTML = '<div class="t" style="font-weight:700;color:#5a5344;">本月还没有支出记录</div>';
  } else {
    cl.innerHTML = top.map(function(it){
      var pct = ex ? Math.round(it[1]/ex*100) : 0;
      var col = catColor(it[0]);
      return '<div class="cat-line">'
        + '<div class="cat-top"><span class="em">'+catIconSmall(it[0])+'</span><span>'+esc(it[0])+'</span>'
        +   '<span class="amt">¥'+num(it[1])+'</span><span class="pct">'+pct+'%</span></div>'
        + '<div class="cat-bar"><i style="width:'+pct+'%;background:'+col+';"></i><i class="rest"></i></div>'
        + '</div>';
    }).join('');
  }

  // 预算
  var bud = Number(S.budget)||0;
  if(bud>0){
    var pct2 = Math.min(999, Math.round(ex/bud*100));
    $('budHead').textContent = pct2+'% · 月预算 ¥'+num(bud);
    $('budFill').style.width = Math.min(100,pct2)+'%';
    $('budUsed').textContent = '已用 ¥'+num(ex);
    $('budLeft').textContent = '剩余 ¥'+num(bud-ex);
  } else {
    $('budHead').textContent = '未设置预算';
    $('budFill').style.width = '0%';
    $('budUsed').textContent = '已用 ¥'+num(ex);
    $('budLeft').textContent = '点下面设置';
  }

  // 近 6 个月
  var list=[], yy=y, mm=mo;
  for(var i=0;i<6;i++){ list.unshift(yy+'-'+pad(mm)); mm--; if(mm<1){ mm=12; yy--; } }
  var maxEx=0, sums={};
  list.forEach(function(m){
    var s2 = monthSum(m); sums[m]=s2;
    if(s2.ex>maxEx) maxEx=s2.ex;
  });
  var mb = $('mbars');
  mb.innerHTML = list.map(function(m){
    var s2 = sums[m];
    var h = (s2.ex && maxEx) ? Math.max(6, Math.round(s2.ex/maxEx*100)) : 3;
    return '<div class="mcol'+(m===ym?' on':'')+'" data-ym="'+m+'">'
      + '<span class="v">'+(s2.ex?moneyShort(s2.ex):'')+'</span>'
      + '<span class="b" style="height:'+h+'px;"></span>'
      + '<span class="l">'+Number(m.slice(5,7))+'月</span></div>';
  }).join('');
  Array.prototype.forEach.call(mb.querySelectorAll('.mcol'), function(el){
    el.addEventListener('click', function(){ statYm = el.getAttribute('data-ym'); renderStats(); });
  });

  // 每日支出
  var dayCount = new Date(y, mo, 0).getDate();
  var daily=[]; for(var k=0;k<dayCount;k++) daily.push(0);
  var maxD=0;
  for(var id2 in S.records){
    var r2 = S.records[id2];
    if(!r2.ts || r2.type==='income') continue;
    if(ymdStr(r2.ts).slice(0,7)!==ym) continue;
    var dd = new Date(r2.ts).getDate()-1;
    daily[dd]+=r2.amount;
    if(daily[dd]>maxD) maxD=daily[dd];
  }
  $('trend').innerHTML = daily.map(function(v){
    var h = maxD ? Math.max(3, Math.round(v/maxD*70)) : 3;
    var cls = 'db'+(v?'':' zero')+((maxD&&v===maxD)?' max':'');
    return '<div class="'+cls+'" style="height:'+(v?h:2)+'px;" title="'+(v?money(v):'无支出')+'"></div>';
  }).join('');
  $('trendMax').textContent = maxD ? '最高 ¥'+num(maxD) : '—';
  $('trendR').textContent = dayCount+' 日';
}

/* ================= 自然语言记账 ================= */
function parseChat(text){
  var s = String(text||'').trim();
  if(!s) return null;
  // 金额：15块 / 15元 / ¥15 / 15.5
  var amt = 0;
  var m = s.match(/([0-9]+(?:\.[0-9]{1,2})?)\s*(?:块|元|钱|rmb|￥|¥)?/i);
  if(m) amt = parseFloat(m[1])||0;
  if(!amt){
    var m2 = s.match(/[¥￥]\s*([0-9]+(?:\.[0-9]{1,2})?)/);
    if(m2) amt = parseFloat(m2[1])||0;
  }
  if(!amt) return null;
  // 收支方向
  var isIncome = /(收入|收到|赚|发了|报销|退款|退了|进账|工资|奖金)/.test(s);
  // 分类：用词典匹配
  var hit = autoCat(s, isIncome?'income':'expense');
  if(!hit) hit = isIncome?'其他收入':'其他';
  // 备注：去掉金额部分
  var note = s.replace(/[¥￥]?\s*[0-9]+(?:\.[0-9]{1,2})?\s*(?:块|元|钱|rmb)?/i,'')
              .replace(/^(今天|昨天|刚刚|刚才|我|了)/,'')
              .replace(/(花了|花|用了|用|付了|付|消费|买|记一笔|记账)/g,'')
              .trim();
  return { amount:amt, type:isIncome?'income':'expense', category:hit, note:note };
}
var chatType = 'expense';   // 对话页的支出/收入开关
function setChatType(t){
  chatType = t;
  $('btnQuickEx').className = 'cbtn' + (t==='expense' ? ' on-ex' : '');
  $('btnQuickIn').className = 'cbtn' + (t==='income' ? ' on-in' : '');
  $('chatInput').placeholder = t==='income'
    ? '记一笔收入… 例如「收到红包 100」'
    : '记一笔… 例如「今天午饭花了15块」';
}
function sendChat(){
  var inp = $('chatInput');
  var txt = String(inp.value||'').trim();
  if(!txt){ toast('说点什么…'); return; }
  var p = parseChat(txt);
  if(!p){ toast('没识别出金额，试试「午饭 15」'); return; }
  // 输入框里明确说了方向就听文本的，否则用当前开关
  var explicit = /(收入|收到|赚|发了|报销|退款|退了|进账|工资|奖金)/.test(txt);
  if(!explicit) p.type = chatType;
  // 如果分类和方向不匹配，按方向重判
  var list = (p.type==='income') ? incomeCats() : expenseCats();
  if(!list.some(function(c){ return c.name===p.category; })){
    p.category = autoCat(txt, p.type) || (p.type==='income' ? '其他收入' : '其他');
  }
  var d = new Date();
  var rec = {
    id:newId(), type:p.type, amount:p.amount, category:p.category,
    note:p.note, account:'微信支付',
    time: d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())+' '+pad(d.getHours())+':'+pad(d.getMinutes()),
    src:'web'
  };
  rec.ts = parseTs(rec.time);
  S.records[rec.id] = rec;
  S.pending[rec.id] = true;
  persist();
  inp.value = '';
  toast('已记账：'+rec.category+' ¥'+num(rec.amount));
  renderChat();
  if(isCfgOk() && navigator.onLine) sync(false);
}

/* 检查更新：清掉 SW 与缓存后重载，确保拿到线上最新版本 */
function checkUpdate(){
  toast('检查更新中…');
  var reloaded = false;
  function reload(){ if(reloaded) return; reloaded = true; location.reload(); }
  setTimeout(reload, 2500);   // 兜底：2.5 秒后无论如何都重载

  function clearCaches(){
    if(typeof caches === 'undefined' || !caches.keys) return Promise.resolve();
    return caches.keys().then(function(keys){
      /* 只清自己的缓存：本应用可能与另一个应用同域（部署在同一站点的子目录），
         无差别清空会把邻居的离线副本一起删掉 */
      return Promise.all(keys
        .filter(function(k){ return k.indexOf('xiongji-')===0; })
        .map(function(k){ return caches.delete(k); }));
    }).catch(function(){});
  }
  function updateSW(){
    if(!('serviceWorker' in navigator) || !navigator.serviceWorker.getRegistrations) return Promise.resolve();
    return navigator.serviceWorker.getRegistrations().then(function(rs){
      /* 同理：只更新本应用作用域内的 SW，别去动同一站点里另一个应用的 */
      var mine = rs.filter(function(r){
        try{ return r.scope && r.scope.indexOf('/xiongji/')>=0; }catch(e){ return false; }
      });
      return Promise.all(mine.map(function(r){
        try{ if(r.waiting && r.waiting.postMessage) r.waiting.postMessage('skipWaiting'); }catch(e){}
        return r.update ? r.update().catch(function(){}) : null;
      }));
    }).catch(function(){});
  }
  Promise.all([clearCaches(), updateSW()]).then(reload).catch(reload);
}

/* ================= 弹簧按压回弹（Spring Press）=================
   规格：references/button-feedback.md 第 1 条。
   按下与松手用两组不同参数 —— 按住是「跟手到位」（过阻尼，几乎不过冲），
   松手才是「回弹」（欠阻尼）。这是最容易做错的地方，别用同一组参数。
   用同一个弹簧值同时驱动 scale 与暗色遮罩，两者不会脱节。 */
var SPRING = {
  downK: 470, downD: 27,   // ζ≈0.62：快、几乎不回弹
  upK:   380, upD:   12,   // ζ≈0.31：软、带回弹
  to: 0.93                 // 按下时缩到 93%
};
function attachSpring(el, opts){
  if(!el || el.dataset.spring === '1') return;
  el.dataset.spring = '1';
  el.classList.add('spring');
  var o = opts || {};
  var to = (typeof o.scale === 'number') ? o.scale : SPRING.to;

  var cur = 1, vel = 0, raf = 0, pressed = false, last = 0;
  var shade = el.querySelector(':scope > .spring-shade');
  if(!shade){
    shade = document.createElement('span');
    shade.className = 'spring-shade';
    shade.style.cssText = 'position:absolute;inset:0;border-radius:inherit;background:#000;opacity:0;pointer-events:none;';
    if(getComputedStyle(el).position === 'static') el.style.position = 'relative';
    el.appendChild(shade);
  }

  function stop(){ if(raf){ cancelAnimationFrame(raf); raf = 0; } }
  function tick(ts){
    raf = 0;
    if(!last) last = ts;
    var dt = Math.min((ts - last) / 1000, 0.032);   // 夹住大跳帧，避免弹簧数值爆炸
    last = ts;
    var k = pressed ? SPRING.downK : SPRING.upK;
    var d = pressed ? SPRING.downD : SPRING.upD;
    var target = pressed ? to : 1;

    var a = -k * (cur - target) - d * vel;
    vel += a * dt;
    cur += vel * dt;

    // 只在值真的变化时写样式（每帧盲写会让浏览器反复失效样式）
    var v = Math.round(cur * 1000) / 1000;
    if(el._springV !== v){
      el._springV = v;
      el.style.transform = 'scale(' + v + ')';
      // 遮罩跟着同一个弹簧值走：按下时最多 12% 暗色
      var sh = v < 1 ? Math.min(0.12, (1 - v) / (1 - to) * 0.12) : Math.max(0, 0.12 - (v - 1) * 4.8);
      shade.style.opacity = sh.toFixed(3);
    }

    var settled = Math.abs(cur - target) < 0.0006 && Math.abs(vel) < 0.006;
    if(settled){
      cur = target; vel = 0; last = 0;
      el._springV = cur;
      // 落定后把 transform 整个撤掉（回到 1 时不写缩放），并撤掉图层提升 ——
      // 否则几十个按钮各留一个合成层，iOS 上会掉帧、长按还会留残影
      if(pressed){
        el.style.transform = 'scale(' + to + ')';
        shade.style.opacity = '0.12';
        el.classList.add('pressing');
      } else {
        el.style.transform = '';
        el._springV = 0;
        shade.style.opacity = '0';
        el.classList.remove('pressing');
      }
      return;
    }
    raf = requestAnimationFrame(tick);
  }
  function start(p, v){
    stop(); pressed = p; cur = v; vel = 0; last = 0;
    // 图层提升只在动画期间加
    el.classList.add('pressing');
    raf = requestAnimationFrame(tick);
  }
  function down(e){
    if(o.disabled && o.disabled()) return;
    start(true, 1);
  }
  function up(){
    if(!pressed) return;
    start(false, cur);
  }

  el.addEventListener('pointerdown', down);
  el.addEventListener('pointerup', up);
  el.addEventListener('pointercancel', up);
  el.addEventListener('pointerleave', up);
  el.addEventListener('blur', up);
  // 键盘触发（Space/Enter）没有坐标，也要当作按下/松手
  el.addEventListener('keydown', function(e){
    if(e.key === ' ' || e.key === 'Enter') down(e);
  });
  el.addEventListener('keyup', function(e){
    if(e.key === ' ' || e.key === 'Enter') up();
  });
}
function attachSpringAll(root){
  var scope = root || document;
  Array.prototype.forEach.call(
    scope.querySelectorAll('button, .tab, .feat, .chat-card, .dp-cell, .cbtn, .btn'),
    function(el){
      if(el.id === 'dateBtn') return;         // 日期按钮自己按（要当形变源）
      attachSpring(el);
    }
  );
}
function springOff(){
  return window.matchMedia && window.matchMedia('(prefers-reduced-motion:reduce)').matches;
}

/* ================= 记录卡片堆叠滚动（Stacked Card Scroll）=================
   规格：references/interaction-patterns.md 第 9 条。
   一切由真实 scrollTop 计算 → 天然可逆，不需要任何「进度状态变量」。
   缩放/透明度都有下限（0.9 / 0.65），否则文字小到不可读、内容提前消失。 */
var stackRaf = 0;
function initStackScroll(){
  var feed = $('chatFeed');
  if(!feed) return;
  if(feed._stackBound) return;
  feed._stackBound = true;
  // 必须 passive:true，滚动时不能让浏览器等我们
  feed.addEventListener('scroll', function(){
    if(stackRaf) return;
    stackRaf = requestAnimationFrame(function(){ stackRaf = 0; updateStack(); });
  }, { passive:true });
}
function updateStack(){
  var feed = $('chatFeed');
  if(!feed) return;
  var cards = Array.prototype.slice.call(feed.querySelectorAll('.stack-card'));
  if(cards.length < 2) return;
  var noMotion = springOff();
  var st = feed.scrollTop;
  var H = cards[0].offsetHeight || 1;
  var STICK = 12;      // 吸顶线：第一张卡贴顶的位置（与内联 top 阶梯首值一致）

  for(var i=0;i<cards.length;i++){
    var c = cards[i];
    var top = parseFloat(c.style.top) || STICK;
    // p = 这张卡「被顶住」的进度 0..1
    var p = (st - (c.offsetTop - STICK) + (STICK - top)) / H;
    if(p < 0) p = 0;
    if(p > 1) p = 1;
    if(noMotion){
      c.style.transform = '';
      c.style.opacity = '';
      c.style.zIndex = '';
      continue;
    }
    var sc = 1 - 0.10 * p;                       // 缩放下限 0.9
    var ey = -6 * p;                             // 轻微上移，给「被压住」一点空间线索
    var op = 1 - 0.35 * p;                       // 透明度下限 0.65
    c.style.transform = 'translate3d(0,' + ey.toFixed(2) + 'px,0) scale(' + sc.toFixed(3) + ')';
    c.style.opacity = op.toFixed(3);
    c.style.zIndex = String(1000 - i * 10 - Math.round(p * 5));
  }
}
/* 给卡片铺吸顶阶梯 + 统一高度，并补一个尾部留白 */
function prepareStack(){
  var feed = $('chatFeed');
  if(!feed) return;
  var cards = Array.prototype.slice.call(feed.querySelectorAll('.stack-card'));
  if(!cards.length) return;
  var STICK = 12;
  // 每张都吸在同一条线上，靠 scale 递减体现层次（参考文档里实测通过的版本）
  cards.forEach(function(c){ c.style.top = STICK + 'px'; });
  updateStack();
}

/* ================= 日期按钮 + 月份选择（Trigger Morph）=================
   规格：references/shape-and-text-motion.md 第 8 条「从按钮形变展开」。
   要点：起点必须等于被点按钮的真实矩形（getBoundingClientRect 实时量，不硬编码）；
   圆角与尺寸一起插值（胶囊 999px → 面板圆角）；内容延迟淡入（约 60% 才开始显示），
   否则文字会被拉伸变形；关闭时原路收回，不滑出屏幕。 */
var dpYm = null;          // 面板当前显示的年月（null = 跟随当前页面）
var dpAnim = null;

function updateDateLabel(){
  var el = $('dateLabel');

}

  return d.getFullYear() + '-' + pad(d.getMonth()+1);
}
function openDatePanel(){
  var btn = $('dateBtn'), panel = $('dpPanel'), mask = $('dpMask'), inner = $('dpInner');
  if(!btn || !panel || dpAnim) return;

  var activeYm = (curPage==='stats') ? statYm : (curPage==='list' ? listYm : curMonthYm());
  dpYm = activeYm;
  renderDpGrid();

  var r = btn.getBoundingClientRect();
  var pad = 12;
  var endW = Math.min(window.innerWidth - pad*2, 340);
  var endH = 300;
  var endX = (window.innerWidth - endW) / 2;
  // 面板贴着按钮往下长
  var endY = r.bottom + 8;
  if(endY + endH > window.innerHeight - 20) endY = Math.max(pad, window.innerHeight - 20 - endH);

  panel.classList.add('show');
  panel.style.display = 'block';
  panel.style.left = endX + 'px';
  panel.style.top = endY + 'px';
  panel.style.width = endW + 'px';
  panel.style.height = endH + 'px';

  mask.classList.add('show');

  // 从按钮的真实矩形 → 面板矩形；圆角同步插值
  var fromR = '999px';
  var toR = '24px';
  var anim = panel.animate([
    { left:r.left + 'px', top:r.top + 'px', width:r.width + 'px', height:r.height + 'px',
      borderRadius:fromR, easing:'cubic-bezier(.22,.9,.24,1)' },
    { left:endX + 'px', top:endY + 'px', width:endW + 'px', height:endH + 'px',
      borderRadius:toR }
  ], { duration: 620, fill: 'both', easing: 'cubic-bezier(.22,.9,.24,1)' });

  // 内容延迟淡入：长到约 60% 才出现，避免文字被拉伸
  inner.animate([
    { opacity:0, offset:0 },
    { opacity:0, offset:.62 },
    { opacity:1, offset:1 }
  ], { duration: 620, fill: 'both' });

  dpAnim = anim;
  anim.onfinish = function(){ dpAnim = null; };
}
function closeDatePanel(){
  var panel = $('dpPanel'), mask = $('dpMask'), inner = $('dpInner'), btn = $('dateBtn');
  if(!panel || !panel.classList.contains('show')) return;
  var r = btn.getBoundingClientRect();
  try{
    inner.animate([{opacity:1},{opacity:0}], {duration:220, fill:'both'});
    panel.animate([
      { left:panel.style.left, top:panel.style.top, width:panel.style.width, height:panel.style.height, borderRadius:'24px' },
      { left:r.left+'px', top:r.top+'px', width:r.width+'px', height:r.height+'px', borderRadius:'999px' }
    ], { duration:420, fill:'both', easing:'cubic-bezier(.4,0,.7,.3)' }).onfinish = function(){
      panel.classList.remove('show');
      panel.style.display = 'none';
      mask.classList.remove('show');
      dpAnim = null;
    };
  }catch(e){
    panel.classList.remove('show');
    panel.style.display = 'none';
    mask.classList.remove('show');
    dpAnim = null;
  }
}
function renderDpGrid(){
  var grid = $('dpGrid'), yearEl = $('dpYear');
  if(!grid) return;
  var y = Number((dpYm||curMonthYm()).slice(0,4));
  yearEl.textContent = y + ' 年';
  var activeYm = (curPage==='stats') ? statYm : (curPage==='list' ? listYm : curMonthYm());
  var nowYm = curMonthYm();
  var html = '';
  for(var m=1;m<=12;m++){
    var ym = y + '-' + pad(m);
    var cls = 'dp-cell' + (ym===activeYm ? ' on' : '') + (ym>nowYm ? ' future' : '');
    html += '<button class="'+cls+'" data-ym="'+ym+'">'+m+' 月</button>';
  }
  grid.innerHTML = html;
  Array.prototype.forEach.call(grid.querySelectorAll('.dp-cell'), function(b){
    attachSpring(b);
    b.addEventListener('click', function(){
      var ym = b.getAttribute('data-ym');
      if(curPage==='stats'){ statYm = ym; }
      else if(curPage==='list'){ listYm = ym; }
      else { listYm = ym; }
      updateDateLabel();
      renderAll();
      closeDatePanel();
    });
  });
}
function shiftYear(delta){
  var y = Number((dpYm||curMonthYm()).slice(0,4)) + delta;
  dpYm = y + '-01';
  renderDpGrid();
}

function bindDayPicker(){
  var btn = $('dateBtn'), mask = $('dpMask');
  if(!btn) return;
  attachSpring(btn, { scale:0.94 });
  btn.addEventListener('click', function(){
    var p = $('dpPanel');
    if(p && p.classList.contains('show')) closeDatePanel();
    else openDatePanel();
  });
  mask.addEventListener('click', closeDatePanel);
  $('dpPrevY').addEventListener('click', function(){ shiftYear(-1); });
  $('dpNextY').addEventListener('click', function(){ shiftYear(1); });
  $('dpToday').addEventListener('click', function(){
    var ym = curMonthYm();
    if(curPage==='stats') statYm = ym; else listYm = ym;
    updateDateLabel();
    renderAll();
    closeDatePanel();
  });
}

function bind(){
  Array.prototype.forEach.call(document.querySelectorAll('nav.tabbar .tab'), function(t){
    t.addEventListener('click', function(){ showPage(t.getAttribute('data-page')); });
  });
  Array.prototype.forEach.call(document.querySelectorAll('.feat'), function(f){
    f.addEventListener('click', function(){
      var a = f.getAttribute('data-act');
      if(a==='cats') openCats();
      else if(a==='sync') openSync();
      else if(a==='about') openAbout();
      else if(a==='export') exportJson();
      else if(a==='update') checkUpdate();
    });
  });
  // 月份切换改由顶栏日期按钮的展开面板负责（见 bindDayPicker）
  $('chatSend').onclick = sendChat;
  $('chatInput').onkeydown = function(e){ if(e.key==='Enter'){ e.preventDefault(); sendChat(); } };
  $('btnQuickEx').onclick = function(){ setChatType('expense'); };
  $('btnQuickIn').onclick = function(){ setChatType('income'); };
  $('btnSetBudget').onclick = openBudget;
  // 顶栏日期按钮 + 月份面板
  bindDayPicker();
  // 全站按钮挂弹簧按压回弹（之后动态生成的按钮各自在渲染时挂）
  attachSpringAll(document);
  window.addEventListener('resize', function(){ updateStack(); });
  window.addEventListener('orientationchange', function(){ setTimeout(updateStack, 160); });
  $('mask').addEventListener('click', function(e){ if(e.target===$('mask')) closeSheet(); });
  window.addEventListener('online', function(){ sync(false); });
  document.addEventListener('visibilitychange', function(){
    if(!document.hidden){
      if(S.cfg.auto) sync(false);
      // 应用从后台回到前台时顺手检查一次新版本（iOS 主屏幕 App 很少自动更新 SW）
      autoCheckUpdate();
    }
  });
}
function exportJson(){
  var out = { app:'lazy-ledger', version:3, exported_at:new Date().toISOString(), budget:S.budget, records:[] };
  for(var id in S.records) out.records.push(S.records[id]);
  var blob = new Blob([JSON.stringify(out,null,2)], { type:'application/json' });
  var a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'lazy-ledger-'+ymdStr(Date.now())+'.json';
  a.click();
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 3000);
  toast('已导出 '+out.records.length+' 笔');
}

/* ================= 启动 ================= */

/* 精确设置布局尺寸
   - --app-h：body 高度（= window.innerHeight，键盘弹出时用 visualViewport 兜底）
   - --tab-h：任务栏实际高度（用于给内容区留出底部空间）
   - standalone 判断：iOS 上 navigator.standalone 最准；CSS 的 display-mode 有些版本不认 */
function isStandalone(){
  try{
    if(window.navigator.standalone === true) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) return true;
    if(window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) return true;
  }catch(e){}
  return false;
}
function setAppHeight(){
  var h = window.innerHeight;
  if(!h) return;
  if(window.visualViewport && window.visualViewport.height){
    h = Math.max(h, Math.round(window.visualViewport.height));
  }
  var root = document.documentElement;
  root.style.setProperty('--app-h', h + 'px');
  // 独立 App 模式：底部不要再留 safe-area（可视区已含 Home Indicator 区），
  // 否则任务栏会被顶上去，看起来像"悬空一格"
  root.setAttribute('data-standalone', isStandalone() ? '1' : '0');
  var tb = document.querySelector('nav.tabbar');
  if(tb){
    // 先应用模式，再量高度，量到的才是最终值
    var th = Math.round(tb.getBoundingClientRect().height);
    if(th > 0) root.style.setProperty('--tab-h', th + 'px');
    // 底栏尺寸可能因模式/安全区变化，胶囊要重新量一遍才对得齐
    syncNavPill(false);
  }
}
setAppHeight();
window.addEventListener('resize', setAppHeight);
window.addEventListener('orientationchange', function(){
  setTimeout(setAppHeight, 120);
  setTimeout(setAppHeight, 400);
});
if(window.visualViewport && window.visualViewport.addEventListener){
  window.visualViewport.addEventListener('resize', setAppHeight);
}

load();
bind();
setChatType('expense');
showPage('chat');
renderAll();
setInterval(function(){
  if(S.cfg.auto && isCfgOk() && navigator.onLine && !document.hidden) sync(false);
}, 180000);
setTimeout(function(){ if(S.cfg.auto && isCfgOk()) sync(false); }, 900);

if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost' || location.hostname==='127.0.0.1')){
  window.addEventListener('load', function(){
    navigator.serviceWorker.register('./sw.js').catch(function(){});
    // 若线上已有更新版本，主动接管，避免一直停在旧版
    navigator.serviceWorker.ready.then(function(reg){
      if(reg && reg.update) reg.update().catch(function(){});
    }).catch(function(){});
  });
  // 页面被新 SW 接管时自动刷新一次（只在版本真的变了时发生）
  var refreshing = false;
  navigator.serviceWorker.addEventListener('controllerchange', function(){
    if(refreshing) return;
    refreshing = true;
    location.reload();
  });
}
})();
</script>
