<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1, user-scalable=no">
<meta name="format-detection" content="telephone=no">
<title>熊记</title>
<meta name="description" content="手账风记账 · 快捷指令自动记账 · 数据存自己的 GitHub 私有仓库 · 离线可用">
<!-- theme-color = 薄荷底色：iOS 独立 App 模式下屏幕顶部约 47pt 是状态栏区
     （网页渲染不进去），它的填色跟这里 / manifest 的 theme_color 走。
     页面顶部本来就是薄荷色（body::before 铺的），同色才不会在状态栏下露一条异色带。
     ⚠️ 2026-10-15 之前这里是白色 —— 那是配合 black-translucent 的临时补丁
     （当时系统带在**底部**、设白是为了和白色 tab 栏连成一片）；换成 default 后
     系统带移到顶部、补丁的理由消失了，颜色跟着页面顶部走才对。 -->
<meta name="theme-color" content="#B5DEE6">
<link rel="manifest" href="./manifest.json">
<link rel="icon" type="image/png" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
<link rel="stylesheet" href="./assets/fonts/notosans.css">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<!-- ⚠️ 必须是 default，不要改成 black-translucent。
     2026-10-14 真机实测：black-translucent 下 iOS 让网页铺到状态栏底下，
     但把**屏幕最底那 47px** 让出去 —— 视口底比屏幕底高 47px，底栏永远悬空。
     诊断数据：innerHeight 797 vs screen.height 844，差 47。
     （同一天懒人记账也是这个病，改成本值后用户确认修好。）
     注意：改这个 meta 必须**删掉主屏图标重新添加**才生效，iOS 会缓存。 -->
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="熊记">

<style>
/* ==========================================================================
   熊记 · 手账拼贴风（蓝粉双拼）
   ---------------------------------------------------------------------------
   配色（从参考图采样，改动请同步这里）：
     薄荷蓝底 #B5DEE6 + 白波点    米白纸 #FFFFFF    虚线描边 #9CCBD9
     主粉 #F58BA8   浅粉 #FFE3EA   深粉字 #D9557A   淡蓝底 #E8F6F8
   粉色深浅搭配：浅粉底配深粉字、深粉底配白字；收入走淡蓝做对照。

   ⚠️ 层级表（本文件所有 z-index 都在这里，别再散落各处）：
     10  内容 / 卡片
     40  底部任务栏
     60  月份面板遮罩   61  月份面板
     80  弹层遮罩       81  弹层
     90  二次确认层
     95  toast
   ⚠️ 内容区 main 的顶部内边距不能去掉：卡片上的胶带是 top:-11px 探出卡外的，
     而 main 是 overflow-y:auto，会把超出部分裁掉 —— 那样胶带就只剩半个三角。
   ========================================================================== */

:root{
  --page:#B5DEE6;         /* 页面底：薄荷蓝 */
  --paper:#FFFFFF;        /* 卡片纸 */
  --paper-soft:#FDFBF6;   /* 次级纸色 */
  --line:#9CCBD9;         /* 虚线描边 */
  --line-soft:#CFE8EF;    /* 浅描边 */
  --ink:#5A7C8C;          /* 正文 */
  --ink2:#8AA5B2;         /* 次要文字 */
  --ink3:#B3C7D0;         /* 更淡 */
  --pink:#F58BA8;         /* 主粉 */
  --pink-l:#FFE3EA;       /* 浅粉 */
  --pink-d:#D9557A;       /* 深粉（浅粉底上的字） */
  --blue-l:#E8F6F8;       /* 淡蓝底 */
  --blue-d:#7FB8CC;
  --sh:0 2px 0 rgba(150,196,212,.40);
  --sh-sm:0 2px 0 rgba(150,196,212,.30);
  --r-lg:18px;
  --r-md:15px;
  --r-sm:12px;
  --tabbar-h:64px;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}

/* 禁掉双指捏合缩放：加进主屏后还能捏小的话，露出的白边一眼看出是网页。
   viewport 的 user-scalable=no 在 iOS 上基本被忽略，真正管用的是下面这两条
   （见 JS 里的 lockZoom）。别在 touchend 里 preventDefault，会吃掉 click。 */
html,body{touch-action:pan-x pan-y; overscroll-behavior:none;}

/* 禁掉长按选中文字 / 长按弹出「拷贝·查询」气泡 / 长按元素被拎起来放大。
   这三样是 Safari 的行为，出现在 App 里就会「一看就是网页」。
   -webkit-touch-callout 管的正是那个气泡和"拎起来"的效果，缺它光禁 user-select 不够。
   注意：输入框必须单独开回来（见下面 input,textarea 那条），
   否则 token 输入框长按弹不出「粘贴」、记账输入框没法长按改字。 */
html,body{
  -webkit-user-select:none;user-select:none;
  -webkit-touch-callout:none;
}

/* ⚠️ html 的底色跟页面顶部保持一致（薄荷）。iOS 独立 App 模式下屏幕最顶约 47pt
   是状态栏区（网页渲染不进去），**系统画那条带的取色来源之一就是 html 的底色**
   （另一个是 theme-color）。设成白色会在薄荷色页面顶上压出一条白带。
   页面真正的薄荷底 + 波点由下面的 body::before 铺满视口（见那条注释）。
   ⚠️ 2026-10-15 改成 status-bar-style=default 之后才有这条：此前系统带在**底部**、
   紧挨着白色 tab 栏，所以那时 html 底色必须是白色。带子挪到顶部后，颜色要跟着顶部走。 */
html{
  -webkit-text-size-adjust:100%; overflow-anchor:none;
  height:100%; overflow:hidden;
  background-color:var(--page);
}
body{
  /* ⚠️ 高度必须由 JS 写 --app-h，**不要改成 height:100% / 100vh / 100dvh**。
     2026-10-14 实测教训：把这里换成纯 CSS 之后，用户反馈"底栏又悬空了"——
     也就是退回了 100vh 那条路。iOS 独立 App 下 100vh 偏小，
     body 跟着偏矮，底部就漏出一条。
     setAppHeight() 里读 window.innerHeight（并用 visualViewport 兜底）写进来的值，
     才是和真实可视区对齐的那个高度。 */
  height:100%;
  height:var(--app-h,100%);
  margin:0; color:var(--ink);
  background:transparent;
  /* 思源黑体 Black（Noto Sans SC 900）本地打包，离线可用；后面是系统兜底。
     ⚠️ 这套字体只打包了 900 一档（用户选的「圆润粗体」效果就靠它）。
        所以 body/button/input 的字重都钉在 900 —— 不写的话浏览器会拿 400
        去匹配，900 那档就白打包了，字会显得又细又不像选的样子。 */
  font-family:'Noto Sans SC','PingFang SC','Hiragino Sans GB','Microsoft YaHei',-apple-system,sans-serif;
  line-height:1.45;
  font-weight:900;
  display:flex; flex-direction:column;
  overflow:hidden;
}
/* 金额 / 统计数字：等宽对齐 + 紧字距（与原版熊记同一组选择器与取值） */
.num,.hero-amt,.sum-amt,.st-amt,.row-amt,.cell-v,.split-v,.mcol-v,.cat-amt,.bud-foot{
  font-variant-numeric:tabular-nums;
  letter-spacing:-1px;
}
/* 薄荷底 + 白波点：固定铺满视口，垫在所有内容之下。
   （html 的底色也是薄荷，见上面那条注释 —— 两层同色，状态栏区就不露异色带。） */
body::before{
  content:''; position:fixed; inset:0; z-index:0; pointer-events:none;
  background-color:var(--page);
  background-image:radial-gradient(#FFFFFF 2.2px, transparent 2.5px);
  background-size:14px 14px;
}
/* 底部不需要再做渐隐：视口最底部本来就被 tab 栏盖住。
   2026-10-15 之前这里写的是「视口底部约 47pt 是 iOS 窗口背景区、由系统填白」——
   那是 black-translucent 时代的事；改成 default 后系统带移到**顶部**（状态栏区），
   底部不再有那条带。 */

/* 按钮 / 输入框的字重也要跟着钉到 900：控件不继承 body 的字重，
   浏览器的 UA 默认值会把它们按 400 渲染，那 900 那档就白打包了。 */
button{font-family:inherit; font-weight:900; color:var(--ink); cursor:pointer; border:none; background:none; padding:0;}
input,select,textarea{font-family:inherit; font-weight:900; color:var(--ink);}
/* 输入框例外：上面全局禁了长按选中，这里必须把输入类元素开回来，
   否则 Token 输入框长按弹不出「粘贴」、记账输入框没法长按改字。
   (-webkit-user-select 是给旧版 iOS Safari 的) */
input,textarea,select,[contenteditable]{
  -webkit-user-select:text; user-select:text;
  -webkit-touch-callout:default;
}
input:focus,select:focus,textarea:focus{outline:none;}

/* 标题 / 加粗标签：本地只打包了 900 一档，
   让它们也用 900，避免浏览器拿 700 去合成加粗（那样字形会发虚）。 */
b,strong,h1,h2,h3,h4,h5,h6{font-weight:900;}

/* ---------- 顶栏 ---------- */
header{
  position:relative; z-index:30; flex:none;
  padding:calc(10px + env(safe-area-inset-top)) 12px 6px;
  display:flex; align-items:center; gap:8px;
}
.date-chip{
  display:flex; align-items:center; gap:8px; flex:none;
  background:var(--paper); border:1.5px dashed var(--line); border-radius:999px;
  box-shadow:var(--sh-sm);
  padding:8px 16px 8px 12px; font-size:15px; letter-spacing:.5px;
}
.date-chip .sticker{width:24px; height:24px; flex:none; transform:rotate(-10deg);}
.date-chip .sticker img{width:100%; height:100%; object-fit:contain;}
.date-chip .caret{
  width:0; height:0; flex:none;
  border-left:5px solid transparent; border-right:5px solid transparent;
  border-top:6px solid var(--ink2);
}
.head-right{margin-left:auto; display:flex; align-items:center; gap:6px;}
.chip{
  background:var(--paper); border:1.5px dashed var(--line); border-radius:999px;
  box-shadow:var(--sh-sm);
  padding:6px 13px; font-size:12.5px; color:var(--ink2); white-space:nowrap;
}
.chip.pink{color:var(--pink-d); background:var(--pink-l); border-color:rgba(245,139,168,.5);}
.nav-btn{
  width:32px; height:32px; flex:none; border-radius:50%;
  background:var(--paper); border:1.5px dashed var(--line); box-shadow:var(--sh-sm);
  font-size:16px; display:flex; align-items:center; justify-content:center;
}
.nav-btn:active{transform:scale(.94);}
.ym-label{font-size:14px; padding:0 2px; white-space:nowrap;}

/* ---------- 内容区 ----------
   ⚠️ 顶部内边距是给「探出卡片外的装饰」留的空间，别改小。
   两处探出量（实测值，改尺寸或角度要重算）：
     · 胶带 58×21 旋转 -38° → 旋转后的绘制框比布局盒高 15.6px，
       加上 top:-11px，实际探出卡外 **26.6px**（不是 11px）
     · 统计卡的熊 top:-52px → 探出 **52px**
   本容器 overflow-y:auto 会把超出的部分直接裁掉（熊头被切掉就是这个原因）。 */
main{
  position:relative; z-index:10; flex:1 1 auto; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  max-width:660px; width:100%; margin:0 auto;
  padding:30px 12px 12px;
}
main::-webkit-scrollbar{width:0;}
.page{display:none;}
.page.active{display:block;}

/* 记录页要三段固定（主卡 / 输入区 / 卡片流），单独用绝对定位铺满，
   高度由 inset 决定，不依赖 100vh（iOS 独立 App 下 100vh 会偏小）。
   ⚠️ top 必须是 0：本元素的包含块是 main 的 padding box，
   而 main 本来就在页头下方了。之前写 top:calc(--head-h + 8px) 等于
   把页头高度又加了一遍，卡片上方凭空多出 60px 空白。
   ⚠️ 也不能有 overflow:hidden —— 主卡的熊 top:-56px、胶带探出 26.6px，
   这一层一裁，熊的头和胶带就没了（.feed 自己会滚，不需要这层再裁）。 */
#page-record.active{
  position:absolute; z-index:10;
  top:0; left:12px; right:12px;
  bottom:calc(var(--tab-h,64px) + 8px);
  display:flex; flex-direction:column;
  padding:0; max-width:none; margin:0;
}
/* 主卡上方留出熊和胶带探出的空间（熊 56px）。
   60px = 56（熊）+ 4（和页头之间的呼吸） */
#page-record .hero{flex:none; margin-top:60px;}
#page-record .composer{flex:none;}
/* feed 是独立滚动容器（overflow-y:auto），卡片上探出卡外的胶带会被它裁掉，
   所以顶部要留 ≥27px；左右留 9px（胶带横向探出 7.3px）。
   用负外边距抵掉内边距，卡片宽度和位置不变。 */
#page-record .feed{
  flex:1 1 auto; min-height:0; overflow-y:auto; -webkit-overflow-scrolling:touch;
  padding:30px 9px 4px;
  margin:-30px -9px 0;
}
#page-record .feed::-webkit-scrollbar{width:0;}
/* 其余页面给底部任务栏留出空间 */
#page-ledger.active,#page-stats.active,#page-me.active{
  padding-bottom:calc(var(--tab-h,64px) + 14px);
}

/* ---------- 手账纸卡 ---------- */
.card{
  position:relative;
  background:var(--paper);
  border:1.5px dashed var(--line);
  border-radius:var(--r-lg);
  box-shadow:var(--sh);
}
.card.solid{border-style:solid; border-color:var(--line-soft);}

/* 胶带：横跨卡片左上角 —— 一半压在卡片上、一半探到卡片外。
   粉色要够深才在白卡上读得出来（浅粉会和白卡同色而"隐形"）。 */
.tape{
  position:absolute; left:-8px; top:-11px; width:58px; height:21px;
  border-radius:2px;
  background:linear-gradient(135deg,#FDDCE6 0%,#FAC9D8 52%,#F7BCCE 100%);
  border:1px solid rgba(240,163,186,.75);
  transform:rotate(-38deg);
  box-shadow:0 2px 4px rgba(120,175,195,.30);
  pointer-events:none; z-index:2;
}
.tape.tr{left:auto; right:-8px; transform:rotate(38deg);}
.tape.blue{
  background:linear-gradient(135deg,#E2F3F9 0%,#CBE7F0 52%,#BCDFEA 100%);
  border-color:rgba(146,196,213,.8);
}
/* 卡片右上角的星星贴纸（那个位置坐着头像熊，放胶带会压到它） */
.corner-star{
  position:absolute; right:9px; top:7px; width:28px; height:28px; z-index:2;
  transform:rotate(10deg); pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(150,196,212,.35));
}

/* ---------- 记录页 ---------- */
.hero{padding:15px 16px 13px; margin:0 0 12px;}
.hero .hero-head{display:flex; align-items:center; gap:8px;}
.hero .hero-head .lb{font-size:13px; color:var(--ink2);}
.tag-pink{
  display:inline-block; font-size:11px; padding:2px 10px; border-radius:999px;
  background:var(--pink-l); color:var(--pink-d); border:1px solid rgba(245,139,168,.5);
}
.tag-blue{
  display:inline-block; font-size:11px; padding:2px 10px; border-radius:999px;
  background:var(--blue-l); color:var(--ink2); border:1px solid var(--line);
}
.hero-amt{font-size:42px; line-height:1.08; margin:2px 0 0; color:var(--pink);}
.hero-amt small{font-size:22px; opacity:.7;}
.hero-rule{border-top:1.5px dashed var(--line-soft); margin:11px 0 9px;}
.split{display:flex;}
.split > div{flex:1; text-align:center;}
.split > div + div{border-left:1.5px dashed var(--line-soft);}
.split .k{font-size:11.5px; color:var(--ink3);}
.split-v{font-size:16px; margin-top:2px;}
.hero-bear{
  position:absolute; right:4px; top:-56px; width:132px; height:104px;
  background:url('./assets/bear/hero-cash.png') no-repeat center/contain;
  pointer-events:none;
}

.composer{padding:12px; margin:0 0 12px;}
.composer .types{display:flex; gap:9px; margin-bottom:10px;}
/* 支出/收入切换：位置靠底层滑块（.type-pill）平移，不用 CSS transition —— 由弹簧
   内核每帧写 transform，和按压缩放走同一个值，两者才不会脱节。
   按压反馈：按下 k=470/d=27（过阻尼，按住不晃）→ 松手 k=380/d=12（欠阻尼回弹）。 */
.type-btn{
  flex:1; padding:10px 0; border-radius:999px; font-size:14.5px;
  background:transparent; color:var(--ink2);
  border:1.5px solid transparent;
  position:relative; z-index:1;
  transform-origin:50% 50%;
  will-change:transform;
}
.type-btn:active{transform:none;}   /* 交给 JS 弹簧，别和 :active 的 CSS 变换打架 */
/* 浅粉底配深粉字（支出＝主动作）；收入走淡蓝 */
.type-btn.on-ex{color:var(--pink-d);}
.type-btn.on-in{color:var(--blue-d);}
/* 跟随滑块：粉色/蓝色底 + 描边都在这里，跨按钮平移。
   ⚠️ 宽度必须由 JS 量按钮 rect 后写入；CSS 里不给 width，
      否则 flex 会把初始的 0 宽滑块拉到整行宽（看起来像一条通栏的线）。
   JS 未就绪时先靠 visibility 藏住，避免首帧闪一条错位的色带。 */
.type-pill{
  position:absolute; left:0; top:0; z-index:0;
  width:0; height:0; visibility:hidden;
  border-radius:999px; pointer-events:none;
  background:var(--pink-l); border:1.5px solid #FBC4D4;
  will-change:transform;
  /* 位置和宽度走同一条过渡，两者天然同步（不会一个先到一个后到）。
     缓动与形变展开同一条曲线，手感一致。
     ⚠️ 别改用 rAF 弹簧：滑块是「滑到某个位置」的定位行为，
        一旦 rAF 被节流（后台标签/被遮挡窗口）就会卡在半路。 */
  transition:transform .34s cubic-bezier(.22,.9,.24,1),
             width .34s cubic-bezier(.22,.9,.24,1),
             background-color .2s ease, border-color .2s ease;
}
.type-pill.ready{visibility:visible;}
.type-pill.noanim{transition:none;}   /* 初始定位 / 尺寸变化时不动画 */
.type-pill.income{background:var(--blue-l); border-color:var(--blue-d);}
.types{position:relative;}
.input-row{display:flex; gap:9px; align-items:stretch;}
.input-row input{
  flex:1; min-width:0; padding:13px 16px; font-size:15px;
  background:var(--paper); border:1.5px dashed var(--line); border-radius:999px;
  box-shadow:var(--sh-sm);
}
.input-row input::placeholder{color:var(--ink3);}
/* 深粉底配白箭头。按压反馈同 .type-btn：同一个弹簧内核驱动 */
.send{
  width:52px; flex:none; border-radius:50%; font-size:21px; color:#fff;
  background:var(--pink); border:1.5px solid var(--pink);
  box-shadow:0 2px 0 rgba(217,85,122,.35);
  display:flex; align-items:center; justify-content:center;
  transform-origin:50% 50%;
  will-change:transform;
}
.send:active{transform:none;}
.send:active{transform:scale(.94);}

.feed-head{display:flex; align-items:center; gap:8px; margin:0 2px 9px;}
.feed-head .t{font-size:13px; color:var(--ink2);}
.feed-head .ln{flex:1; border-top:1.5px dashed rgba(255,255,255,.75);}
.feed-head .n{font-size:13px; color:var(--ink2);}

.rec{
  display:flex; align-items:center; gap:11px;
  padding:12px 13px; margin-bottom:11px;
}
.rec-icon{
  width:46px; height:46px; flex:none; border-radius:13px;

/* ---------- 账本页 ---------- */
.sum{padding:14px 15px; margin-bottom:13px;}
.sum .top{display:flex; align-items:flex-end; justify-content:space-between; gap:10px;}
.sum .lb{font-size:13px; color:var(--ink2);}
.sum-amt{font-size:33px; line-height:1.1; color:var(--pink);}
.sum .right{text-align:right; font-size:12.5px; color:var(--ink2);}
.day-head{
  display:flex; align-items:baseline; justify-content:space-between;
  margin:13px 3px 8px; font-size:13.5px;
}
.day-head .sm{font-size:11.5px; color:var(--ink3);}
.entry{display:flex; align-items:center; gap:10px; padding:11px 12px; margin-bottom:9px;}
.entry .dot{

/* ---------- 统计页 ---------- */
/* 上方留出熊探出的 52px（.st-bear top:-52px）。
   ⚠️ 这里是 margin-top，会和 main 的 30px 顶部内边距叠加 ——
   所以填 26px，合计 56px = 52（熊）+ 4（呼吸）。别按 52 填。 */
.st-hero{padding:15px 16px; margin:26px 0 13px;}
.st-hero .lb{font-size:13px; color:var(--ink2);}
.st-amt{font-size:36px; line-height:1.1; color:var(--pink);}
.st-bear{
  position:absolute; right:6px; top:-52px; width:124px; height:96px;
  background:url('./assets/bear/hero-think.png') no-repeat center/contain;
  pointer-events:none;
}
.grid2{display:flex; gap:11px; margin-bottom:13px;}
.cell{flex:1; padding:12px 13px;}
.cell .k{font-size:11.5px; color:var(--ink3);}
.cell-v{font-size:19px; margin-top:2px;}
.cell-v.sm{font-size:15px;}
.sec{padding:13px 14px; margin-bottom:13px;}
.sec-head{display:flex; align-items:center; justify-content:space-between; margin-bottom:11px;}
.sec-head .t{font-size:14.5px;}
.cat-row{display:flex; align-items:center; gap:9px; margin-bottom:10px;}
.cat-row:last-child{margin-bottom:0;}
.cat-ico{

.cat-name{width:48px; flex:none; font-size:13px;}
.bar{flex:1; height:12px; border-radius:999px; background:var(--blue-l);

.bar i{display:block; height:100%; border-radius:999px;}
.cat-amt{width:56px; text-align:right; font-size:13px; flex:none;}

.budget-bar{height:16px; border-radius:999px; background:var(--blue-l);
  border:1px solid var(--line-soft); overflow:hidden;}
/* 预算条：浅粉→主粉渐变 */
.budget-bar i{display:block; height:100%; border-radius:999px;
  background:linear-gradient(90deg,#FBC4D4,#F58BA8);}
.bud-foot{display:flex; justify-content:space-between; font-size:12px; color:var(--ink2); margin-top:7px;}

.mbars{display:flex; align-items:flex-end; gap:9px; height:104px;}
.mcol{flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; height:100%; justify-content:flex-end;}
.mcol .bars{width:100%; flex:1; display:flex; align-items:flex-end; gap:3px;}

.mcol .bars i.e{background:var(--pink);}

/* ---------- 我的页 ---------- */

.me-avatar{

/* ---------- 底部任务栏 ----------
   ⚠️ 底部内边距不再按 safe-area 叠加：
   独立模式下可视区**已经包含** Home Indicator 那段，再补一次 safe-area 等于留两遍，
   底栏会浮起来约 34px（这就是"任务栏有点高"的来源）。
   与「待会吃什么 / 懒人记账 / 坚持 / 电子收纳」四处保持同一做法：写死 8px。

   ⚠️ 2026-10-15：真正让底栏贴底的是 <head> 里的 status-bar-style=default
   （black-translucent 会让视口底比屏幕底高 47px，改多少 CSS 都没用）。
   这里的内边距写死是另一件事 —— 两者都要对，底栏才既贴底又不浮起。 */
.tabbar{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--paper); border-top:1.5px dashed var(--line);
  border-radius:22px 22px 0 0;
  box-shadow:0 -3px 14px rgba(150,196,212,.20);
  padding:7px 10px 8px;
  display:flex; gap:6px;
}
.tab{
  flex:1; position:relative; z-index:1;
  padding:9px 0 8px; border-radius:999px;
  display:flex; flex-direction:column; align-items:center; gap:5px;
  font-size:12px; color:var(--ink3);
}
/* 图标 32px。加 max-width 兜底：个别贴纸是「两只熊并排」的宽图，
   只限高度的话会被拉得很宽，撑破 tab。 */
.tab img{height:32px; width:auto; max-width:72%; object-fit:contain; opacity:.42; filter:grayscale(.6);}
.tab.on{background:var(--pink-l); color:var(--pink-d);}
.tab.on img{opacity:1; filter:none;}
.tab-pill{
  position:absolute; left:0; top:0; z-index:0; border-radius:999px;
  background:var(--pink-l); pointer-events:none;
  transform:translate3d(0,0,0);
  transition:transform .3s cubic-bezier(.22,.9,.24,1);
}
@media(prefers-reduced-motion:reduce){ .tab-pill{transition:none} }

/* ---------- 月份选择面板 ---------- */
#dpMask{

}

}

.dp-yb{

}

  background:var(--blue-l); border:1.3px dashed var(--line-soft); color:var(--ink);
}

.dp-cell.on{background:var(--pink-l); color:var(--pink-d); border-color:#FBC4D4;}
.dp-today{width:100%; margin-top:14px; padding:12px 0; border-radius:999px; font-size:15px;
  background:var(--pink-l); color:var(--pink-d); border:1.5px solid #FBC4D4; box-shadow:var(--sh-sm);}

/* ---------- 弹层（记一笔 / 编辑） ----------
   ⚠️ 分两层：#sheet 只负责外观（不滚动），胶带/星星挂在它身上；
   真正滚动的是内层 #sheetScroll。装饰若挂在滚动容器上，探出的部分会被裁掉。 */
#mask{
  position:fixed; inset:0; z-index:80; background:rgba(90,140,160,.30);
  display:none; align-items:flex-end; justify-content:center;
}
#mask.show{display:flex;}
#sheet{
  position:relative; width:100%; max-width:560px; max-height:90vh;
  display:flex; flex-direction:column;
  background:var(--paper); border:1.5px dashed var(--line);
  border-radius:26px 26px 0 0;
  box-shadow:0 -6px 24px rgba(150,196,212,.28);
  animation:sheetUp .22s ease;
  /* ⚠️ 这里绝不能加 overflow:hidden —— 胶带和星星是故意探出面板外的
     （胶带 top:-9px 且旋转后实际探出 26.6px），裁掉就又是那个老 bug。
     形变展开期间的裁切由 JS 临时加/去，静止态保持可见。 */
}
@keyframes sheetUp{from{transform:translateY(30px);} to{transform:none;}}
/* 胶带探出弹层顶部 26.6px（旋转后的实测值），挂在不滚动的 #sheet 上 */
#sheet::before{
  content:''; position:absolute; left:12px; top:-9px; width:58px; height:21px;
  border-radius:2px;
  background:linear-gradient(135deg,#FDDCE6 0%,#FAC9D8 52%,#F7BCCE 100%);
  border:1px solid rgba(240,163,186,.75);
  transform:rotate(-38deg);
  box-shadow:0 2px 4px rgba(120,175,195,.30);
  pointer-events:none; z-index:3;
}
/* 内层滚动区：sticky 的标题栏要在这一层里才吸得住 */
#sheetScroll{
  flex:1 1 auto; min-height:0;
  overflow-y:auto; -webkit-overflow-scrolling:touch;
  border-radius:inherit;
}
.sheet-head{
  position:sticky; top:0; z-index:2;
  padding:15px 16px 12px;
  background:var(--paper); border-radius:26px 26px 0 0;
  display:flex; align-items:center; justify-content:space-between; gap:10px;
  box-shadow:0 2px 10px rgba(150,196,212,.14);
}
.sheet-head h2{margin:0; font-size:18px; letter-spacing:1px;}
.sheet-close{
  width:32px; height:32px; flex:none; border-radius:50%; font-size:16px;
  background:var(--paper); border:1.5px dashed var(--line);
  display:flex; align-items:center; justify-content:center;
}
.sheet-star{
  position:absolute; right:8px; top:-14px; width:34px; height:34px; z-index:4;
  background:url('./assets/bear/mark-sparkle.png') no-repeat center/contain;
  transform:rotate(10deg); pointer-events:none;
  filter:drop-shadow(0 2px 3px rgba(150,196,212,.35));
}
/* 弹层同理：独立模式下不再叠加 safe-area（理由见 .tabbar） */
.sheet-body{padding:14px 14px 20px;}
.fld{margin-bottom:15px;}
.fld > .lb{display:block; font-size:12.5px; color:var(--ink2); margin-bottom:7px;}
.fld input[type=text],.fld input[type=number],.fld input[type=password],
.fld input[type=datetime-local],.fld select{
  width:100%; padding:13px 15px; font-size:15px;
  background:var(--paper); border:1.5px dashed var(--line); border-radius:var(--r-sm);
  box-shadow:var(--sh-sm);
}
.fld input::placeholder{color:var(--ink3);}
.amount-box{
  padding:12px 15px; border-radius:var(--r-md);
  background:var(--pink-l); border:1.5px dashed rgba(245,139,168,.5);
}
.amount-box .k{font-size:11.5px; color:var(--pink-d); opacity:.8;}
.amount-box input{
  width:100%; border:none; background:transparent; font-size:32px; padding:2px 0 0;
  color:var(--ink);
}
.chips{display:grid; grid-template-columns:repeat(auto-fill,minmax(76px,1fr)); gap:9px;}
.cchip{
  padding:9px 3px; border-radius:var(--r-sm); text-align:center; font-size:11.5px;
  background:var(--paper); border:1.5px dashed var(--line); box-shadow:var(--sh-sm);
}
.cchip img{width:30px; height:30px; object-fit:contain; display:block; margin:0 auto 3px;}
.cchip.on{background:var(--pink-l); color:var(--pink-d); border-color:#FBC4D4; border-style:solid;}
.achips{display:flex; flex-wrap:wrap; gap:8px;}
.achip{
  padding:7px 14px; border-radius:999px; font-size:12.5px;
  background:var(--paper); border:1.5px dashed var(--line); box-shadow:var(--sh-sm);
}
.achip.on{background:var(--pink-l); color:var(--pink-d); border-color:#FBC4D4; border-style:solid;}
.btn{
  padding:12px 16px; border-radius:999px; font-size:14.5px;
  background:var(--paper); border:1.5px dashed var(--line); box-shadow:var(--sh-sm);
}
.btn:active{transform:scale(.97);}
.btn.primary{background:var(--pink-l); color:var(--pink-d); border-color:#FBC4D4; border-style:solid;}
.btn.danger{background:var(--pink); color:#fff; border-color:var(--pink); border-style:solid;
  box-shadow:0 2px 0 rgba(217,85,122,.35);}
.btn.block{width:100%; display:block; padding:14px; font-size:16px;}
.btn-row{display:flex; gap:10px;}
.btn-row .btn{flex:1;}

/* ---------- 二次确认层 ---------- */
#cfm{
  position:fixed; inset:0; z-index:90; background:rgba(90,140,160,.34);
  display:none; align-items:center; justify-content:center; padding:22px;
}
#cfm.show{display:flex;}
#cfmBox{
  width:100%; max-width:330px; padding:22px 20px; text-align:center;
  background:var(--paper); border:1.5px dashed var(--line); border-radius:var(--r-lg);
  box-shadow:0 10px 30px rgba(150,196,212,.32);

}
@keyframes cfmIn{from{transform:scale(.94); opacity:.6;} to{transform:none; opacity:1;}}
#cfmMsg{font-size:15px; line-height:1.65;}

/* ---------- toast ---------- */
#toast{
  position:fixed; left:50%; bottom:calc(var(--tabbar-h) + 26px);
  transform:translateX(-50%) translateY(10px);
  z-index:95; opacity:0; pointer-events:none;
  max-width:86vw; padding:11px 20px; border-radius:999px;
  background:rgba(90,140,160,.95); color:#fff; font-size:13px; text-align:center;
  box-shadow:var(--sh-sm);
  transition:opacity .18s, transform .18s;
}
#toast.show{opacity:1; transform:translateX(-50%) translateY(0);}

/* 顶部右侧探头的熊。
   账本/统计页的卡片右上角本来就坐着一只大熊（.st-bear / 首屏那只），
   两只挨太近会挤在一起，所以那两页把页头这只藏掉。 */
header::after{
  content:''; position:absolute; right:12px; top:calc(2px + env(safe-area-inset-top));
  width:46px; height:42px; pointer-events:none;
  background:url('./assets/bear/hero-welcome.png') no-repeat center/contain;
}
html[data-page="ledger"] header::after,
html[data-page="stats"] header::after{ display:none; }
/* 点击反馈：按下时轻微下沉，松手回弹 */
.tap{transition:transform .12s ease;}
.tap:active{transform:scale(.96);}
</style>
<script>
/* 首屏就判定是否「独立 App 模式」（加到主屏后从图标启动）——必须在 CSS 生效前设置。
   原先这个判断放在 boot() 里（页面底部），结果是首屏会先按「浏览器模式」渲染：
   那时 CSS 匹配 html:not([data-standalone]) 分支，底栏底部会多留一份
   env(safe-area-inset-bottom)（真机约 34px）；等 JS 跑完才切回 8px。
   JS 若因任何原因延迟（同步请求、SW 更新），用户就会看到底栏浮着的那一版。
   提到这里就与「待会吃什么 / 懒人记账 / 坚持 / 电子收纳」四处的做法一致了。 */
(function () {
  var sa = 0;
  try {
    if (window.navigator.standalone === true) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) sa = 1;
    else if (window.matchMedia && window.matchMedia('(display-mode: fullscreen)').matches) sa = 1;
  } catch (e) {}
  document.documentElement.setAttribute('data-standalone', sa ? '1' : '0');
})();
</script>
</head>

<script>
(function(){
'use strict';

/* ==========================================================================
   0. 基础工具
   ========================================================================== */
var $ = function(id){ return document.getElementById(id); };
var pad = function(n){ return n < 10 ? '0' + n : '' + n; };
var esc = function(s){
  return String(s == null ? '' : s)
    .replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;').replace(/'/g,'&#39;');
};
var round2 = function(n){ return Math.round(n * 100) / 100; };
function money(n){
  var v = round2(Number(n) || 0);
  return v.toFixed(2).replace(/\B(?=(\d{3})+(?!\d))/g, ',');
}
function shortMoney(n){
  var v = Math.abs(Number(n) || 0);
  if (v >= 10000) return (v/10000).toFixed(1).replace(/\.0$/,'') + 'w';
  if (v >= 1000)  return (v/1000).toFixed(1).replace(/\.0$/,'') + 'k';
  return String(Math.round(v));
}
function ymd(ts){ var d = new Date(ts); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
function hm(ts){ var d = new Date(ts); return pad(d.getHours())+':'+pad(d.getMinutes()); }
function ymOf(ts){ return ymd(ts).slice(0,7); }
function nowYm(){ var d = new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1); }
function daysInMonth(ym){
  var p = ym.split('-');
  return new Date(Number(p[0]), Number(p[1]), 0).getDate();
}
function relTime(ts){
  if (!ts) return '时间未知';
  var d = ymd(ts), today = ymd(Date.now()), yest = ymd(Date.now() - 86400000);
  if (d === today) return '今天 ' + hm(ts);
  if (d === yest)  return '昨天 ' + hm(ts);
  return d.slice(5) + ' ' + hm(ts);
}
function toast(msg){
  var t = $('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.classList.remove('show'); }, 1900);
}

/* 弹簧按压：给元素按下时轻微缩放（CSS 的 :active 在 iOS 上偶发不触发） */
function spring(el){
  if (!el || el._spring) return;
  el._spring = true;
  el.addEventListener('touchstart', function(){ el.classList.add('tap'); }, {passive:true});
}

/* ==========================================================================
   1. 数据
   --------------------------------------------------------------------------
   localStorage key 沿用 xiongji-v1：线上同一个网址，老用户的本机数据
   无缝继承（换 key 等于让朋友的账目凭空消失）。
   数据形状也保持一致：{ records:{id:rec}, budget, cats, cfg }
   ========================================================================== */
var LS_KEY = 'xiongji-v1';
var VERSION = 'v1.2';

var S = { records:{}, budget:0, cats:null, cfg:{ owner:'', repo:'', token:'', auto:false } };

function load(){
  try {
    var raw = localStorage.getItem(LS_KEY);
    if (raw) {
      var d = JSON.parse(raw);
      S.records = d.records || {};
      S.budget  = Number(d.budget) || 0;
      S.cats    = d.cats || null;
      S.cfg     = Object.assign({ owner:'', repo:'', token:'', auto:false }, d.cfg || {});
    }
  } catch(e){ console.warn('读取本机数据失败', e); }
  // 老记录可能没有 ts，补算一个，否则排序和分组会乱
  Object.keys(S.records).forEach(function(id){
    var r = S.records[id];
    if (!r) return;
    if (!r.ts) {
      var guess = Date.parse(String(r.time||'').replace(' ','T'));
      r.ts = isNaN(guess) ? Date.now() : guess;
    }
  });
}
function save(){
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({
      records:S.records, budget:S.budget, cats:S.cats, cfg:S.cfg
    }));
  } catch(e){ toast('本机存储写入失败'); }
}

/* ==========================================================================
   2. 分类
   ========================================================================== */
var CAT_ICON = {
  '餐饮':'cat-canyin', '购物':'cat-gouwu', '娱乐':'cat-yule', '医疗':'cat-yiliao',
  '学习':'cat-xuexi', '交通':'cat-jiaotong', '通讯':'cat-tongxun', '居住':'cat-juzhu',
  '人情':'cat-renqing', '日用':'cat-riyong', '其他':'cat-other'
};
var DEFAULT_CATS = [
  { name:'餐饮', type:'expense', kw:['饭','餐','吃','喝','午饭','早饭','晚饭','夜宵','外卖','美团','饿了么','食堂','咖啡','奶茶','星巴克','肯德基','麦当劳','汉堡','火锅','烧烤','小吃','米线','麻辣烫','拉面','面馆','牛肉面','盖饭','沙县','黄焖鸡','甜品','蛋糕','豆浆','粥','点心','快餐','简餐','酒馆','水果','买菜'] },
  { name:'购物', type:'expense', kw:['买','购物','超市','淘宝','天猫','京东','拼多多','唯品会','商场','服饰','衣服','鞋','优衣库','数码','家电','商城','旗舰店','便利店'] },
  { name:'娱乐', type:'expense', kw:['娱乐','电影','游戏','唱歌','ktv','演唱会','会员','视频','音乐','网易','腾讯视频','爱奇艺','优酷','bilibili','哔哩','steam','健身','游泳','按摩','足浴','酒吧','剧本杀','密室'] },
  { name:'医疗', type:'expense', kw:['医院','看病','药','买药','挂号','诊所','体检','医疗','口腔','牙科','门诊'] },
  { name:'学习', type:'expense', kw:['书','学习','培训','课程','学费','书店','考试','网课','文具','教材'] },
  { name:'交通', type:'expense', kw:['打车','出租车','滴滴','地铁','公交','高铁','火车','机票','航空','加油','停车','单车','哈啰','青桔','出行','车费','洗车','违章','摩拜','油费','过路费','高速','停车费','车票','船票','共享单车','电动车','充电桩','网约车'] },
  { name:'通讯', type:'expense', kw:['话费','流量','移动','联通','电信','宽带','网费','通讯','月租'] },
  { name:'居住', type:'expense', kw:['房租','租金','水费','电费','燃气','物业','取暖','中介费','押金','家政','保洁'] },
  { name:'人情', type:'expense', kw:['红包','礼金','礼物','随礼','转账','压岁','份子','小荷包','亲密付','代付'] },
  { name:'日用', type:'expense', kw:['纸巾','牙膏','洗发','沐浴','洗衣','清洁','日用','卫生纸','垃圾袋','日用百货'] },
  { name:'其他', type:'expense', kw:[] },
  { name:'工资', type:'income', kw:['工资','薪资','薪水','月薪','奖金','年终','绩效','补贴'] },
  { name:'兼职', type:'income', kw:['兼职','外快','私活','劳务'] },
  { name:'理财', type:'income', kw:['理财','基金','股票','利息','收益','余额宝','零钱通','定期'] },
  { name:'红包', type:'income', kw:['红包','压岁钱','礼金','转账','收款','转入','收到'] },
  { name:'报销', type:'income', kw:['报销','退款','退货','返现','赔付'] },
  { name:'其他收入', type:'income', kw:[] }
];
var ACCOUNTS = ['微信支付','支付宝','银行卡','现金','其他'];

function cats(){ return S.cats || DEFAULT_CATS; }
function catsOf(type){ return cats().filter(function(c){ return c.type === type; }); }
function catIcon(name, cls){
  var file = CAT_ICON[name] || 'cat-other';
  return '<img class="' + (cls||'') + '" src="./assets/bear/' + file + '.png" alt="">';
}
function autoCat(text, type){
  var s = String(text||'').toLowerCase();
  if (!s.trim()) return null;
  var best = null, bestLen = 0;
  catsOf(type).forEach(function(c){
    (c.kw||[]).forEach(function(k){
      var kk = String(k).toLowerCase();
      if (kk && s.indexOf(kk) >= 0 && kk.length > bestLen) { best = c.name; bestLen = kk.length; }
    });
  });
  return best;
}

/* ==========================================================================
   3. 记录读写
   ========================================================================== */
function addRecord(rec){
  rec.id = rec.id || ('r' + Date.now().toString(36) + Math.random().toString(36).slice(2,7));
  rec.ts = rec.ts || Date.now();
  S.records[rec.id] = rec;
  save();
  return rec;
}
function delRecord(id){
  delete S.records[id];
  save();
  pendingDeletes.push(id);
}
function allRecords(){
  return Object.keys(S.records).map(function(k){ return S.records[k]; })
    .filter(function(r){ return r && typeof r.amount === 'number'; });
}
function monthRecords(ym){
  return allRecords().filter(function(r){ return ymOf(r.ts) === ym; });
}
function sumOf(list, type){
  var t = 0;
  list.forEach(function(r){ if (r.type === type) t += Number(r.amount) || 0; });
  return round2(t);
}

/* ==========================================================================
   4. 渲染：通用
   ========================================================================== */
function catIconHtml(name, cls){
  var file = CAT_ICON[name] || 'cat-other';
  return '<img src="./assets/bear/' + file + '.png" alt="">';
}

/* ==========================================================================
   5. 渲染：记录页
   ========================================================================== */
function renderRecord(){
  var now = Date.now();
  var today = ymd(now), ym = ymOf(now);
  var todayOut = 0, todayCnt = 0, mOut = 0, mIn = 0;

  allRecords().forEach(function(r){
    if (ymd(r.ts) === today && r.type === 'expense') { todayOut += r.amount; todayCnt++; }
    if (ymOf(r.ts) === ym) { if (r.type === 'income') mIn += r.amount; else mOut += r.amount; }
  });

  $('todayAmt').innerHTML = '<small>¥</small>' + money(todayOut);
  $('todayCount').textContent = todayCnt + ' 笔';
  $('monthOut').textContent = money(mOut);
  $('monthIn').textContent = money(mIn);
  $('monthNet').textContent = money(mIn - mOut);

  var list = allRecords().sort(function(a,b){ return b.ts - a.ts; });
  $('feedCount').textContent = '共 ' + list.length + ' 笔';

  var feed = $('feed');
  if (!list.length) {
    feed.innerHTML =
      '<div class="card empty">' +
        '<img src="./assets/bear/hero-sleep.png" alt="">' +
        '<div class="t">账本还是空的<br>在上面说一句就记好啦</div>' +
        '<div class="t" style="color:var(--pink-d);">试试「午饭 15 块」</div>' +
      '</div>';
    return;
  }

  var html = '';
  list.slice(0, 30).forEach(function(r, i){
    var isIn = r.type === 'income';
    // 前两张卡和第四张贴胶带，其余留白，避免整屏都是胶带
    var tape = (i === 0 || i === 3) ? '<span class="tape"></span>'
             : (i === 1 ? '<span class="tape tr blue"></span>' : '');
    html +=
      '<div class="card rec" data-id="' + esc(r.id) + '">' + tape +
        '<div class="rec-icon">' + catIconHtml(r.category) + '</div>' +
        '<div class="rec-mid">' +
          '<div class="rec-cat">' + esc(r.category || '其他') + '</div>' +
          '<div class="rec-sub">' + esc(r.note || r.account || '—') + ' · ' + esc(relTime(r.ts)) + '</div>' +
        '</div>' +
        '<div class="row-amt' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '-') + money(r.amount) + '</div>' +
      '</div>';
  });
  feed.innerHTML = html;

  Array.prototype.forEach.call(feed.querySelectorAll('.rec'), function(el){
    el.addEventListener('click', function(){ openSheet(el.getAttribute('data-id')); });
  });
}

/* ==========================================================================
   6. 渲染：账本页
   ========================================================================== */
var ledgerYm = nowYm();

function renderLedger(){
  var ym = ledgerYm;
  var list = monthRecords(ym);
  var out = sumOf(list, 'expense'), inc = sumOf(list, 'income');

  $('ledgerLabel').textContent = ym.replace('-', ' 年 ') + ' 月 · 支出';
  $('ledgerAmt').textContent = '¥' + money(out);
  $('ledgerNet').textContent = money(inc - out);
  $('ledgerCount').textContent = list.length + ' 笔';

  var body = $('ledgerBody');
  if (!list.length) {
    body.innerHTML =
      '<div class="card empty">' +
        '<img src="./assets/bear/hero-read.png" alt="">' +
        '<div class="t">这个月还没有记录</div>' +
      '</div>';
    return;
  }

  // 按天分组
  var groups = {};
  list.forEach(function(r){
    var d = ymd(r.ts);
    (groups[d] = groups[d] || []).push(r);
  });
  var days = Object.keys(groups).sort().reverse();

  var html = '';
  days.forEach(function(d){
    var rs = groups[d].sort(function(a,b){ return b.ts - a.ts; });
    var dayOut = 0, dayIn = 0;
    rs.forEach(function(r){ if (r.type === 'income') dayIn += r.amount; else dayOut += r.amount; });

    var parts = d.split('-');
    var wd = '日一二三四五六'[new Date(d + 'T00:00:00').getDay()];
    html += '<div class="day-head">' +
      '<span>' + Number(parts[1]) + ' 月 ' + Number(parts[2]) + ' 日 · 周' + wd + '</span>' +
      '<span class="sm">' +
        (dayOut ? '支出 ' + money(dayOut) : '') +
        (dayOut && dayIn ? ' · ' : '') +
        (dayIn ? '收入 ' + money(dayIn) : '') +
      '</span></div>';

    rs.forEach(function(r){
      var isIn = r.type === 'income';
      html +=
        '<div class="card entry" data-id="' + esc(r.id) + '">' +
          '<div class="dot">' + catIconHtml(r.category) + '</div>' +
          '<div class="n">' + esc(r.category || '其他') +
            '<em>' + esc(r.note || r.account || '—') + ' · ' + esc(hm(r.ts)) + '</em></div>' +
          '<div class="a' + (isIn ? ' in' : '') + '">' + (isIn ? '+' : '-') + money(r.amount) + '</div>' +
        '</div>';
    });
  });
  body.innerHTML = html;

  Array.prototype.forEach.call(body.querySelectorAll('.entry'), function(el){
    el.addEventListener('click', function(){ openSheet(el.getAttribute('data-id')); });
  });
}

/* ==========================================================================
   7. 渲染：统计页
   ========================================================================== */
function renderStats(){
  var ym = ledgerYm;
  var list = monthRecords(ym);
  var out = sumOf(list, 'expense'), inc = sumOf(list, 'income');
  var dim = daysInMonth(ym);

  $('stAmt').textContent = '¥' + money(out);
  $('stCount').textContent = list.length + ' 笔';
  $('stIn').textContent = money(inc);
  $('stAvg').textContent = money(out / Math.max(1, new Date().getMonth()+1 === Number(ym.split('-')[1]) ? new Date().getDate() : dim));

  /* --- 分类占比（前 4） --- */
  var byCat = {};
  list.forEach(function(r){
    if (r.type !== 'expense') return;
    byCat[r.category || '其他'] = (byCat[r.category || '其他'] || 0) + r.amount;
  });
  var cats4 = Object.keys(byCat).map(function(k){ return { name:k, amt:byCat[k] }; })
    .sort(function(a,b){ return b.amt - a.amt; }).slice(0, 4);
  var maxCat = cats4.length ? cats4[0].amt : 1;

  var rows = $('catRows');
  if (!cats4.length) {
    rows.innerHTML = '<div style="font-size:13px;color:var(--ink3);text-align:center;padding:8px 0;">本月还没有支出</div>';
  } else {
    rows.innerHTML = cats4.map(function(c){
      var w = Math.max(6, Math.round(c.amt / maxCat * 100));
      return '<div class="cat-row">' +
        '<div class="cat-ico">' + catIconHtml(c.name) + '</div>' +
        '<div class="cat-name">' + esc(c.name) + '</div>' +
        '<div class="bar"><i style="width:' + w + '%;background:linear-gradient(90deg,#FBC4D4,#F58BA8);"></i></div>' +
        '<div class="cat-amt">' + money(c.amt) + '</div>' +
      '</div>';
    }).join('');
  }

  /* --- 预算 --- */
  var pct = S.budget > 0 ? Math.min(100, Math.round(out / S.budget * 100)) : 0;
  $('budPct').textContent = S.budget > 0 ? pct + '%' : '未设置';
  $('budFill').style.width = pct + '%';
  $('budUsed').textContent = '已用 ' + money(out);
  $('budLeft').textContent = S.budget > 0 ? ('剩余 ' + money(Math.max(0, S.budget - out))) : '未设预算';

  /* --- 近 6 个月 --- */
  var months = [];
  var base = new Date(ym + '-01T00:00:00');
  for (var i = 5; i >= 0; i--) {
    var d = new Date(base.getFullYear(), base.getMonth() - i, 1);
    months.push(d.getFullYear() + '-' + pad(d.getMonth()+1));
  }
  var mData = months.map(function(m){
    var rs = monthRecords(m);
    return { ym:m, out:sumOf(rs,'expense'), inc:sumOf(rs,'income') };
  });
  var mMax = Math.max.apply(null, mData.map(function(x){ return Math.max(x.out, x.inc); }).concat([1]));

  $('mbars').innerHTML = mData.map(function(x){
    var isCur = x.ym === ym;
    return '<div class="mcol' + (isCur ? ' on' : '') + '" data-ym="' + x.ym + '">' +
      '<div class="bars">' +
        '<i class="e" style="height:' + Math.max(2, Math.round(x.out / mMax * 100)) + '%"></i>' +
        '<i class="n" style="height:' + Math.max(2, Math.round(x.inc / mMax * 100)) + '%"></i>' +
      '</div>' +
      '<div class="lbl">' + Number(x.ym.split('-')[1]) + '月</div>' +
    '</div>';
  }).join('');

  Array.prototype.forEach.call($('mbars').querySelectorAll('.mcol'), function(el){
    el.addEventListener('click', function(){
      ledgerYm = el.getAttribute('data-ym');
      refresh();
    });
  });

  /* --- 每日支出 --- */
  var perDay = [];
  for (var k = 1; k <= dim; k++) perDay.push(0);
  list.forEach(function(r){
    if (r.type !== 'expense') return;
    var day = Number(ymd(r.ts).slice(8));
    if (day >= 1 && day <= dim) perDay[day-1] += r.amount;
  });
  var dMax = Math.max.apply(null, perDay.concat([1]));
  $('dchart').innerHTML = perDay.map(function(v){
    var h = v > 0 ? Math.max(4, Math.round(v / dMax * 100)) : 3;
    return '<i class="' + (v > 0 ? '' : 'z') + '" style="height:' + h + '%"></i>';
  }).join('');
  $('trendMax').textContent = '最高 ' + money(dMax);
  $('axisEnd').textContent = dim + ' 日';
}

/* ==========================================================================
   11. 记一笔 / 编辑弹层
   ==========================================================================
   ⚠️ 命名注意：底部 tab 栏的滑块叫 movePill()（全局，见上面）。
      收支切换的滑块叫 moveTypePill()（在 bind() 里），别跟它重名 ——
      同名时 bind() 内的定义会遮住全局那个，tab 栏滑块就再也不动了。 */
var editingId = null, curType = 'expense', curCat = '其他', curAcc = '微信支付';

/* ---------- 从按钮形变展开（Trigger Morph） ----------
   面板不是从屏幕底部滑上来，而是从被点那颗按钮的矩形「长」出来。
   ⚠️ 起点必须每次实时量按钮 rect：按钮宽度随文案和屏宽变，写死会错位。
   ⚠️ 用 Web Animations API 而不是弹簧：要能反向播放、能暂停到任意进度。
   遮罩和面板同时在动，时长一致；内部内容延迟到 62% 才淡入，
   否则面板还在变宽时文字会被横向压扁。 */
var morphAnims = [], morphHostBtn = null, morphSettleTimer = null;

/* 收尾一定要发生：WAAPI 的 finished 在后台标签页/被遮挡窗口里可能不触发，
   只靠它会出现「面板停在半路、关不掉」。用同长的定时器兜底，
   谁先到谁收尾，done 标记防止重复执行。 */
function armSettle(fn, ms){
  var done = false;
  clearTimeout(morphSettleTimer);
  morphSettleTimer = setTimeout(function(){ if (!done) { done = true; fn(); } }, ms + 60);
  return function(){ if (!done) { done = true; clearTimeout(morphSettleTimer); fn(); } };
}

function resetSheetInline(){
  var sheet = $('sheet');
  sheet.style.width = ''; sheet.style.height = ''; sheet.style.transform = '';
  sheet.style.opacity = ''; sheet.style.borderRadius = '';
  sheet.style.transformOrigin = ''; sheet.style.overflow = '';
}

function morphIn(btn){
  var mask = $('mask'), sheet = $('sheet'), inner = $('sheetScroll');
  morphHostBtn = btn || null;

  mask.classList.add('show');
  sheet.style.animation = 'none';      // 关掉旧的下滑动画，避免和形变打架
  sheet.style.visibility = 'visible';

  var sr = sheet.getBoundingClientRect();
  var br = btn ? btn.getBoundingClientRect() : null;

  if (FX.motionOff || !br || !br.width) {   // 降级 / 拿不到按钮：直接显示
    resetSheetInline();
    morphAnims = [];
    return;
  }

  sheet.style.transformOrigin = '0 0';
  // 形变期间才裁切（内容不会溢出成乱字）；结束后摘掉，
  // 否则胶带/星星探出面板的部分会被裁掉。
  sheet.style.overflow = 'hidden';

  var a1 = sheet.animate([
    { transform: 'translate(' + (br.left - sr.left) + 'px,' + (br.top - sr.top) + 'px)',
      width: br.width + 'px', height: br.height + 'px',
      borderRadius: '18px', opacity: .55 },
    { transform: 'translate(0,0)', width: sr.width + 'px', height: sr.height + 'px',
      borderRadius: '26px 26px 0 0', opacity: 1 }
  ], { duration: 620, easing: 'cubic-bezier(.22,.9,.24,1)', fill: 'both' });

  var a2 = inner.animate([
    { opacity: 0, transform: 'translateY(14px)' },
    { opacity: 0, transform: 'translateY(14px)', offset: .62 },
    { opacity: 1, transform: 'translateY(0)' }
  ], { duration: 620, easing: 'ease-out', fill: 'both' });

  var a3 = mask.animate([{ opacity: 0 }, { opacity: 1 }],
    { duration: 620, easing: 'ease-out', fill: 'both' });

  morphAnims = [a1, a2, a3];

  function finishIn(){
    try { a1.cancel(); a2.cancel(); a3.cancel(); } catch(e){}
    resetSheetInline();
    morphAnims = [];
  }
  a1.finished.then(finishIn).catch(finishIn);
  armSettle(finishIn, 620);
}

function morphOut(done){
  var mask = $('mask'), sheet = $('sheet'), inner = $('sheetScroll');
  var closing = morphAnims.slice();
  morphAnims = [];

  // 从当前可见几何量（不是从终态），这样中途反悔也不会跳
  var sr = sheet.getBoundingClientRect();
  var br = (morphHostBtn && morphHostBtn.isConnected)
    ? morphHostBtn.getBoundingClientRect()
    : null;

  closing.forEach(function(a){ try { a.cancel(); } catch(e){} });

  function teardown(){
    resetSheetInline();
    sheet.style.visibility = 'hidden';
    mask.classList.remove('show');
    if (done) done();
  }

  if (FX.motionOff || !br || !br.width || !sr.width) { teardown(); return; }

  sheet.style.transformOrigin = '0 0';
  sheet.style.overflow = 'hidden';

  var o1 = sheet.animate([
    { transform: 'translate(0,0)', width: sr.width + 'px', height: sr.height + 'px',
      borderRadius: '26px 26px 0 0', opacity: 1 },
    { transform: 'translate(' + (br.left - sr.left) + 'px,' + (br.top - sr.top) + 'px)',
      width: br.width + 'px', height: br.height + 'px', borderRadius: '18px', opacity: .35 }
  ], { duration: 420, easing: 'cubic-bezier(.4,0,.7,.3)', fill: 'both' });

  inner.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 220, easing: 'ease-in', fill: 'both' });
  mask.animate([{ opacity: 1 }, { opacity: 0 }], { duration: 420, easing: 'ease-in', fill: 'both' });

  // ⚠️ 用 finished.then 收尾，不要在 onfinish 里 cancel（会变成 oncancel，回调不再触发）
  o1.finished.then(function(){ o1.cancel(); teardown(); }).catch(teardown);
  armSettle(function(){ try { o1.cancel(); } catch(e){} teardown(); }, 420);
}

/* ==========================================================================
   13. 对话式记账
   ========================================================================== */
function parseChat(text){
  var s = String(text || '').trim();
  if (!s) return null;

  // 金额：支持「15」「15.5」「15块」「¥15」「15元」
  var m = s.match(/(?:¥|￥)?\s*(\d+(?:\.\d{1,2})?)\s*(?:块|元|块钱)?/);
  if (!m) return null;
  var amount = Number(m[1]);
  if (!amount || amount <= 0) return null;

  // 收入关键词
  var incomeWord = /(收到|收入|转入|收款|报销|退款|工资|发工资|奖金|红包收)/.test(s);
  var type = incomeWord ? 'income' : curType;

  // 备注：去掉金额和常见动词后的剩余文字
  var note = s.replace(m[0], ' ')
    .replace(/(今天|昨天|刚才|刚刚|花了|花|付了|付|买了|买|消费|支出|收入|收到|转账)/g, ' ')
    .replace(/\s+/g, ' ').trim();
  if (note.length > 18) note = note.slice(0, 18);

  var cat = autoCat(s, type) || (type === 'income' ? '其他收入' : '其他');
  return { amount:round2(amount), type:type, category:cat, note:note, ts:Date.now(), account:'微信支付' };
}
function sendChat(){
  var input = $('chatInput');
  var text = input.value;
  if (!text.trim()) return;
  var rec = parseChat(text);
  if (!rec) { toast('没听懂金额，试试「午饭 15 块」'); return; }
  addRecord(rec);
  input.value = '';
  refresh();
  toast('已记 ' + rec.category + ' ' + money(rec.amount));
}

/* ==========================================================================
   13.5 云端坏记录的容错解析
   --------------------------------------------------------------------------
   快捷指令 OCR 出来的账可能「带病上传」，实测三个毛病会同时出现：
     · 金额为空          "amount":,
     · 后面多一个游离引号  "src":"shortcut""
     · raw 里是真正的换行（JSON 字符串里不允许出现裸换行）
   这种文本直接 JSON.parse 一定抛错，整条记录就在同步时被静默丢掉 ——
   用户看到的现象就是「明明记了，App 里却没有」。

   所以这里手写一套宽松解析：先按原样试，再按几种修补组合试。
   金额补不出来时，从 raw 全文里再捞一次（支付宝账单页金额常独占一行）。
   ========================================================================== */
function escapeCtl(s){
  var out = '', inStr = false, esc = false;
  for (var i = 0; i < s.length; i++){
    var ch = s.charAt(i), code = s.charCodeAt(i);
    if (esc){ out += ch; esc = false; continue; }
    if (ch === '\\'){ out += ch; esc = true; continue; }
    if (ch === '"'){ inStr = !inStr; out += ch; continue; }
    if (inStr && code < 0x20){
      if (ch === '\n') out += '\\n'; else if (ch === '\r') out += '\\r'; else if (ch === '\t') out += '\\t';
      else out += '\\u' + ('000' + code.toString(16)).slice(-4);
      continue;
    }
    out += ch;
  }
  return out;
}
/* 跟 escapeCtl 的区别：字符串里遇到引号，先看后面是不是 , : } ] 或结尾，
   是才当收尾引号，否则当成内容里的引号转义掉。专门对付 "shortcut"" 这种多出来的引号。 */
function escapeCtlSmart(s){
  var out = '', inStr = false, esc = false;
  for (var i = 0; i < s.length; i++){
    var ch = s.charAt(i), code = s.charCodeAt(i);
    if (esc){ out += ch; esc = false; continue; }
    if (ch === '\\'){ out += ch; esc = true; continue; }
    if (ch === '"'){
      if (!inStr){ inStr = true; out += ch; continue; }
      var j = i + 1, nx = '';
      while (j < s.length && /\s/.test(s.charAt(j))) j++;
      nx = s.charAt(j);
      if (nx === ',' || nx === ':' || nx === '}' || nx === ']' || nx === ''){ inStr = false; out += ch; }
      else out += '\\"';
      continue;
    }
    if (inStr && code < 0x20){
      if (ch === '\n') out += '\\n'; else if (ch === '\r') out += '\\r'; else if (ch === '\t') out += '\\t';
      else out += '\\u' + ('000' + code.toString(16)).slice(-4);
      continue;
    }
    out += ch;
  }
  return out;
}
function fixEmptyVals(s){
  return s.replace(/:\s*,/g, ':0,').replace(/:\s*([}\]])/g, ':0$1').replace(/,\s*([}\]])/g, '$1');
}
function looseJson(text){
  var s = String(text == null ? '' : text);
  try { return { ok:true, obj:JSON.parse(s), repaired:false }; } catch(e){}
  var cands = [
    fixEmptyVals(s),
    escapeCtl(s),
    escapeCtl(fixEmptyVals(s)),
    s.replace(/[\r\n\t]/g, function(c){ return c === '\n' ? '\\n' : c === '\r' ? '\\r' : '\\t'; }),
    escapeCtlSmart(s),
    /* 三个毛病一起犯的那条 —— 少了它，带病记录一条都救不回来 */
    escapeCtlSmart(fixEmptyVals(s))
  ];
  for (var i = 0; i < cands.length; i++){
    try { return { ok:true, obj:JSON.parse(cands[i]), repaired:true }; } catch(e){}
  }
  return { ok:false, obj:null, repaired:false };
}
/* 从 OCR 全文里补金额。顺序有讲究：
     ① 带符号的两位小数  -28.80      （最可靠）
     ② 数字 + 「元」      28.8元
     ③ 独占一行的数字     28.80 / 30  （支付宝账单页金额常单独一行）
     ④ 带符号的整数       -30
   ①②④ 都加了「前面不是数字」的守卫，否则日期 2026-10-13 里的 -10 会抢在真金额前被匹配。 */
function parseRawAmount(text){
  var s = String(text || '');
  var m = s.match(/(?<![0-9])([+\-])\s*([0-9][0-9,]*\.[0-9]{1,2})/);
  if (m) return Math.abs(parseFloat(m[2].replace(/,/g, ''))) || 0;
  m = s.match(/([0-9][0-9,]*(?:\.[0-9]{1,2})?)\s*元/);
  if (m) return Math.abs(parseFloat(m[1].replace(/,/g, ''))) || 0;
  m = s.match(/^[ \t]*([+\-]?)([0-9][0-9,]*(?:\.[0-9]{1,2})?)[ \t]*$/m);
  if (m) return Math.abs(parseFloat(m[2].replace(/,/g, ''))) || 0;
  m = s.match(/(?<![0-9])([+\-])\s*([0-9][0-9,]*)(?![0-9.])/);
  if (m) return Math.abs(parseFloat(m[2].replace(/,/g, ''))) || 0;
  return 0;
}
function tsFromTime(t){
  var m = String(t || '').match(/(\d{4})-(\d{2})-(\d{2})[ _](\d{2}):(\d{2})/);
  if (m) return new Date(+m[1], +m[2] - 1, +m[3], +m[4], +m[5]).getTime();
  var p = Date.parse(String(t || '').replace(' ', 'T').replace(/_/g, 'T'));
  return isNaN(p) ? 0 : p;
}
/* 把云端拉下来的一条记录收拾成 App 内部形状。
   金额为空就翻 raw 找回；没有 ts 就用 time 补，否则排序和分组会乱。 */
function normalizeCloud(obj, idFromPath){
  var rec = {
    id: String(obj.id || idFromPath || ''),
    type: obj.type === 'income' ? 'income' : 'expense',
    amount: Math.abs(Number(obj.amount)) || 0,
    category: String(obj.category || ''),
    account: String(obj.account || ''),
    note: String(obj.note || ''),
    time: String(obj.time || '')
  };
  var raw = String(obj.raw || obj.ocr || '');
  if (raw) rec.raw = raw.slice(0, 2000);
  if (!rec.amount && raw) rec.amount = parseRawAmount(raw);
  rec.ts = tsFromTime(rec.time) || Date.now();
  var names = cats().map(function(c){ return c.name; });
  if (names.indexOf(rec.category) < 0) rec.category = rec.type === 'income' ? '其他收入' : '其他';
  return rec;
}

/* ==========================================================================
   14. GitHub 同步
   --------------------------------------------------------------------------
   数据放用户自己的私有仓库：一笔一个 JSON 文件，只增不改名，规避冲突。
   读用 Contents API（私有仓库 raw 域名匿名 404、带 token 被 CORS 拦）。
   ========================================================================== */
var pendingDeletes = [];
var syncBusy = false;

function cfgReady(){
  return !!(S.cfg.owner && S.cfg.repo && S.cfg.token);
}
function ghApi(path, opt){
  opt = opt || {};
  opt.headers = Object.assign({
    'Authorization':'Bearer ' + S.cfg.token,
    'Accept':'application/vnd.github+json',
    'X-GitHub-Api-Version':'2022-11-28'
  }, opt.headers || {});
  return fetch('https://api.github.com' + path, opt).then(function(res){
    if (!res.ok) return res.text().then(function(t){ throw new Error('GitHub ' + res.status + ': ' + t.slice(0,120)); });
    return res.status === 204 ? null : res.json();
  });
}
function cloudRec(r){
  // 只推业务字段，本机状态（ts 之类）不往云端带
  return { id:r.id, type:r.type, amount:r.amount, category:r.category,
           note:r.note || '', account:r.account || '', time:r.time || '' };
}
function b64(str){
  return btoa(unescape(encodeURIComponent(str)));
}
function unb64(str){
  return decodeURIComponent(escape(atob(String(str).replace(/\s/g,''))));
}

function sync(){
  if (!cfgReady()) { toast('先在「我的」里配置 GitHub'); return; }
  if (syncBusy) return;
  syncBusy = true;
  toast('同步中…');

  var repo = '/repos/' + S.cfg.owner + '/' + S.cfg.repo;

  // 1) 先删掉本机删过的
  var delChain = Promise.resolve();
  pendingDeletes.slice().forEach(function(id){
    delChain = delChain.then(function(){
      return ghApi(repo + '/contents/data/' + encodeURIComponent(id) + '.json')
        .then(function(info){ return ghApi(repo + '/contents/data/' + encodeURIComponent(id) + '.json',
          { method:'DELETE', body:JSON.stringify({ message:'del ' + id, sha:info.sha }) }); })
        .catch(function(){ /* 已经不在了就算了 */ });
    });
  });

  delChain.then(function(){
    // 2) 列出云端已有文件
    return ghApi(repo + '/git/trees/HEAD?recursive=1');
  }).then(function(tree){
    var cloud = {};
    (tree.tree || []).forEach(function(node){
      if (node.path && node.path.indexOf('data/') === 0 && /\.json$/.test(node.path)) {
        cloud[node.path.replace('data/','').replace('.json','')] = true;
      }
    });

    // 3) 本机有、云端没有的推上去
    var pushChain = Promise.resolve();
    var pushed = 0;
    allRecords().forEach(function(r){
      if (cloud[r.id]) return;
      pushChain = pushChain.then(function(){
        return ghApi(repo + '/contents/data/' + encodeURIComponent(r.id) + '.json', {
          method:'PUT',
          body: JSON.stringify({
            message:'add ' + r.id,
            content: b64(JSON.stringify(cloudRec(r)))
          })
        }).then(function(){ pushed++; })
          .catch(function(e){ console.warn('推送失败', r.id, e); });
      });
    });

    // 4) 云端有、本机没有的拉下来
    return pushChain.then(function(){
      var pullChain = Promise.resolve();
      var pulled = 0;
      Object.keys(cloud).forEach(function(id){
        if (S.records[id]) return;
        pullChain = pullChain.then(function(){
          return ghApi(repo + '/contents/data/' + encodeURIComponent(id) + '.json')
            .then(function(info){
              var obj = null;
              if (info && typeof info.content === 'string' && info.content){
                /* 带病记录（金额空 / 多引号 / raw 有裸换行）用宽松解析救回来，
                   别让 JSON.parse 抛错把整条记录吞掉。 */
                obj = looseJson(unb64(info.content)).obj;
                if (!obj){
                  try { obj = JSON.parse(unb64(info.content)); } catch(e){}
                }
              } else if (info && info.amount != null){
                obj = info;
              }
              if (!obj) return;
              var rec = normalizeCloud(obj, id);
              if (rec.amount > 0) { S.records[rec.id || id] = rec; pulled++; }
            })
            .catch(function(e){ console.warn('拉取失败', id, e); });
        });
      });
      return pullChain.then(function(){ return { pushed:pushed, pulled:pulled }; });
    });
  }).then(function(res){
    save();
    refresh();
    syncBusy = false;
    toast('同步完成 · 上传 ' + res.pushed + ' / 下载 ' + res.pulled);
  }).catch(function(e){
    syncBusy = false;
    toast('同步失败：' + e.message.slice(0, 40));
  });
}

/* ==========================================================================
   15. 弹簧内核 + 按压反馈
   ==========================================================================
   半隐式欧拉弹簧：k 刚度，d 阻尼（d 小 = 回弹明显）。
   全局一条 rAF 驱动所有弹簧 —— 每个动效各起一条 rAF 会互相错帧，
   而且按下/松手两组参数必须落到同一个值上，否则缩放会抖。
   ⚠️ dt 要钳制：切后台再回来时会攒出巨大 dt，弹簧一步就飞出去。 */
(function(){
  var clamp = function(v,a,b){ return Math.min(b, Math.max(a, v)); };
  window.FX = { motionOff:false, springs:[] };

  try {
    var mq = window.matchMedia('(prefers-reduced-motion: reduce)');
    FX.motionOff = mq.matches;
    mq.addEventListener && mq.addEventListener('change', function(e){ FX.motionOff = e.matches; });
  } catch(e){}

  function makeSpring(x, k, d){ return { x:x, v:0, t:x, k:k, d:d }; }
  window.makeSpring = makeSpring;

  function step(s, dt){
    if (FX.motionOff) { s.x = s.t; s.v = 0; return; }
    s.v += (s.t - s.x) * s.k * dt;
    s.v *= Math.exp(-s.d * dt);
    s.x += s.v * dt;
  }
  window.stepSpring = step;

  var last = performance.now();
  function loop(now){
    var dt = clamp((now - last) / 1000, 0.001, 0.033);
    last = now;
    for (var i = 0; i < FX.springs.length; i++){
      var f = FX.springs[i];
      if (f.step(dt) === false) { FX.springs.splice(i,1); i--; }
    }
    requestAnimationFrame(loop);
  }
  requestAnimationFrame(function(t){ last = t; requestAnimationFrame(loop); });

  // 注册一条弹簧：step 回 false 表示已静止，自动摘掉并回调 onRest
  window.addSpring = function(s, onFrame, restEps, onRest){
    var eps = restEps || 0.0015;
    FX.springs.push({
      step: function(dt){
        step(s, dt);
        onFrame(s.x);
        var moving = Math.abs(s.v) > eps || Math.abs(s.t - s.x) > eps;
        if (!moving && onRest) onRest();
        return moving;
      }
    });
  };

  /* 按压回弹：按下过阻尼（ζ≈0.62，按住不晃），松手欠阻尼（ζ≈0.31，出回弹）。
     ⚠️ 两组参数是这套效果的关键 —— 按下若用欠阻尼，按住期间按钮会自己抖。
     ⚠️ 弹簧要「按需注册、静止后注销」：常驻注册会让每颗按钮一直跑 rAF；
       而用时间戳守卫又会出现「松手太快 → 松手弹簧注册不上」的漏动效。 */
  window.bindPress = function(el, opt){
    opt = opt || {};
    var lo = opt.lo === undefined ? 0.93 : opt.lo;
    var hi = opt.hi === undefined ? 1 : opt.hi;
    var pressK = opt.pressK || 470, pressD = opt.pressD || 27;
    var relK   = opt.releaseK || 380, releaseD = opt.releaseD || 12;

    var s = makeSpring(hi, pressK, pressD);
    var live = false;

    function paint(){
      // 只在值真的变了才写样式（多按钮同屏时每帧盲写会反复失效样式）
      var v = Math.round(s.x * 10000) / 10000;
      if (v !== el.__lastS) {
        el.__lastS = v;
        el.style.transform = v === 1 ? '' : 'scale(' + v.toFixed(4) + ')';
      }
    }
    function wake(){
      if (live) return;
      live = true;
      addSpring(s, paint, 0.002, function(){ live = false; });
    }

    function down(){
      s.k = pressK; s.d = pressD; s.t = lo;
      if (FX.motionOff) { el.style.transform = 'scale(0.97)'; return; }
      wake();
    }
    function up(){
      s.k = relK; s.d = releaseD; s.t = hi;
      if (FX.motionOff) { el.style.transform = ''; return; }
      wake();
    }

    el.addEventListener('pointerdown', function(e){ el.setPointerCapture && el.setPointerCapture(e.pointerId); down(); });
    // pointercancel / 失焦都要当松手，否则按住态会卡住
    el.addEventListener('pointercancel', up);
    el.addEventListener('pointerup', up);
    el.addEventListener('lostpointercapture', up);
    // 键盘触发也要有反馈（Space/Enter 没有坐标）
    el.addEventListener('keydown', function(e){ if (e.key === ' ' || e.key === 'Enter') down(); });
    el.addEventListener('keyup', up);
    el.addEventListener('blur', up);

    paint();
    return { down: down, up: up, spring: s };
  };
})();

/* ==========================================================================
   16. 检查更新
   ========================================================================== */
function checkUpdate(){
  if (!('serviceWorker' in navigator)) { toast('当前环境不支持离线缓存'); return; }
  navigator.serviceWorker.getRegistrations().then(function(regs){
    var mine = regs.filter(function(r){ return r.scope.indexOf('/xiongji/') >= 0 || r.scope.indexOf(location.pathname.replace(/[^/]*$/,'')) === 0; });
    if (!mine.length) { toast('离线缓存未启用'); return; }
    return Promise.all(mine.map(function(r){ return r.update(); })).then(function(){
      toast('已检查，正在刷新…');
      setTimeout(function(){ location.reload(); }, 700);
    });
  }).catch(function(){ toast('检查更新失败'); });
}

/* ==========================================================================
   17. 事件绑定
   ========================================================================== */
function bind(){
  /* 形变展开需要知道「是哪颗按钮被点的」——事件委托里拿不到，
     所以在捕获阶段记下最近的 button，供 morphIn 使用。 */
  document.addEventListener('pointerdown', function(e){
    var t = e.target && e.target.closest ? e.target.closest('button') : null;
    if (t) window.__lastTap = t;
  }, true);

  // 页面切换
  Array.prototype.forEach.call(document.querySelectorAll('.tab'), function(el){
    el.addEventListener('click', function(){ showPage(el.getAttribute('data-page')); });
  });

  // 记账
  $('chatSend').onclick = sendChat;
  $('chatInput').addEventListener('keydown', function(e){
    if (e.key === 'Enter') { e.preventDefault(); sendChat(); }
  });

  /* 支出/收入：粉色滑块跟随 + 两个按钮都带弹簧按压。
     滑块位置从按钮实时 rect 算，不写死 —— 屏宽和文案都会影响按钮宽度。
     滑块用 CSS 过渡而不是 rAF 弹簧：它是「滑到某个位置」的定位行为，
     用弹簧一旦 rAF 被节流（后台标签 / 被遮挡窗口）就卡在半路；
     过渡由合成器驱动，不受影响，而且和形变展开用同一条缓动曲线。 */
  var typePill = $('typePill'), typeEx = $('typeEx'), typeIn = $('typeIn');

  function moveTypePill(animate){
    var box = typeEx.parentNode.getBoundingClientRect();
    var r = (curType === 'income' ? typeIn : typeEx).getBoundingClientRect();
    if (!r.width || !box.width) return;       // 还没布局完，等下一次
    var x = r.left - box.left, w = r.width;

    typePill.style.height = r.height + 'px';

    if (!animate) {
      // 初始定位 / 尺寸变化：先关过渡、写值、强制提交，再放开过渡。
      // ⚠️ 顺序必须是「关过渡 → 写值 → 回流 → 开过渡」；
      //    先回流再写值的话，写进去的起点和终点在同一帧，过渡不会启动。
      typePill.classList.add('noanim');
      typePill.style.transform = 'translateX(' + x + 'px)';
      typePill.style.width = w + 'px';
      void typePill.offsetWidth;              // 提交起始值
      typePill.classList.add('ready');
      typePill.classList.remove('noanim');
    } else {
      // 点击切换：同一个 tick 里写两个属性，过渡自动从当前值跑到新值
      typePill.style.transform = 'translateX(' + x + 'px)';
      typePill.style.width = w + 'px';
      typePill.classList.add('ready');
    }
  }
  function paintTypes(animate){
    var income = curType === 'income';
    typePill.classList.toggle('income', income);
    typeEx.className = income ? 'type-btn' : 'type-btn on-ex';
    typeIn.className = income ? 'type-btn on-in' : 'type-btn';
    $('chatInput').placeholder = income
      ? '记一笔收入… 例如「收到工资 5200」'
      : '记一笔… 例如「午饭 15 块」';
    moveTypePill(animate);
  }
  // 初始必须同步写一次，否则首帧前滑块停在左上角
  setTimeout(function(){ moveTypePill(false); }, 0);
  window.addEventListener('resize', function(){ moveTypePill(false); });
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(function(){ moveTypePill(false); });

  typeEx.onclick = function(){ curType = 'expense'; paintTypes(true); };
  typeIn.onclick = function(){ curType = 'income';  paintTypes(true); };

  bindPress(typeEx);
  bindPress(typeIn);
  bindPress($('chatSend'), { lo:0.90, pressK:470, pressD:27, releaseK:380, releaseD:12 });

  // 月份面板
  $('dateBtn').onclick = openDp;
  $('dpMask').onclick = closeDp;

  // 弹层关闭
  $('mask').addEventListener('click', function(e){ if (e.target === $('mask')) closeSheet(); });

  // 我的页功能格
  Array.prototype.forEach.call(document.querySelectorAll('.feat'), function(el){
    bindPress(el, { lo:0.96, hi:1, pressK:470, pressD:27, releaseK:380, releaseD:12 });
    el.addEventListener('click', function(){
      var act = el.getAttribute('data-act');
      if (act === 'cats')   return openCats();
      if (act === 'export') return openExport();
      if (act === 'sync')   return openSync();
      if (act === 'about')  return openAbout();
      if (act === 'wipe')   return openWipe();
      if (act === 'update') return checkUpdate();
    });
  });

  // 预算
  $('btnBudget').onclick = openBudget;

  // 尺寸变化时同步布局变量
  setAppHeight();
  window.addEventListener('resize', setAppHeight);
  window.addEventListener('orientationchange', function(){ setTimeout(setAppHeight, 160); });

  // 回到前台时自动同步
  document.addEventListener('visibilitychange', function(){
    if (!document.hidden && S.cfg.auto && cfgReady()) sync();
  });
}

/* 量尺寸：把「body 高度」「页头高度」「任务栏高度」写成 CSS 变量。
   ⚠️ --app-h 是必需的，别删（2026-10-14 踩过：删掉后底栏又悬空了）。
   iOS 独立 App 下 100vh/100% 偏小，只有读 window.innerHeight 才和真实可视区对齐；
   visualViewport 兜底应付地址栏收展。 */
function setAppHeight(){
  var h = window.innerHeight;
  if (window.visualViewport && window.visualViewport.height > h) h = window.visualViewport.height;
  document.documentElement.style.setProperty('--app-h', h + 'px');
  var head = document.querySelector('header');
  if (head) document.documentElement.style.setProperty('--head-h', head.offsetHeight + 'px');
  var tb = document.querySelector('.tabbar');
  if (tb) document.documentElement.style.setProperty('--tab-h', tb.offsetHeight + 'px');
  movePill();
}
/* 判断是不是「加到主屏」的独立模式：决定底部要不要留 safe-area */
function setStandalone(){
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches);
  document.documentElement.setAttribute('data-standalone', standalone ? '1' : '0');
}

/* 禁双指捏合缩放（viewport 在 iOS 无效，靠手势事件拦） */
function lockZoom(){
  ['gesturestart','gesturechange','gestureend'].forEach(function(ev){
    document.addEventListener(ev, function(e){ e.preventDefault(); }, { passive:false });
  });
  document.addEventListener('touchmove', function(e){
    if (e.touches && e.touches.length > 1) e.preventDefault();
  }, { passive:false });
}

/* ==========================================================================
   18. 启动
   ========================================================================== */
function boot(){
  setStandalone();
  lockZoom();
  load();
  bind();
  showPage('record');
  refresh();
  setAppHeight();

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js', { scope:'./' }).catch(function(){});
  }
  if (S.cfg.auto && cfgReady()) setTimeout(sync, 800);
}

if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', boot);
else boot();

})();
</script>
